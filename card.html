<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="version" content="1.0.1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Digital contact card (L, 2026-10-26: "make me a page like this" after a site super's qrco.de card).
       One page, no libraries: the QR printed on cards/stickers points here; Save Contact builds the vCard in the
       browser. Edit the CARD object below to change any detail. -->
  <title>Luis Curbelo — Contact</title>
  <meta name="description" content="Luis Curbelo — Smart Solutions. Call, email, or save the contact.">
  <meta property="og:title" content="Luis Curbelo — Contact">
  <meta property="og:description" content="Call, email, or save the contact.">
  <meta property="og:url" content="https://smartelectronicssolutions.com/card.html">
  <link rel="canonical" href="https://smartelectronicssolutions.com/card.html">
  
  <style>
    :root { --brand: #7a1f2b; --brand-2: #5c1620; --ink: #1d1d1f; --muted: #6b6b70; --line: #ececee; --bg: #f6f6f7; --card: #fff; }
    @media (prefers-color-scheme: dark) { :root { --ink: #f2f2f3; --muted: #a2a2a8; --line: #2c2c30; --bg: #121214; --card: #1c1c1f; } }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); }
    .band { background: linear-gradient(160deg, var(--brand), var(--brand-2)); height: 190px; }
    .card { max-width: 440px; margin: -150px auto 32px; background: var(--card); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.18); overflow: hidden; }
    .head { background: linear-gradient(160deg, var(--brand), var(--brand-2)); color: #fff; text-align: center; padding: 30px 20px 0; }
    .head h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
    .head p { margin: 6px 0 22px; opacity: .85; font-size: .95rem; }
    .actions { display: grid; grid-template-columns: 1fr; border-top: 1px solid rgba(255,255,255,.18); }
    .actions a { color: #fff; text-decoration: none; padding: 14px 0 12px; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .actions a + a { border-left: 1px solid rgba(255,255,255,.18); }
    .actions a:active { background: rgba(255,255,255,.12); }
    svg { width: 22px; height: 22px; fill: currentColor; }
    .rows { padding: 12px 26px 6px; }
    .row { display: flex; gap: 18px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
    .row svg { color: var(--muted); flex: none; margin-top: 2px; }
    .row b { display: block; font-weight: 500; word-break: break-word; }
    .row small { color: var(--muted); }
    .save { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 22px 26px 28px; padding: 14px; border: 0; border-radius: 8px; width: calc(100% - 52px); background: var(--brand); color: #fff; font-size: .9rem; letter-spacing: .05em; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 12px rgba(122,31,43,.35); }
    .save:active { transform: translateY(1px); }
    .qr { text-align: center; padding: 0 0 26px; color: var(--muted); font-size: .8rem; }
    .qr img { width: 150px; height: 150px; background: #fff; padding: 8px; border-radius: 8px; }
    @media (max-width: 480px) { .card { margin: -150px 16px 24px; } }
  </style>
</head>
<body>
  <div class="band"></div>
  <main class="card">
    <section class="head">
      <h1 id="name"></h1>
      <p id="title"></p>
      <nav class="actions">
        <a id="aMail"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>Email</a>
      </nav>
    </section>
    <section class="rows" id="rows"></section>
    <button class="save" id="save"><svg viewBox="0 0 24 24"><path d="M15 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2zm9 4c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/></svg>Save contact</button>
    <div class="qr"><img src="card-qr.png" alt="QR code for this page"><br>Scan to open this card</div>
  </main>
  <script>
    // THE CARD - every detail on the page and in the saved contact comes from here.
    const CARD = {
      first: "Luis", last: "Curbelo",
      title: "Low Voltage & Field Technician",
      org: "Smart Solutions",
      email: "luis@smartelectronicssolutions.com",
      web: "https://smartelectronicssolutions.com",
      city: "New Britain, CT"
    };
    const $ = id => document.getElementById(id);
    $("name").textContent = `${CARD.first} ${CARD.last}`;
    $("title").textContent = CARD.title;
    $("aMail").href = `mailto:${CARD.email}`;
    const ICON = {
      mail: '<path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z"/>',
      work: '<path d="M20 6h-4V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zm-6 0h-4V4h4z"/>',
      web: '<path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm6.9 6h-2.9a15.7 15.7 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8zM12 4a14 14 0 0 1 1.9 4h-3.8A14 14 0 0 1 12 4zM4.3 14a8.2 8.2 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4zm.8 2h2.9a15.7 15.7 0 0 0 1.4 3.6A8 8 0 0 1 5.1 16zM8 8H5.1a8 8 0 0 1 4.3-3.6A15.7 15.7 0 0 0 8 8zm4 12a14 14 0 0 1-1.9-4h3.8A14 14 0 0 1 12 20zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4zm.3 5.6A15.7 15.7 0 0 0 16 16h2.9a8 8 0 0 1-4.3 3.6zM16.3 14a16.5 16.5 0 0 0 0-4h3.4a8.2 8.2 0 0 1 0 4z"/>',
      pin: '<path d="M12 2a7 7 0 0 0-7 7c0 5.3 7 13 7 13s7-7.7 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 14.5 9 2.5 2.5 0 0 1 12 11.5z"/>'
    };
    const rows = [
      ["mail", CARD.email, "Email", `mailto:${CARD.email}`],
      ["work", CARD.org, CARD.title, null],
      ["web", CARD.web.replace("https://", ""), "Website", CARD.web],
      ["pin", CARD.city, "Location", null]
    ];
    $("rows").innerHTML = rows.map(([i, b, s, href]) =>
      `<${href ? `a href="${href}"` : "div"} class="row"><svg viewBox="0 0 24 24">${ICON[i]}</svg><span><b>${b}</b><small>${s}</small></span></${href ? "a" : "div"}>`).join("");
    $("save").onclick = () => {
      const v = ["BEGIN:VCARD", "VERSION:3.0", `N:${CARD.last};${CARD.first};;;`, `FN:${CARD.first} ${CARD.last}`,
        `ORG:${CARD.org}`, `TITLE:${CARD.title}`, `EMAIL;TYPE=WORK:${CARD.email}`,
        `URL:${CARD.web}`, `ADR;TYPE=WORK:;;;New Britain;CT;;USA`, "END:VCARD"].join("\r\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([v], { type: "text/vcard" }));
      a.download = `${CARD.first}_${CARD.last}.vcf`; document.body.appendChild(a); a.click(); a.remove();
    };
  </script>
</body>
</html>
