<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Droplet">
  <title>Droplet</title>
  <!-- The mark on its own: the badge that replaces the "o" in the wordmark.
       Pure geometry, no font, no external anything - so it survives being loaded as <img>,
       inlined, rasterised to a favicon, or dropped into an app icon at 16px.

       Colour is declared TWICE on purpose. The stop-color ATTRIBUTES are plain hex, because
       var() is not legal in a presentation attribute and a renderer that ignores CSS - which is
       most of them outside a browser - draws the whole thing black if you try. The <style> block
       then restates the same values through custom properties; CSS beats a presentation
       attribute, so in a browser the properties win and the mark can be themed by the host page,
       while everywhere else the hex stands on its own. -->
  <defs>
    <radialGradient id="dm-badge" cx="38%" cy="30%" r="78%">
      <stop offset="0%"   stop-color="#7CA6CE"/>
      <stop offset="100%" stop-color="#47688E"/>
    </radialGradient>
    <linearGradient id="dm-drop" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%"   stop-color="#F2FAFF"/>
      <stop offset="45%"  stop-color="#A9DCF8"/>
      <stop offset="100%" stop-color="#4FA8E6"/>
    </linearGradient>
    <style>
      #dm-badge stop:nth-child(1) { stop-color: var(--droplet-badge-hi, #7CA6CE); }
      #dm-badge stop:nth-child(2) { stop-color: var(--droplet-badge-lo, #47688E); }
      #dm-drop  stop:nth-child(1) { stop-color: var(--droplet-drop-hi,  #F2FAFF); }
      #dm-drop  stop:nth-child(2) { stop-color: var(--droplet-drop-mid, #A9DCF8); }
      #dm-drop  stop:nth-child(3) { stop-color: var(--droplet-drop-lo,  #4FA8E6); }
    </style>
  </defs>

  <circle cx="32" cy="32" r="32" fill="url(#dm-badge)"/>

  <!-- teardrop: a point at the top, sides falling to a true half-circle bottom (r=13 at 32,39),
       which is what keeps it reading as a droplet rather than a leaf at small sizes -->
  <path d="M32 14 C32 14 45 30 45 39 A13 13 0 0 1 19 39 C19 30 32 14 32 14 Z"
        fill="url(#dm-drop)"/>

  <!-- the specular catch-light, up and to the left, the way the source has it -->
  <ellipse cx="26.5" cy="36" rx="3.6" ry="5.6" fill="#ffffff" opacity="0.5"
           transform="rotate(-18 26.5 36)"/>
</svg>
