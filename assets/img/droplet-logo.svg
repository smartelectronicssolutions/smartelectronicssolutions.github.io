<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 406 140" role="img" aria-label="Droplet">
  <title>Droplet</title>
  <!-- 2026-09-26 (L): the r and the p were touching the badge - D+r moved 8 left, p/l/e/t 3 right, badge 1.10 (was 1.20), same centre.
       The full lockup, rebuilt from the 422x140 JPEG he was sent: transparent, scalable, and with
       the letters converted to OUTLINES so there is no font to load and nothing to fall back to.
       An SVG used as <img> or rasterised to an icon never fetches a webfont, so live text would
       have quietly stopped being the logo in exactly the places a logo gets used.

       Letterforms are Nunito ExtraBold, a close match to the source, not the original outlines -
       I did not have the vector or the font name. Get either from him and this becomes exact.

       Gradient stops carry plain hex ATTRIBUTES plus a <style> restating them as custom
       properties: var() is not legal in a presentation attribute, so the hex is what stops this
       rendering black outside a browser, while the CSS lets a host page retheme it when inlined.

       The badge is centred on the measured bounding box of the "o" it replaces. -->
  <defs>
    <linearGradient id="dl-word" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#4A7EBD"/>
      <stop offset="55%"  stop-color="#6BA8DF"/>
      <stop offset="100%" stop-color="#8ACCF4"/>
    </linearGradient>
    <radialGradient id="dl-badge" cx="38%" cy="30%" r="78%">
      <stop offset="0%"   stop-color="#7CA6CE"/>
      <stop offset="100%" stop-color="#47688E"/>
    </radialGradient>
    <linearGradient id="dl-drop" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%"   stop-color="#F2FAFF"/>
      <stop offset="45%"  stop-color="#A9DCF8"/>
      <stop offset="100%" stop-color="#4FA8E6"/>
    </linearGradient>
    <style>
      #dl-word  stop:nth-child(1) { stop-color: var(--droplet-word-a,   #4A7EBD); }
      #dl-word  stop:nth-child(2) { stop-color: var(--droplet-word-b,   #6BA8DF); }
      #dl-word  stop:nth-child(3) { stop-color: var(--droplet-word-c,   #8ACCF4); }
      #dl-badge stop:nth-child(1) { stop-color: var(--droplet-badge-hi, #7CA6CE); }
      #dl-badge stop:nth-child(2) { stop-color: var(--droplet-badge-lo, #47688E); }
      #dl-drop  stop:nth-child(1) { stop-color: var(--droplet-drop-hi,  #F2FAFF); }
      #dl-drop  stop:nth-child(2) { stop-color: var(--droplet-drop-mid, #A9DCF8); }
      #dl-drop  stop:nth-child(3) { stop-color: var(--droplet-drop-lo,  #4FA8E6); }
    </style>
  </defs>

