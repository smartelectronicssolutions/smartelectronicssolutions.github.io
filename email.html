<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email — Smart Solutions</title>
  <link rel="stylesheet" href="assets/css/master.css" />
  <link rel="icon" href="assets/img/favicon.ico" />
  <!-- Triage UI retired 2026-08-03: email now streams to Telegram (REaD group)
       via personal-svc + email-chat-notify on se. This page is just a launcher
       for the web clients. Old UI lives in git history. -->
  <style>
    body { padding: 0; margin: 0; overflow-x: hidden; }
    *, *::before, *::after { box-sizing: border-box; }
    main { max-width: 700px; margin: 0 auto; padding: 16px 20px 32px; width: 100%; }

    .intro {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px;
      display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
    }
    .intro h1 { margin: 0; font-size: 1.1rem; }
    .intro .hint { font-size: 0.85rem; color: var(--muted); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }

    .acct {
      display: block; text-decoration: none; color: var(--text);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
      border-left: 4px solid var(--border);
      transition: border-color .15s, transform .1s;
    }
    .acct:hover { border-color: var(--accent); transform: translateY(-1px); }
    .acct .name { font-weight: 600; margin-bottom: 2px; }
    .acct .client { font-size: 0.75rem; color: var(--accent); margin-top: 6px; text-transform: uppercase; letter-spacing: 1px; }

    .acct.gmail   { border-left-color: rgba(96, 165, 250, 0.9); }
    .acct.outlook { border-left-color: rgba(56, 189, 248, 0.9); }
    .acct.domain  { border-left-color: rgba(251, 113, 60, 0.9); }
  </style>
</head>

<body>
  <div id="header-placeholder"></div>

  <main>
    <div class="intro">
      <h1>Email</h1>
      <span class="hint">New mail streams live to the Telegram group — these open the web clients.</span>
    </div>

    <div class="grid">
      <a class="acct gmail" target="_blank" rel="noopener" href="https://mail.google.com/mail/">
        <div class="name">Gmail</div>
        <div class="client">mail.google.com ↗</div>
      </a>
      <a class="acct outlook" target="_blank" rel="noopener" href="https://outlook.live.com/mail/">
        <div class="name">Outlook</div>
        <div class="client">outlook.live.com ↗</div>
      </a>
      <a class="acct domain" target="_blank" rel="noopener" href="https://mail.smartelectronicssolutions.com/">
        <div class="name">Domain Mail</div>
        <div class="client">mail.smartelectronicssolutions.com ↗</div>
      </a>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
