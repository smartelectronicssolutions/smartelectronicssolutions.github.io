<!doctype html>
<!-- Telaid Dashboard v2 - one card per SITE with the real numbers (2026-10-10, L: "update it to show real info about the
     site with links also to edit maybe info" -> "go dashboard"). The old QC-checklist table (it read pre-Radar fields, so
     every job showed INCOMPLETE and dashes) lives on at radar-dashboard-qc.html.
     DATA (one read per load, no timers - poll-loop scar): telaid-data.js listSites/loadTasks on the picked account
     (Luis' Account dropdown, else the signed-in tree) - the canonical record per site holds the Sensors list,
     qcData_radar (site_info, nightly_production, final_scoring), siteTables (IDF hubs) and the new fields
     siteStatus + siteLinks {push: {label, url}}. Every value marked ✎ is tap-to-edit and writes straight back. -->
<html lang="en">
<head>
  <script>(function(){try{if(localStorage.getItem("ss-theme")==="light")document.documentElement.classList.add("light")}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telaid Dashboard</title>
  <link rel="icon" href="./assets/img/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="./assets/css/radartools.css?v=20261007c" />
  <script type="module" src="./assets/js/telaid-shell.js?v=20261007b"></script>
  <script type="module" src="../assets/js/login.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <style>
    .db-wrap{max-width:1100px;margin:0 auto;padding:12px 14px 40px}
    .db-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}
    .db-bar input[type=search]{flex:1;min-width:180px;padding:8px 10px;border-radius:8px;border:1px solid var(--border,#2a3542);background:var(--panel,#0f1720);color:inherit}
    .db-muted{opacity:.7;font-size:.82rem}
    .site{border:1px solid var(--border,#2a3542);border-radius:12px;background:var(--panel,#0f1720);margin-bottom:14px;overflow:hidden}
    .site-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:12px 14px;cursor:pointer}
    .site-h h2{margin:0;font-size:1.05rem}
    .site-h .pill{font-size:.7rem;padding:2px 8px;border-radius:99px;border:1px solid var(--border,#2a3542)}
    .pill.active{background:#14532d;border-color:#166534;color:#bbf7d0}.pill.return{background:#713f12;border-color:#a16207;color:#fde68a}.pill.closed{opacity:.7}
    .site-b{display:none;padding:0 14px 14px}
    .site.open .site-b{display:block}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
    .box{border:1px solid var(--border,#2a3542);border-radius:10px;padding:10px 12px}
    .box h3{margin:0 0 8px;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
    .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.86rem}
    .kv div:nth-child(odd){opacity:.7}
    .ed{cursor:pointer;border-bottom:1px dashed rgba(127,127,127,.5)}
    .ed:empty::before{content:"tap to add";opacity:.45}
    .ed[contenteditable=true]{outline:1px solid #3b82f6;border-radius:4px;padding:0 3px;cursor:text}
    .big{font-size:1.5rem;font-weight:800}
    .bar{height:8px;border-radius:99px;background:rgba(127,127,127,.25);overflow:hidden;margin:4px 0 8px}
    .bar i{display:block;height:100%;background:#22c55e}
    .warn{color:#f87171;font-weight:700}
    .links{display:flex;gap:8px;flex-wrap:wrap}
    .links a,.links button{font-size:.8rem;padding:6px 10px;border-radius:8px;border:1px solid var(--border,#2a3542);background:transparent;color:inherit;text-decoration:none;cursor:pointer}
    .links a:hover{border-color:#3b82f6}
    .hubs{display:flex;gap:6px;flex-wrap:wrap}
    .hubs span{font-size:.75rem;padding:3px 8px;border-radius:7px;border:1px solid var(--border,#2a3542)}
    .hubs span.has{border-color:#166534;background:rgba(34,197,94,.12)}
    .notes{white-space:pre-wrap;font-size:.82rem;max-height:140px;overflow:auto;opacity:.9}
    .saved{font-size:.7rem;color:#22c55e;margin-left:6px}
  </style>
</head>
<body>
  <header class="top-actions" data-shell="Dashboard"></header>
  <main id="mainApp" class="db-wrap">
    <div class="db-bar">
      <input type="search" id="q" placeholder="Search store, customer, project, address, crew…" />
      <label class="db-muted"><input type="checkbox" id="showAll" /> show older / closed</label>
      <span class="db-muted" id="count"></span>
      <a class="db-muted" href="./radar-dashboard-qc.html">old QC table →</a>
    </div>
    <div id="sites"><p class="db-muted">Sign in to load your sites…</p></div>
  </main>

  <script type="module">
    import { auth, onAuthStateChanged, database, ref, update, set, push, storage, storageRef, listAll } from "../../assets/js/firebase-init.js";
    import { loadTasks, groupSites, sensorMetaOf, treeFor, esc, HUBS, hubLabel, imagesDir } from "./assets/js/telaid-data.js?v=20261006b";

    const DAY = 864e5, $ = id => document.getElementById(id);
    let OWNER = null, TASKS = {}, SITES = [];
    const QC = "qcData_radar/sections";
    const fv = (t, sec, f) => { const v = t?.qcData_radar?.sections?.[sec]?.fields?.[f]; return v && typeof v === "object" && "value" in v ? v.value : v; };
    const lastOf = a => Array.isArray(a) && a.length ? a[a.length - 1] : null;
    const fmtD = ms => ms ? new Date(ms).toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" }) : "-";

    function siteStats(g) {
      const t = TASKS[g.id] || {}, meta = sensorMetaOf(t) || {};
      const rows = Object.values(meta).filter(r => r && typeof r === "object");
      const total = Number(t.sensorCount) || rows.length;
      const np = t?.qcData_radar?.sections?.nightly_production?.fields || {};
      const nights = g.ids.length, active = g.ids.some(id => (TASKS[id] || {}).status === "active");
      const status = t.siteStatus || (Date.now() - g.last < 3 * DAY && active ? "active" : (Date.now() - g.last < 30 * DAY ? "recent" : "closed"));
      return { t, total, rows: rows.length,
        serial: rows.filter(r => r.serial).length, labeled: rows.filter(r => r.labeledAt).length,
        runDone: rows.filter(r => r.runDoneAt).length, photos: rows.filter(r => (r.images || []).length >= 2).length,
        prod: { poles: lastOf(np.poles), brackets: lastOf(np.brackets), cables: lastOf(np.cables), sensors: lastOf(np.sensors) },
        score: t?.qcData_radar?.sections?.final_scoring?.total, nights, status,
        hubs: Object.keys(t?.siteTables?.hubs || {}).sort((a, b) => HUBS.indexOf(a) - HUBS.indexOf(b)) };
    }
    // ✎ fields: [label, path under the task, current value]
    const edit = (label, path, val) => `<div>${label}</div><div><span class="ed" data-path="${esc(path)}">${esc(val ?? "")}</span></div>`;

    function card(g) {
      const s = siteStats(g), t = s.t, id = g.id;
      const pct = (n, d) => d ? Math.round(100 * n / d) : 0, need = Math.max(0, s.total - s.labeled);
      const statusTxt = { active: "in progress", recent: "recent", closed: "closed", return: "return visit" }[s.status] || s.status;
      const links = Object.entries(t.siteLinks || {}).map(([k, l]) => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label || l.url)}</a>`).join("");
      const ojob = `../online/onlinejob.html?task=${encodeURIComponent(id)}&base=${encodeURIComponent(OWNER)}`;
      const maps = t.customerAddress ? `https://maps.google.com/?q=${encodeURIComponent(t.customerAddress)}` : "";
      return `<div class="site${s.status === "active" || s.status === "return" ? " open" : ""}" data-id="${esc(id)}">
        <div class="site-h"><h2>${esc(g.customer || "(no customer)")}</h2><span class="db-muted">${esc(g.project || "")}${t.workOrder ? " · WO " + esc(t.workOrder) : ""}</span>
          <span class="pill ${esc(s.status)}">${esc(statusTxt)}</span><span class="db-muted">${fmtD(g.first)} – ${fmtD(g.last)} · ${s.nights} night${s.nights === 1 ? "" : "s"}</span>
          ${s.total ? `<span class="db-muted">· ${s.labeled}/${s.total} labeled${need ? ` · <span class="warn">${need} need attention</span>` : ""}</span>` : ""}</div>
        <div class="site-b"><div class="grid">
          <div class="box"><h3>Site ✎</h3><div class="kv">
            ${edit("Store", "customerName", t.customerName)}
            <div>Address</div><div><span class="ed" data-path="customerAddress">${esc(t.customerAddress || "")}</span>${maps ? ` <a href="${maps}" target="_blank" rel="noopener">map ↗</a>` : ""}</div>
            ${edit("Phone", "customerPhone", t.customerPhone)}
            ${edit("Project", "project", t.project)}${edit("Work order", "workOrder", t.workOrder)}
            ${edit("Status", "siteStatus", t.siteStatus || "")}
          </div><div class="db-muted" style="margin-top:6px">Status: active · return · closed (blank = automatic)</div></div>
          <div class="box"><h3>Team ✎</h3><div class="kv">
            ${edit("Store manager", QC + "/site_info/fields/managerName/value", fv(t, "site_info", "managerName") || t.managerName)}
            ${edit("Partner", QC + "/site_info/fields/partnerCompany/value", fv(t, "site_info", "partnerCompany"))}
            ${edit("Lead tech", QC + "/site_info/fields/leadTech/value", fv(t, "site_info", "leadTech"))}
            ${edit("QC lead", QC + "/site_info/fields/qcLead/value", fv(t, "site_info", "qcLead"))}
            ${edit("Total nights", QC + "/site_info/fields/totalNights/value", fv(t, "site_info", "totalNights"))}
          </div>${fv(t, "site_info", "additionalTechs") ? `<div class="db-muted" style="margin-top:6px">${esc(fv(t, "site_info", "additionalTechs"))}</div>` : ""}</div>
          ${s.total ? `<div class="box"><h3>Sensors</h3>
            <div class="big">${s.labeled}<span class="db-muted"> / ${s.total} labeled</span></div><div class="bar"><i style="width:${pct(s.labeled, s.total)}%"></i></div>
            <div class="kv"><div>Need attention</div><div class="${need ? "warn" : ""}">${need}</div><div>Serials</div><div>${s.serial}</div>
              <div>Runs done</div><div>${s.runDone}</div><div>2+ photos</div><div>${s.photos}</div></div></div>` : ""}
          ${s.prod.poles != null ? `<div class="box"><h3>Production (last night)</h3><div class="kv">
            <div>Poles</div><div>${s.prod.poles}</div><div>Brackets</div><div>${s.prod.brackets}</div><div>Cables</div><div>${s.prod.cables}</div><div>Sensors</div><div>${s.prod.sensors}</div>
            ${s.score != null ? `<div>QC score</div><div>${s.score}</div>` : ""}</div></div>` : ""}
          ${s.hubs.length ? `<div class="box"><h3>IDFs / MDF</h3><div class="hubs" data-hubs="${esc(id)}">${s.hubs.map(h => `<span data-hub="${h}">${hubLabel(h)}</span>`).join("")}</div>
            <div class="db-muted" style="margin-top:6px" data-hubnote="${esc(id)}">green = has photos</div></div>` : ""}
          <div class="box" style="grid-column:1/-1"><h3>Links</h3><div class="links">
            ${s.total ? `<a href="./radar-map.html?task=${encodeURIComponent(id)}">🗺 Radar map</a>` : ""}
            <a href="./radar-tools.html?task=${encodeURIComponent(id)}">✅ Checklist / Radar Tools</a>
            <a href="${ojob}" target="_blank" rel="noopener">✏️ Edit full job</a>
            ${links}<button data-addlink="${esc(id)}">+ add link</button></div></div>
          ${t.notes ? `<div class="box" style="grid-column:1/-1"><h3>Notes</h3><div class="notes">${esc(t.notes)}</div></div>` : ""}
        </div></div></div>`;
    }

    function render() {
      const q = $("q").value.trim().toLowerCase(), all = $("showAll").checked;
      const list = SITES.filter(g => {
        const s = siteStats(g); if (!all && s.status === "closed") return false;
        if (!q) return true; const t = TASKS[g.id] || {};
        return [g.customer, g.project, t.customerAddress, t.workOrder, fv(t, "site_info", "leadTech"), fv(t, "site_info", "additionalTechs")].join(" ").toLowerCase().includes(q);
      });
      $("count").textContent = `${list.length} of ${SITES.length} sites`;
      $("sites").innerHTML = list.map(card).join("") || `<p class="db-muted">No sites${all ? "" : " in the last 30 days - tick \"show older\""}.</p>`;
      list.forEach(g => { if (document.querySelector(`.site[data-id="${CSS.escape(g.id)}"].open`)) paintHubs(g.id); });
    }
    // IDF photo check, only for open cards (a list call per hub)
    const hubDone = new Set();
    async function paintHubs(id) {
      const box = document.querySelector(`[data-hubs="${CSS.escape(id)}"]`); if (!box || hubDone.has(id)) return; hubDone.add(id);
      const t = TASKS[id]; let n = 0;
      for (const sp of box.querySelectorAll("[data-hub]")) {
        try { const r = await listAll(storageRef(storage, imagesDir(OWNER, t, sp.dataset.hub))); if (r.items.length) { sp.classList.add("has"); sp.title = r.items.length + " photos"; sp.textContent += " · " + r.items.length; n++; } } catch (_) {}
      }
      const note = document.querySelector(`[data-hubnote="${CSS.escape(id)}"]`); if (note) note.textContent = `${n} of ${box.children.length} have photos (green)`;
    }

    document.addEventListener("click", async e => {
      const h = e.target.closest(".site-h");
      if (h) { const c = h.parentElement; c.classList.toggle("open"); if (c.classList.contains("open")) paintHubs(c.dataset.id); return; }
      const ed = e.target.closest(".ed");
      if (ed && ed.contentEditable !== "true") { ed.contentEditable = "true"; ed.dataset.was = ed.textContent; ed.focus(); document.getSelection().selectAllChildren(ed); return; }
      const add = e.target.closest("[data-addlink]");
      if (add) {
        const label = (window.prompt("Link name (e.g. Jason's tracker, Photos folder):") || "").trim(); if (!label) return;
        const url = (window.prompt("URL for \"" + label + "\":") || "").trim(); if (!/^https?:\/\//i.test(url)) return;
        const id = add.dataset.addlink; await set(push(ref(database, `${OWNER}/tasks/${id}/siteLinks`)), { label, url, at: Date.now() });
        TASKS[id].siteLinks = { ...(TASKS[id].siteLinks || {}), ["new" + Date.now()]: { label, url } }; render();
      }
    });
    document.addEventListener("keydown", e => { const ed = e.target.closest && e.target.closest(".ed"); if (!ed) return;
      if (e.key === "Enter") { e.preventDefault(); ed.blur(); } if (e.key === "Escape") { ed.textContent = ed.dataset.was || ""; ed.blur(); } });
    document.addEventListener("focusout", async e => {
      const ed = e.target.closest && e.target.closest(".ed"); if (!ed || ed.contentEditable !== "true") return;
      ed.contentEditable = "false"; const v = ed.textContent.trim(); if (v === (ed.dataset.was || "").trim()) return;
      const id = ed.closest(".site").dataset.id, path = ed.dataset.path;
      try {
        await set(ref(database, `${OWNER}/tasks/${id}/${path}`), v || null);
        // keep the in-memory copy in step so a re-render shows the new value
        const parts = path.split("/"); let o = TASKS[id]; for (const p of parts.slice(0, -1)) { o[p] = o[p] || {}; o = o[p]; } o[parts[parts.length - 1]] = v || null;
        const ok = document.createElement("span"); ok.className = "saved"; ok.textContent = "saved"; ed.after(ok); setTimeout(() => ok.remove(), 1500);
      } catch (err) { ed.textContent = ed.dataset.was || ""; alert("Could not save: " + (err.code || err.message)); }
    });
    $("q").addEventListener("input", render); $("showAll").addEventListener("change", render);

    onAuthStateChanged(auth, async user => {
      if (!user) { $("sites").innerHTML = '<p class="db-muted">Sign in to load your sites.</p>'; return; }
      $("sites").innerHTML = '<p class="db-muted">Loading sites…</p>';
      try {
        const r = await loadTasks(user); OWNER = r.owner; TASKS = r.tasks || {}; SITES = groupSites(TASKS);
        render();
      } catch (err) { $("sites").innerHTML = `<p class="warn">Could not load: ${esc(err.message || err)}</p>`; }
    });
  </script>
</body>
</html>
