<!doctype html>
<!-- Telaid Dashboard v3 (2026-10-11, L: "I like some of the new things but I like the old style"): the OLD look - toolbar,
     sortable sheet, a row opens into detail cards, Export CSV - fed by the NEW real data (v2 2026-10-10): one row per SITE
     from telaid-data.js (canonical record: Sensors list, qcData_radar site_info / nightly_production / final_scoring,
     siteTables hubs) + siteStatus + siteLinks. Tap-to-edit fields write straight back. (The pre-Radar QC table was retired 2026-10-11 at L's word.) DATA: one read per load, no timers (poll-loop scar). -->
<html lang="en">
<head>
  <script>(function(){try{if(localStorage.getItem("ss-theme")==="light")document.documentElement.classList.add("light")}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telaid Dashboard</title>
  <link rel="icon" href="./assets/img/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="./assets/css/radartools.css?v=20261014b" />
  <script type="module" src="./assets/js/telaid-shell.js?v=20261007b"></script>
  <script type="module" src="../assets/js/login.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <script type="module" src="../assets/js/microsoftAuth.js"></script>
  <style>
    /* the old dashboard layout (pre-Radar QC table, retired 2026-10-11), colours = radartools.css tokens */
    .dashboard-wrap{padding:12px}
    .dashboard-toolbar{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;margin-bottom:12px}
    .dashboard-toolbar input,.dashboard-toolbar select{width:100%;min-width:0}
    .dashboard-summary{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:10px}
    .summary-pill{padding:6px 10px;border-radius:999px;border:1px solid var(--borderColor);background:var(--hover);font-size:12px;white-space:nowrap}
    .table-shell{overflow:auto;border:1px solid var(--borderColor);border-radius:var(--cardRadius);background:var(--secondaryBackgroundColor);box-shadow:var(--cardShadow)}
    .radar-sheet{width:100%;border-collapse:collapse;min-width:1100px}
    .radar-sheet th,.radar-sheet td{padding:8px 10px;border:0;border-bottom:1px solid var(--borderColor);border-right:1px solid var(--borderColor);vertical-align:top;font-size:13px}
    .radar-sheet th{position:sticky;top:0;z-index:2;text-align:left;background:var(--primaryColor);color:white;cursor:pointer;user-select:none;white-space:nowrap}
    .radar-sheet th:hover,.radar-sheet th.sort-active{background:var(--secondaryColor)}
    .sort-arrow{margin-left:4px;opacity:.7;font-size:.75em}
    .sheet-row{cursor:pointer}.sheet-row:hover{background:var(--hover)}
    .detail-row{display:none}.detail-row.open{display:table-row}
    .detail-cell{padding:14px!important;background:var(--hover)}
    .detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .detail-card{padding:12px;margin:0}
    .detail-card h3{margin:0 0 8px 0;font-size:14px}
    .detail-card.wide{grid-column:1/-1}
    .kv{display:grid;grid-template-columns:140px 1fr;gap:6px 10px;font-size:13px}
    .kv div:nth-child(odd){color:var(--mutedText)}
    .status-pass{color:var(--success);font-weight:700}.status-review{color:var(--warning);font-weight:700}
    .status-fail{color:var(--danger);font-weight:700}.status-incomplete{color:var(--mutedText);font-weight:700}
    .admin-editable{display:inline-block;min-width:60px;border-radius:4px;padding:1px 4px;cursor:text;outline:none;transition:background .15s;border-bottom:1px dashed var(--borderColor)}
    .admin-editable:hover{background:var(--secondaryBackgroundColor)}
    .admin-editable:focus{background:var(--secondaryBackgroundColor);outline:1px solid var(--primaryColor)}
    .admin-editable:empty::before{content:"—";color:var(--mutedText)}
    .bar{height:8px;border-radius:99px;background:var(--borderColor);overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;background:var(--success)}
    .pill-list{display:flex;gap:6px;flex-wrap:wrap}
    .mini-pill{border:1px solid var(--borderColor);background:var(--secondaryBackgroundColor);border-radius:999px;padding:4px 8px;font-size:12px;text-decoration:none;color:inherit}
    .mini-pill.has{border-color:var(--success);color:var(--success)}
    a.mini-pill:hover,button.mini-pill:hover{border-color:var(--primaryColor);cursor:pointer}
    .notes{white-space:pre-wrap;font-size:12px;max-height:160px;overflow:auto}
    .saved{font-size:11px;color:var(--success);margin-left:6px}
    @media (max-width:1100px){.dashboard-toolbar{grid-template-columns:1fr}.dashboard-summary{justify-content:flex-start}.detail-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="top-actions" data-shell="Dashboard">
      <div class="ms">
        <button id="loginButton">Login to MS</button>
        <button id="logoutButton" hidden>Logout of MS</button>
        <p id="loginStatus">Login status...</p>
      </div>
  </header>
  <main class="dashboard-wrap">
    <div class="dashboard-toolbar">
      <input id="searchInput" type="text" placeholder="Search site, customer, address, lead tech, crew…" />
      <select id="statusFilter">
        <option value="OPEN">Active + recent</option>
        <option value="ALL">All sites</option>
        <option value="active">In progress</option>
        <option value="return">Return visit</option>
        <option value="recent">Recent</option>
        <option value="closed">Closed</option>
      </select>
      <button id="exportCsvBtn" type="button" title="Export the filtered + sorted rows">Export CSV</button>
    </div>
    <div class="dashboard-summary" id="summaryPills"></div>
    <div class="table-shell">
      <table class="radar-sheet">
        <thead><tr id="headerRow">
          <th data-sort="project">Site</th><th data-sort="customer">Customer</th><th data-sort="status">Status</th>
          <th data-sort="last">Last visit</th><th data-sort="nights">Nights</th><th data-sort="labeled">Labeled</th>
          <th data-sort="need">Need attention</th><th data-sort="serial">Serials</th><th data-sort="photos">2+ photos</th>
          <th data-sort="score">QC score</th><th data-sort="lead">Lead tech</th><th data-sort="qcLead">QC lead</th>
        </tr></thead>
        <tbody id="rows"><tr><td colspan="12" class="muted">Sign in to load your sites…</td></tr></tbody>
      </table>
    </div>
  </main>

  <script type="module">
    import { auth, onAuthStateChanged, database, ref, set, push, storage, storageRef, listAll } from "../../assets/js/firebase-init.js";
    import { loadTasks, groupSites, sensorMetaOf, esc, HUBS, hubLabel, imagesDir } from "./assets/js/telaid-data.js?v=20261006b";

    const DAY = 864e5, $ = id => document.getElementById(id), QC = "qcData_radar/sections";
    let OWNER = null, TASKS = {}, SITES = [], ROWS = [], sortKey = "last", sortDir = -1;
    const fv = (t, sec, f) => { const v = t?.qcData_radar?.sections?.[sec]?.fields?.[f]; return v && typeof v === "object" && "value" in v ? v.value : v; };
    const lastOf = a => Array.isArray(a) && a.length ? a[a.length - 1] : null;
    const fmtD = ms => ms > 1e11 ? new Date(ms).toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" }) : "-";
    const cssId = s => String(s).replace(/[^a-zA-Z0-9_-]/g, "_");

    function stats(g) {
      const t = TASKS[g.id] || {}, rows = Object.values(sensorMetaOf(t) || {}).filter(r => r && typeof r === "object");
      const total = Number(t.sensorCount) || rows.length, labeled = rows.filter(r => r.labeledAt).length;
      const active = g.ids.some(id => (TASKS[id] || {}).status === "active");
      const status = t.siteStatus || (Date.now() - g.last < 3 * DAY && active ? "active" : (Date.now() - g.last < 30 * DAY ? "recent" : "closed"));
      const np = t?.qcData_radar?.sections?.nightly_production?.fields || {};
      return { g, t, id: g.id, project: g.project, customer: g.customer, status, last: g.last, first: g.first, nights: g.ids.length,
        total, labeled, need: total ? Math.max(0, total - labeled) : null, serial: rows.filter(r => r.serial).length,
        runDone: rows.filter(r => r.runDoneAt).length, photos: rows.filter(r => (r.images || []).length >= 2).length,
        score: t?.qcData_radar?.sections?.final_scoring?.total ?? null, lead: fv(t, "site_info", "leadTech") || "", qcLead: fv(t, "site_info", "qcLead") || "",
        prod: { poles: lastOf(np.poles), brackets: lastOf(np.brackets), cables: lastOf(np.cables), sensors: lastOf(np.sensors) },
        hubs: Object.keys(t?.siteTables?.hubs || {}).sort((a, b) => HUBS.indexOf(a) - HUBS.indexOf(b)) };
    }
    const stClass = s => ({ active: "status-pass", return: "status-review", recent: "status-incomplete", closed: "status-incomplete" })[s] || "";
    const stText = s => ({ active: "IN PROGRESS", return: "RETURN VISIT", recent: "RECENT", closed: "CLOSED" })[s] || String(s).toUpperCase();
    const ed = (label, path, val) => `<div>${label}</div><div><span class="admin-editable ed" data-path="${esc(path)}" title="tap to edit">${esc(val ?? "")}</span></div>`;

    function detail(s) {
      const t = s.t, id = s.id, pct = s.total ? Math.round(100 * s.labeled / s.total) : 0;
      const maps = t.customerAddress ? ` <a href="https://maps.google.com/?q=${encodeURIComponent(t.customerAddress)}" target="_blank" rel="noopener">map ↗</a>` : "";
      const links = Object.values(t.siteLinks || {}).map(l => `<a class="mini-pill" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label || l.url)}</a>`).join("");
      return `<div class="detail-grid" data-id="${esc(id)}">
        <section class="detail-card"><h3>Overview</h3><div class="kv">
          <div>Status</div><div class="${stClass(s.status)}">${stText(s.status)}</div>
          ${ed("Set status", "siteStatus", t.siteStatus || "")}
          ${ed("Project", "project", t.project)}${ed("Work order", "workOrder", t.workOrder)}${ed("Customer", "customerName", t.customerName)}
          <div>Address</div><div><span class="admin-editable ed" data-path="customerAddress">${esc(t.customerAddress || "")}</span>${maps}</div>
          ${ed("Phone", "customerPhone", t.customerPhone)}
          <div>Visits</div><div>${fmtD(s.first)} – ${fmtD(s.last)} · ${s.nights} night${s.nights === 1 ? "" : "s"}</div>
        </div><div class="muted compact" style="margin-top:6px">Set status: active · return · closed (blank = automatic)</div></section>
        <section class="detail-card"><h3>Team / Site</h3><div class="kv">
          ${ed("Store manager", QC + "/site_info/fields/managerName/value", fv(t, "site_info", "managerName") || t.managerName)}
          ${ed("Partner", QC + "/site_info/fields/partnerCompany/value", fv(t, "site_info", "partnerCompany"))}
          ${ed("Lead tech", QC + "/site_info/fields/leadTech/value", s.lead)}
          ${ed("QC lead", QC + "/site_info/fields/qcLead/value", s.qcLead)}
          ${ed("Total nights", QC + "/site_info/fields/totalNights/value", fv(t, "site_info", "totalNights"))}
        </div>${fv(t, "site_info", "additionalTechs") ? `<div class="muted compact" style="margin-top:6px">${esc(fv(t, "site_info", "additionalTechs"))}</div>` : ""}</section>
        <section class="detail-card"><h3>Sensors</h3>${s.total ? `<div class="kv">
          <div>Labeled</div><div><b>${s.labeled}</b> / ${s.total}</div></div><div class="bar"><i style="width:${pct}%"></i></div><div class="kv">
          <div>Need attention</div><div class="${s.need ? "status-fail" : ""}">${s.need}</div><div>Serials</div><div>${s.serial}</div>
          <div>Runs done</div><div>${s.runDone}</div><div>2+ photos</div><div>${s.photos}</div></div>` : `<div class="muted">No sensors on this job.</div>`}</section>
        ${s.prod.poles != null ? `<section class="detail-card"><h3>Production (last night)</h3><div class="kv">
          <div>Poles</div><div>${s.prod.poles}</div><div>Brackets</div><div>${s.prod.brackets}</div><div>Cables</div><div>${s.prod.cables}</div>
          <div>Sensors</div><div>${s.prod.sensors}</div>${s.score != null ? `<div>QC score</div><div>${s.score}</div>` : ""}</div></section>` : ""}
        ${s.hubs.length ? `<section class="detail-card"><h3>IDFs / MDF</h3><div class="pill-list" data-hubs="${esc(id)}">${s.hubs.map(h => `<span class="mini-pill" data-hub="${h}">${hubLabel(h)}</span>`).join("")}</div>
          <div class="muted compact" style="margin-top:6px" data-hubnote="${esc(id)}">checking photos…</div></section>` : ""}
        <section class="detail-card wide"><h3>Links</h3><div class="pill-list">
          ${s.total ? `<a class="mini-pill" href="./radar-map.html?task=${encodeURIComponent(id)}">🗺 Radar map</a>` : ""}
          <a class="mini-pill" href="./radar-tools.html?task=${encodeURIComponent(id)}">✅ Checklist / Radar Tools</a>
          <a class="mini-pill" href="../online/onlinejob.html?task=${encodeURIComponent(id)}&base=${encodeURIComponent(OWNER)}" target="_blank" rel="noopener">✏️ Edit full job</a>
          ${links}<button class="mini-pill" data-addlink="${esc(id)}">+ add link</button></div></section>
        ${t.notes ? `<section class="detail-card wide"><h3>Notes</h3><div class="notes">${esc(t.notes)}</div></section>` : ""}
      </div>`;
    }

    function filtered() {
      const q = $("searchInput").value.trim().toLowerCase(), f = $("statusFilter").value;
      return ROWS.filter(s => (f === "ALL" || (f === "OPEN" ? s.status !== "closed" : s.status === f)) &&
        (!q || [s.project, s.customer, s.t.customerAddress, s.t.workOrder, s.lead, s.qcLead, fv(s.t, "site_info", "additionalTechs")].join(" ").toLowerCase().includes(q)))
        .sort((a, b) => { const x = a[sortKey] ?? "", y = b[sortKey] ?? ""; return (typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y))) * sortDir; });
    }
    function render() {
      const open = new Set([...document.querySelectorAll(".detail-row.open")].map(r => r.id));
      const list = filtered();
      document.querySelectorAll("#headerRow th").forEach(th => { const on = th.dataset.sort === sortKey; th.classList.toggle("sort-active", on);
        th.querySelector(".sort-arrow")?.remove(); if (on) th.insertAdjacentHTML("beforeend", `<span class="sort-arrow">${sortDir > 0 ? "▲" : "▼"}</span>`); });
      $("rows").innerHTML = list.map(s => `<tr class="sheet-row" data-id="${esc(s.id)}">
          <td class="mono">${esc(s.project || "-")}</td><td>${esc(s.customer || "-")}</td><td class="${stClass(s.status)}">${stText(s.status)}</td>
          <td class="nowrap">${fmtD(s.last)}</td><td>${s.nights}</td><td>${s.total ? `${s.labeled}/${s.total}` : "-"}</td>
          <td class="${s.need ? "status-fail" : ""}">${s.need ?? "-"}</td><td>${s.total ? s.serial : "-"}</td><td>${s.total ? s.photos : "-"}</td>
          <td>${s.score ?? "-"}</td><td><span class="truncate">${esc(s.lead || "-")}</span></td><td>${esc(s.qcLead || "-")}</td></tr>
        <tr id="detail-${cssId(s.id)}" class="detail-row${open.has("detail-" + cssId(s.id)) ? " open" : ""}"><td class="detail-cell" colspan="12">${detail(s)}</td></tr>`).join("")
        || `<tr><td colspan="12" class="muted">No sites match.${$("statusFilter").value === "OPEN" ? " Pick \"All sites\" to see older jobs." : ""}</td></tr>`;
      const c = n => list.filter(s => s.status === n).length;
      $("summaryPills").innerHTML = `<span class="summary-pill">Showing ${list.length} of ${ROWS.length}</span><span class="summary-pill status-pass">In progress ${c("active")}</span>`
        + `<span class="summary-pill status-review">Return ${c("return")}</span><span class="summary-pill">Recent ${c("recent")}</span>`
        + `<span class="summary-pill status-fail">Sensors needing attention ${list.reduce((n, s) => n + (s.need || 0), 0)}</span>`;
      document.querySelectorAll(".detail-row.open").forEach(r => paintHubs(r.querySelector(".detail-grid")?.dataset.id));
    }
    const hubDone = new Set();
    async function paintHubs(id) {
      const box = id && document.querySelector(`[data-hubs="${CSS.escape(id)}"]`); if (!box || hubDone.has(id)) return; hubDone.add(id);
      let n = 0;
      for (const sp of box.querySelectorAll("[data-hub]")) {
        try { const r = await listAll(storageRef(storage, imagesDir(OWNER, TASKS[id], sp.dataset.hub))); if (r.items.length) { sp.classList.add("has"); sp.textContent += " · " + r.items.length; n++; } } catch (_) {}
      }
      const note = document.querySelector(`[data-hubnote="${CSS.escape(id)}"]`); if (note) note.textContent = `${n} of ${box.children.length} have photos (green)`;
    }
    function csv() {
      const cols = ["project", "customer", "status", "last", "nights", "labeled", "total", "need", "serial", "photos", "score", "lead", "qcLead"];
      const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const body = filtered().map(s => cols.map(k => q(k === "last" ? new Date(s.last).toISOString().slice(0, 10) : s[k])).join(","));
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([[cols.join(","), ...body].join("\n")], { type: "text/csv" }));
      a.download = `telaid-sites-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
    }

    document.addEventListener("click", async e => {
      const th = e.target.closest("#headerRow th");
      if (th) { const k = th.dataset.sort; sortDir = sortKey === k ? -sortDir : (["project", "customer", "lead", "qcLead", "status"].includes(k) ? 1 : -1); sortKey = k; render(); return; }
      const row = e.target.closest(".sheet-row");
      if (row) { const d = $("detail-" + cssId(row.dataset.id)); d.classList.toggle("open"); if (d.classList.contains("open")) paintHubs(row.dataset.id); return; }
      const add = e.target.closest("[data-addlink]");
      if (add) {
        const label = (window.prompt("Link name (e.g. Jason's tracker, Photos folder):") || "").trim(); if (!label) return;
        const url = (window.prompt(`URL for "${label}":`) || "").trim(); if (!/^https?:\/\//i.test(url)) return;
        const id = add.dataset.addlink; await set(push(ref(database, `${OWNER}/tasks/${id}/siteLinks`)), { label, url, at: Date.now() });
        TASKS[id].siteLinks = { ...(TASKS[id].siteLinks || {}), ["n" + Date.now()]: { label, url } }; rebuild(); return;
      }
      const el = e.target.closest(".ed");
      if (el && el.contentEditable !== "true") { el.contentEditable = "true"; el.dataset.was = el.textContent; el.focus(); document.getSelection().selectAllChildren(el); }
    });
    document.addEventListener("keydown", e => { const el = e.target.closest && e.target.closest(".ed"); if (!el) return;
      if (e.key === "Enter") { e.preventDefault(); el.blur(); } if (e.key === "Escape") { el.textContent = el.dataset.was || ""; el.blur(); } });
    document.addEventListener("focusout", async e => {
      const el = e.target.closest && e.target.closest(".ed"); if (!el || el.contentEditable !== "true") return;
      el.contentEditable = "false"; const v = el.textContent.trim(); if (v === (el.dataset.was || "").trim()) return;
      const id = el.closest(".detail-grid").dataset.id, path = el.dataset.path;
      try {
        await set(ref(database, `${OWNER}/tasks/${id}/${path}`), v || null);
        const parts = path.split("/"); let o = TASKS[id]; for (const p of parts.slice(0, -1)) { o[p] = o[p] || {}; o = o[p]; } o[parts[parts.length - 1]] = v || null;
        const ok = document.createElement("span"); ok.className = "saved"; ok.textContent = "saved"; el.after(ok); setTimeout(() => { ok.remove(); rebuild(); }, 900);
      } catch (err) { el.textContent = el.dataset.was || ""; alert("Could not save: " + (err.code || err.message)); }
    });
    $("searchInput").addEventListener("input", render); $("statusFilter").addEventListener("change", render); $("exportCsvBtn").addEventListener("click", csv);
    function rebuild() { hubDone.clear(); ROWS = SITES.map(stats); render(); }

    onAuthStateChanged(auth, async user => {
      if (!user) { $("rows").innerHTML = '<tr><td colspan="12" class="muted">Sign in to load your sites.</td></tr>'; return; }
      $("rows").innerHTML = '<tr><td colspan="12" class="muted">Loading sites…</td></tr>';
      try { const r = await loadTasks(user); OWNER = r.owner; TASKS = r.tasks || {}; SITES = groupSites(TASKS); rebuild(); }
      catch (err) { $("rows").innerHTML = `<tr><td colspan="12" class="status-fail">Could not load: ${esc(err.message || err)}</td></tr>`; }
    });
  </script>
</body>
</html>
