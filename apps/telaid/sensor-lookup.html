<!doctype html>
<!-- Sensor Lookup - scan or type a RADAR sensor SERIAL, get its MARK (the number you write on it).
     Built 2026-09-24 for Walmart #54 (L: "I scan the serial and it tells me the corresponding number").
     DATA: reads the serials radar-tools already holds - {uid}/tasks/<task>/sensorMeta/<mark>.serial -
     ONCE per load (no timer, no loop: see the poll-loop scar), then caches the table on the device so the
     page keeps working with no signal inside the conex. "Labeled" ticks live on this device only.
     ?task=<id> overrides the default task (the Walmart 54 canonical record). -->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sensor Lookup</title>
  <link rel="stylesheet" href="../assets/css/online.css" />
  <link rel="icon" href="./assets/img/favicon.ico" />
  <script>
    (function () {
      const t = localStorage.getItem("ss-theme");
      if (t === "light") document.documentElement.classList.add("light");
    })();
  </script>
  <script type="module" src="../assets/js/auth.js"></script>
  <style>
    .app-shell { max-width: 560px; margin: auto; padding: 12px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin: 12px 0; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    #serial-in { flex: 1 1 160px; font-size: 1.8rem; letter-spacing: .08em; padding: 10px 12px; min-width: 0; }
    .big-btn { font-size: 1.1rem; padding: 12px 16px; }
    #result { text-align: center; min-height: 150px; }
    #result .mark { font-size: 5.5rem; font-weight: 800; line-height: 1; color: var(--primary); }
    #result .sub { color: var(--muted); margin-top: 6px; font-size: 1.05rem; }
    #result .warn { color: var(--warn); font-weight: 700; margin-top: 8px; }
    #result .bad { color: var(--danger); font-size: 1.6rem; font-weight: 800; }
    #result .ok { color: var(--success); font-weight: 700; margin-top: 8px; }
    #reader { width: 100%; max-width: 480px; margin: 8px auto 0; max-height: 34vh; overflow: hidden; border-radius: 8px; }
    #reader video { max-height: 34vh; object-fit: cover; }
    #result { min-height: 120px !important; }
    .stats { display: flex; justify-content: space-between; color: var(--muted); font-size: .95rem; }
    .progress { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .progress > div { height: 100%; background: var(--success); width: 0; }
    #recent li, #todo li { padding: 4px 0; border-bottom: 1px solid var(--border); list-style: none; }
    #recent li { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    #recent .rtick { padding: 6px 10px; white-space: nowrap; flex: none; }
    #recent .okmini { color: var(--success); font-weight: 700; white-space: nowrap; flex: none; }
    #recent, #todo { padding: 0; margin: 6px 0 0; max-height: 260px; overflow: auto; }
    .muted { color: var(--muted); font-size: .9rem; }
    .raw { font-family: monospace; font-size: .85rem; color: var(--muted); word-break: break-all; }
    details summary { cursor: pointer; }
    /* hit / spare / dupe feedback: a colour wash over the card + the number pops in */
    #result { position: relative; overflow: hidden; }
    #result::after { content: ""; position: absolute; inset: 0; opacity: 0; pointer-events: none; }
    #result.hit { border-color: var(--success); box-shadow: 0 0 0 3px var(--success); }
    #result.hit::after { background: var(--success); animation: wash 1.1s ease-out; }
    #result.hit .mark { color: var(--success); animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); }
    #result.spare { border-color: var(--warn); box-shadow: 0 0 0 3px var(--warn); }
    #result.spare::after { background: var(--warn); animation: wash 1.1s ease-out; }
    #result.dupe { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger); }
    #result.dupe::after { background: var(--danger); animation: wash 1.1s ease-out; }
    #result .marklabel { font-size: .95rem; letter-spacing: .3em; color: var(--muted); font-weight: 700; }
    #result .sparehead { font-size: 3.2rem; font-weight: 900; letter-spacing: .12em; color: var(--warn); animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); }
    .loadfail { color: var(--danger); font-weight: 700; }
    @keyframes wash { 0% { opacity: .55; } 100% { opacity: 0; } }
    @keyframes pop { 0% { transform: scale(.4); } 100% { transform: scale(1); } }
  </style>
</head>

<body>
  <header style="position:relative;">
    <div class="logo-box"><a href="../../index.html"><img src="../../assets/img/android-chrome-192x192.png" alt="Luis Solutions"></a></div>
    <h1>Sensor Lookup</h1>
    <div class="auth-bar">
      <span id="auth-label">Not signed in</span>
      <button id="auth-btn">Sign In</button>
    </div>
    <button id="theme-toggle" title="Toggle theme">☀️</button>
    <script>
      (function () {
        const btn = document.getElementById("theme-toggle");
        const html = document.documentElement;
        btn.textContent = html.classList.contains("light") ? "🌙" : "☀️";
        btn.addEventListener("click", function () {
          const next = html.classList.contains("light") ? "dark" : "light";
          html.classList.toggle("light", next === "light");
          localStorage.setItem("ss-theme", next);
          btn.textContent = next === "light" ? "🌙" : "☀️";
        });
      })();
    </script>
    <div id="login-inline">
      <h3>Sign In</h3>
      <input type="email" id="email-in" placeholder="Email" />
      <input type="password" id="pass-in" placeholder="Password" />
      <button id="do-login">Sign In</button>
      <p id="auth-err"></p>
    </div>
  </header>

  <main>
    <div class="app-shell">
      <div class="muted" id="source">Loading…</div>

      <!-- Result ABOVE the scanner (L, 2026-09-24): with the camera open the number has to be on screen
           without scrolling, and the camera window is kept short so the number, the box and the view all fit. -->
      <div class="card" id="result"><div class="sub">Scan or type a serial.</div></div>

      <div class="card">
        <div class="muted" style="margin-bottom:6px">Type the serial (leading zeros optional) or scan the QR on the carton label.</div>
        <div class="row">
          <input id="serial-in" type="text" inputmode="numeric" autocomplete="off" placeholder="Serial" />
          <button id="scan-btn" class="big-btn">📷 Scan</button>
        </div>
        <div id="reader" hidden></div>
      </div>

      <div class="card">
        <div class="stats"><span id="stat-count">0 / 0 labeled</span><button id="undo-btn" class="muted" hidden>Undo last ✓</button></div>
        <div class="progress"><div id="bar"></div></div>
      </div>

      <div class="card">
        <details>
          <summary>Recent (this device)</summary>
          <ul id="recent"></ul>
        </details>
        <details>
          <summary>Not labeled yet</summary>
          <ul id="todo"></ul>
        </details>
        <details>
          <summary>Tools</summary>
          <div class="row" style="margin-top:8px">
            <button id="export-btn">Export labeled CSV</button>
            <button id="reset-btn">Clear labeled ticks</button>
            <button id="reload-btn">Re-pull serials</button>
          </div>
          <p class="muted" id="reset-confirm" hidden>Tap "Clear labeled ticks" again to confirm.</p>
        </details>
      </div>
    </div>
  </main>

  <script type="module">
    import { auth, database, ref, get, set, onAuthStateChanged } from "../assets/js/firebase-init.js";

    // ── what this page reads ──
    const TELAID_UID = "SDN0vKPQ1qfN5vxkvhR3auVhDYq1";   // Telaid apps live under this uid by design
    const TASK = new URLSearchParams(location.search).get("task") || "1789898400000"; // Walmart 54 canonical record
    const CACHE_KEY = `sensorLookup:${TASK}:table`;
    const DONE_KEY = `sensorLookup:${TASK}:labeled`;
    const RECENT_KEY = `sensorLookup:${TASK}:recent`;

    // Walmart 54 zones + IDF per mark (from the 9-16 zone package). Numbers only, no serials.
    const ZONES = [[1, 10, 1], [11, 75, 2], [76, 141, 3], [142, 203, 4], [204, 241, 5]];
    const IDF = "6666666666666666665566666555655566611555551111155551111111555551111115555551111115554455441111555544411115555441111144454444441154444444441334441444443334444443334224222333322222222332232222233332222233322222333322222333322233333223322333333";
    const zoneOf = m => (ZONES.find(([a, b]) => m >= a && m <= b) || [])[2];
    const idfOf = m => (TASK === "1789898400000" && IDF[m - 1]) || null;

    const $ = id => document.getElementById(id);
    let bySerial = new Map();      // serial -> mark
    let total = 0;
    let lastTicked = null;

    const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (_) { return d; } };
    const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) { } };
    let labeled = load(DONE_KEY, {});     // mark -> timestamp
    let recent = load(RECENT_KEY, []);    // [{t, raw, mark}]

    function buildTable(meta) {
      // RTDB hands sensorMeta back as a SPARSE ARRAY (hole at 0, marks start at 1) when keys are numeric.
      // Object.entries skips holes and works for both shapes. (meta.map kept the hole, and destructuring it
      // threw "is not iterable" - the 2026-09-24 "serial list didn't load" on L's phone.)
      const entries = Object.entries(meta || {});
      const t = {};
      for (const [k, v] of entries) {
        const s = v && String(v.serial || "").trim();
        if (s && s.toLowerCase() !== "test") t[s] = Number(k);
      }
      return t;
    }

    function useTable(t, label) {
      bySerial = new Map(Object.entries(t));
      total = bySerial.size;
      $("source").textContent = total ? `${total} sensors · ${label}` : "No serials found for this task.";
      renderStats();
    }

    // NO LOGIN NEEDED (2026-09-24, L: "so I can have the guys scan without giving them a login").
    // public/sensorLookup/<task> = {serials: {serial: mark}, count, updatedAt} - world-READABLE, writable only by
    // the Telaid uid and L's (rules). The crew reads that. When L opens the page signed in, the real sensorMeta
    // is read too and, if the public copy differs, the public copy is refreshed - so it cannot drift from radar-tools.
    const PUBLISHERS = [TELAID_UID, "7cIh8rrhVNOjjj5CBDgb3IlqzEh2"];
    const sameTable = (a, b) => { const ka = Object.keys(a || {}), kb = Object.keys(b || {}); return ka.length === kb.length && ka.every(s => a[s] === b[s]); };

    async function pull(user) {
      // One read per page load - never on a timer.
      const why = [];
      let pub = null;
      try { pub = (await get(ref(database, `public/sensorLookup/${TASK}`))).val(); } catch (e) { why.push(`public: ${e.code || e.message || e}`); }
      if (pub && pub.serials && Object.keys(pub.serials).length) {
        save(CACHE_KEY, { t: pub.serials, at: Date.now() });
        useTable(pub.serials, `list updated ${new Date(pub.updatedAt || Date.now()).toLocaleString()}`);
      }
      if (user) {
        for (const owner of [...new Set([user.uid, TELAID_UID])]) {
          try {
            const t = buildTable((await get(ref(database, `${owner}/tasks/${TASK}/sensorMeta`))).val());
            if (!Object.keys(t).length) { why.push(`${owner.slice(0, 6)}: no serials`); continue; }
            save(CACHE_KEY, { t, at: Date.now() });
            useTable(t, `pulled ${new Date().toLocaleString()} (from radar-tools)`);
            if (PUBLISHERS.includes(user.uid) && !sameTable(t, pub && pub.serials)) {
              try {
                await set(ref(database, `public/sensorLookup/${TASK}`), { serials: t, count: Object.keys(t).length, updatedAt: Date.now(), source: `${owner}/tasks/${TASK}/sensorMeta` });
                $("source").textContent += " · crew copy refreshed";
              } catch (e) { $("source").textContent += ` · ⚠ crew copy NOT refreshed (${e.code || e.message})`; }
            }
            return;
          } catch (e) { why.push(`${owner.slice(0, 6)}: ${e.code || e.message || e}`); }
        }
      }
      if (total) return;   // the public copy loaded - that is enough to scan
      const c = load(CACHE_KEY, null);
      if (c) { useTable(c.t, `offline copy from ${new Date(c.at).toLocaleString()}`); return; }
      $("source").innerHTML = `<span class="loadfail">⚠ Serial list didn't load - it needs signal the first time.</span> <span class="raw">${escapeHtml(why.join(" · "))}</span>`;
    }

    // Pull the serial out of whatever the barcode holds. RS550 carton labels (seen 2026-09-24):
    //   printed "Serial No. 0084647" · 1D barcode "0084647" · QR "0084647,BC:31:98:E1:3B:07,RS550" (serial,MAC,model)
    // while radar-tools stores the serial as "84647" - so strip leading zeros, and read the QR's FIRST field.
    function resolve(raw) {
      const s = String(raw || "").trim();
      if (bySerial.has(s)) return s;
      const first = s.split(",")[0].trim();
      if (/^\d+$/.test(first)) { const n = String(Number(first)); if (bySerial.has(n)) return n; }
      const runs = s.match(/\d+/g) || [];
      for (const r of runs) if (bySerial.has(r)) return r;
      for (const r of runs) if (r.length > 5 && bySerial.has(r.slice(-5))) return r.slice(-5);
      for (const r of runs) { const n = String(Number(r)); if (bySerial.has(n)) return n; }
      return null;
    }

    // Feedback you can't miss on a noisy floor: the card flashes, the phone buzzes, and a tone plays
    // (high double beep = got a number, low long tone = spare, two lows = already labeled).
    let actx = null;
    function tone(freqs, ms) {
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        let t = actx.currentTime;
        for (const f of freqs) {
          const o = actx.createOscillator(), g = actx.createGain();
          o.frequency.value = f; o.type = "square"; g.gain.value = 0.08;
          o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + ms / 1000); t += ms / 1000 + 0.05;
        }
      } catch (_) { }
    }
    function flash(kind) {
      const box = $("result");
      box.classList.remove("hit", "spare", "dupe"); void box.offsetWidth;   // restart the animation
      box.classList.add(kind);
      if (navigator.vibrate) navigator.vibrate(kind === "hit" ? [70, 40, 70] : kind === "spare" ? [350] : [120, 80, 120]);
      if (kind === "hit") tone([1320, 1760], 90); else if (kind === "spare") tone([330], 400); else tone([440, 440], 150);
    }

    function show(raw, fromScan) {
      const box = $("result");
      if (!total) {   // no table = every lookup would "miss" - say what's actually wrong instead
        box.innerHTML = `<div class="bad">Serial list not loaded</div>
          <div class="sub">Open this page once with signal (no login needed). After that it works offline.</div>`;
        return;
      }
      const serial = resolve(raw);
      // A code with NO serial-shaped number in it (e.g. the sensor body's QR = just the MAC, BC:31:98:...) is
      // not a spare - it is the wrong code. Calling it SPARE would put a real sensor in the spare pile.
      // Serials are 5 digits (7 with the label's leading zeros); only a code carrying one can be judged.
      if (!serial && !/(^|\D)0{0,2}\d{5}(\D|$)/.test(String(raw).replace(/([0-9a-f]{2}[:-]){5}[0-9a-f]{2}/ig, ""))) {
        const isMac = /([0-9a-f]{2}[:-]){5}[0-9a-f]{2}/i.test(String(raw));
        box.innerHTML = `<div class="bad">${isMac ? "That's the MAC" : "No serial in that code"}</div>
          <div class="sub">Scan the <b>barcode</b> or the carton label's QR, or type the serial number.</div>
          <div class="raw">read: ${escapeHtml(raw)}</div>`;
        flash("dupe");
        logRecent(raw, null);
        return;
      }
      if (!serial) {
        box.innerHTML = `<div class="sparehead">SPARE</div>
          <div class="sub">Not one of the ${total} assigned sensors. Put it with the spares, no number.</div>
          <div class="raw">read: ${escapeHtml(raw)}</div>`;
        flash("spare");
        logRecent(raw, null);
        return;
      }
      const mark = bySerial.get(serial);
      const z = zoneOf(mark), idf = idfOf(mark);
      const already = labeled[mark];
      box.innerHTML = `<div class="marklabel">WRITE</div><div class="mark">${mark}</div>
        <div class="sub">serial ${serial}${z ? ` · zone ${z}` : ""}${idf ? ` · IDF ${idf}` : ""}</div>
        ${already ? `<div class="warn">⚠ Already labeled ${new Date(already).toLocaleTimeString()}. Duplicate label, or a second scan?</div>`
          : `<button id="tick-btn" class="big-btn" style="margin-top:10px" data-mark="${mark}">✓ Labeled</button>`}
        ${fromScan && raw !== serial ? `<div class="raw">read: ${escapeHtml(raw)}</div>` : ""}`;
      if (!already) $("tick-btn").onclick = () => tick(mark);
      flash(already ? "dupe" : "hit");
      logRecent(raw, mark);
    }

    function tick(mark, fromRecent) {
      if (labeled[mark]) return;
      labeled[mark] = Date.now();
      lastTicked = mark;
      save(DONE_KEY, labeled);
      // only flip the big card's button if the card is showing THIS sensor
      const b = $("result").querySelector("#tick-btn");
      if (b && Number(b.dataset.mark) === Number(mark))
        b.replaceWith(Object.assign(document.createElement("div"), { className: "ok", textContent: "✓ labeled" }));
      renderStats();
      if (!fromRecent) { $("serial-in").value = ""; $("serial-in").focus(); }
    }

    function logRecent(raw, mark) {
      recent.unshift({ t: Date.now(), raw: String(raw).slice(0, 60), mark });
      recent = recent.slice(0, 40);
      save(RECENT_KEY, recent);
      renderRecent();
    }

    // Recent list: each found sensor gets its own ✓ Labeled button on the right, for when the big button
    // got skipped (L, 2026-09-24: "in case I forget to click that I labeled it").
    function renderRecent() {
      $("recent").innerHTML = recent.map(r => {
        const right = !r.mark ? "" : labeled[r.mark]
          ? `<span class="okmini">✓ labeled</span>`
          : `<button type="button" class="rtick" data-mark="${r.mark}">✓ Labeled</button>`;
        return `<li><span>${new Date(r.t).toLocaleTimeString()} · ${r.mark ? `<b>#${r.mark}</b>` : "<b>not found</b>"} <span class="raw">${escapeHtml(r.raw)}</span></span>${right}</li>`;
      }).join("");
    }
    $("recent").addEventListener("click", e => {
      const b = e.target.closest(".rtick");
      if (b) tick(Number(b.dataset.mark), true);
    });

    function renderStats() {
      const n = Object.keys(labeled).length;
      $("stat-count").textContent = `${n} / ${total} labeled`;
      $("bar").style.width = total ? `${Math.min(100, (100 * n) / total)}%` : "0";
      $("undo-btn").hidden = !lastTicked;
      const marks = [...bySerial.entries()].filter(([, m]) => !labeled[m]).sort((a, b) => a[1] - b[1]);
      $("todo").innerHTML = marks.map(([s, m]) => `<li>#${m} · ${s}${idfOf(m) ? ` · IDF ${idfOf(m)}` : ""}</li>`).join("") || "<li>All labeled.</li>";
      renderRecent();   // keep the recent list's ✓ buttons in step (undo, clear, a tick from the big card)
    }

    const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    // ── typing: look up as soon as 5 SIGNIFICANT digits are in (label prints "0084647", table holds "84647"),
    //    so the leading zeros never fire a false "not in the 241" mid-typing. Enter looks up anything. ──
    $("serial-in").addEventListener("input", e => {
      const v = e.target.value.trim();
      if (/^\d+$/.test(v) && String(Number(v)).length === 5) show(v, false);
    });
    $("serial-in").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.value.trim()) show(e.target.value.trim(), false); });

    // ── camera: html5-qrcode, loaded only when Scan is first tapped ──
    let scanner = null, lastRaw = "", lastAt = 0;
    function loadLib() {
      return new Promise((res, rej) => {
        if (window.Html5Qrcode) return res();
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js";
        s.onload = res; s.onerror = () => rej(new Error("scanner library didn't load (no signal?) - type the serial instead"));
        document.head.appendChild(s);
      });
    }
    $("scan-btn").addEventListener("click", async () => {
      const r = $("reader");
      if (scanner) { await scanner.stop().catch(() => { }); scanner = null; r.hidden = true; $("scan-btn").textContent = "📷 Scan"; return; }
      try {
        await loadLib();
        r.hidden = false;
        scanner = new Html5Qrcode("reader");
        $("scan-btn").textContent = "■ Stop";
        await scanner.start({ facingMode: "environment" }, { fps: 10, aspectRatio: 1.777, qrbox: (w, h) => ({ width: Math.floor(w * 0.8), height: Math.floor(h * 0.6) }) }, text => {
          const now = Date.now();
          if (text === lastRaw && now - lastAt < 2500) return;   // same label held in frame - don't re-fire
          lastRaw = text; lastAt = now;
          show(text, true);
        });
      } catch (e) {
        scanner = null; r.hidden = true; $("scan-btn").textContent = "📷 Scan";
        $("result").innerHTML = `<div class="warn">${escapeHtml(e.message || e)}</div>`;
      }
    });

    $("undo-btn").addEventListener("click", () => {
      if (lastTicked == null) return;
      delete labeled[lastTicked]; save(DONE_KEY, labeled); lastTicked = null; renderStats();
    });
    $("export-btn").addEventListener("click", () => {
      const rows = [["mark", "serial", "zone", "idf", "labeledAt"]];
      for (const [s, m] of [...bySerial.entries()].sort((a, b) => a[1] - b[1]))
        rows.push([m, s, zoneOf(m) || "", idfOf(m) || "", labeled[m] ? new Date(labeled[m]).toISOString() : ""]);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([rows.map(r => r.join(",")).join("\n")], { type: "text/csv" }));
      a.download = `sensor-labels-${TASK}.csv`; a.click();
    });
    let resetArmed = false;
    $("reset-btn").addEventListener("click", () => {
      if (!resetArmed) { resetArmed = true; $("reset-confirm").hidden = false; setTimeout(() => { resetArmed = false; $("reset-confirm").hidden = true; }, 4000); return; }
      labeled = {}; save(DONE_KEY, labeled); lastTicked = null; resetArmed = false; $("reset-confirm").hidden = true; renderStats();
    });
    $("reload-btn").addEventListener("click", () => pull(auth.currentUser));

    // Offline first: show the cached table immediately, then refresh it once auth resolves.
    const cached = load(CACHE_KEY, null);
    if (cached) useTable(cached.t, `offline copy from ${new Date(cached.at).toLocaleString()}`);
    renderRecent();
    onAuthStateChanged(auth, user => pull(user));
  </script>
</body>

</html>
