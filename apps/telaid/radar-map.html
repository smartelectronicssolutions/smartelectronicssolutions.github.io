<!doctype html>
<!-- Radar Map - every sensor of a RADAR site at its real X/Y, zoomable like a map (2026-10-02, L: "interactable maps
     that people can zoom in on and see their data in interesting ways" -> "yes" to the Walmart 54 floor map).
     DATA (one read per load, no timers - poll-loop scar): {owner}/tasks/<task>/sensorMeta/<mark> = {serial, m1 "X ..",
     m2 "Y ..", m3 "Z ..", labeledAt} + the device photos in Storage {owner}/tasks/images/<project>/sensors
     (file names <prefix>_<mark>-<serial>[_n].jpg). Colour by IDF / photos / labeled / height / switch.
     Same Telaid shell as sensor-lookup (radartools.css, login.js, sidebar.js). ?task=<id> picks the job.
     2026-10-02 (L: "click a radar and see the images or add images ... and label runs as complete" + a Walmart galaxy):
     the sensor card shows its photos (tap = full size), "Add photo" uploads exactly like radar-tools (2048 px, bottom
     bar "<customer> NN - serial", <prefix>_NN-serial.jpg into the same sensors folder), and two field-level toggles
     write sensorMeta/<mark>/runDoneAt (NEW - cable run complete) and .../labeledAt (same field radar-tools uses).
     "Wiring" view = the same sensors laid out MDF -> IDF -> switch -> sensor, so loads and gaps read at a glance. -->
<html lang="en">
<head>
  <script>(function(){try{if(localStorage.getItem("ss-theme")==="light")document.documentElement.classList.add("light")}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Radar Map</title>
  <link rel="icon" href="./assets/img/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="./assets/css/radartools.css?v=20260922c" />
  <script type="module" src="../assets/js/login.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <style>
    .app-shell { max-width: 1100px; margin: auto; padding: 12px; display: grid; gap: 12px; }
    .card { background: var(--cardBackground); border: 1px solid var(--borderColor); border-radius: 12px; padding: 12px; box-shadow: var(--cardShadow); }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .muted { color: var(--mutedText); font-size: .9rem; }
    #modes button { width: auto !important; margin: 0 !important; box-shadow: none !important; display: inline-block; font-size: .9rem; line-height: 1.2;
      padding: 6px 12px; border-radius: 999px; border: 1px solid var(--borderColor); background: transparent; color: var(--textColor); cursor: pointer; }
    #modes button.on { background: var(--primaryColor); border-color: var(--primaryColor); color: #fff; }
    #find { width: 7em !important; margin: 0 !important; font-size: 1rem; padding: 6px 8px; }
    .mapwrap { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--borderColor); background: var(--secondaryBackgroundColor); }
    #map { display: block; width: 100%; height: min(75vh, 720px); touch-action: none; cursor: grab; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
    #info { min-height: 3em; }
    #info .mk { font-size: 2rem; font-weight: 800; color: var(--primaryColor); line-height: 1; }
    #info .kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin-top: 8px; font-size: .95rem; font-variant-numeric: tabular-nums; }
    #info .kv b { color: var(--mutedText); font-weight: 600; }
    .stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-variant-numeric: tabular-nums; }
    .stats b { color: var(--textColor); }
    #views button { width: auto !important; margin: 0 !important; box-shadow: none !important; display: inline-block; font-size: .9rem; line-height: 1.2;
      padding: 6px 12px; border-radius: 8px; border: 1px solid var(--borderColor); background: transparent; color: var(--textColor); cursor: pointer; }
    #views button.on { background: var(--primaryColor); border-color: var(--primaryColor); color: #fff; }
    .photos { display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; padding-bottom: 4px; }
    .photos a { flex: none; }
    .photos img { height: 110px; width: auto; border-radius: 8px; border: 1px solid var(--borderColor); display: block; background: #0003; }
    .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .acts button, .acts label.btn { width: auto !important; margin: 0 !important; box-shadow: none !important; display: inline-flex; align-items: center; gap: 6px;
      font-size: .95rem; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--borderColor); background: transparent; color: var(--textColor); cursor: pointer; }
    .acts .done { background: #16a34a; border-color: #16a34a; color: #fff; }
    .acts .primary { background: var(--primaryColor); border-color: var(--primaryColor); color: #fff; }
    #info .note { font-size: .85rem; color: var(--mutedText); margin-top: 6px; }
  </style>
</head>
<body>
  <header class="top-actions">
    <h1><img src="./assets/img/telaid_logo.png" alt="" /> Radar Map</h1>
    <section id="login-section" class="logins-section">
      <form id="login-form" class="center">
        <label for="username">Email:</label>
        <input type="email" id="username" required />
        <label for="password">Password:</label>
        <input type="password" id="password" required />
        <button type="submit">Sign in</button>
      </form>
      <div class="auth-row">
        <button id="logout" style="display: none">Logout</button>
        <span id="firebaseStatus" class="status-text"></span>
      </div>
    </section>
  </header>

  <main id="mainApp">
    <div class="app-shell">
      <div class="muted" id="source">Sign in to load the site.</div>
      <div class="card stats" id="stats"></div>
      <div class="row" id="views"><span class="muted">View:</span>
        <button data-v="floor" class="on">Floor</button><button data-v="wiring">Wiring</button></div>
      <div class="row modes" id="modes">
        <span class="muted">Color by:</span>
        <button data-m="idf" class="on">IDF</button>
        <button data-m="photos">Photos</button>
        <button data-m="labeled">Labeled</button>
        <button data-m="height">Height</button>
        <button data-m="switch">Switch</button>
        <button data-m="runs">Runs</button>
        <span style="flex:1"></span>
        <input id="find" type="text" inputmode="numeric" placeholder="Sensor #" />
      </div>
      <div class="mapwrap"><canvas id="map" aria-label="Floor map of every sensor"></canvas></div>
      <div class="legend" id="legend"></div>
      <div class="muted">Pinch or scroll to zoom · drag to move · tap a sensor for its photos, Add photo and Run complete · double-tap to reset. Numbers appear as you zoom in.</div>
      <div class="card" id="info"><span class="muted">Tap a sensor to see its details.</span></div>
    </div>
  </main>

  <script type="module">
    import { auth, database, storage, ref, get, update, onAuthStateChanged, storageRef, listAll, uploadBytes, getDownloadURL } from "../assets/js/firebase-init.js";
    const TELAID_UID = "SDN0vKPQ1qfN5vxkvhR3auVhDYq1";
    const Q_TASK = new URLSearchParams(location.search).get("task");
    const LAST_SITE = (() => { try { return JSON.parse(localStorage.getItem("sensorTask")) || null; } catch (_) { return null; } })();
    const TASK = Q_TASK || (LAST_SITE && LAST_SITE.task) || "1789898400000";
    const IS_WM54 = TASK === "1789898400000";
    // Walmart 54 zone + IDF per mark (same tables as sensor-lookup), and the switch map L gave on site 10/2
    const ZONES = [[1, 10, 1], [11, 75, 2], [76, 141, 3], [142, 203, 4], [204, 241, 5]];
    const IDF = "6666666666666666665566666555655566611555551111155551111111555551111115555551111115554455441111555544411115555441111144454444441154444444441334441444443334444443334224222333322222222332232222233332222233322222333322222333322233333223322333333";
    const SWITCHES = { 1: [3, 6, 10], 2: [1, 11, "new"], 3: [5, 9, 15], 4: [4, 7, 13], 5: [8, 12, "new"], 6: [2, 14] };
    const zoneOf = m => IS_WM54 ? (ZONES.find(([a, b]) => m >= a && m <= b) || [])[2] : null;
    const idfOf = m => IS_WM54 ? Number(IDF[m - 1]) : null;
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    // "X 306'-1 1/2\"" / "-117'-4 1/2\"" -> feet
    function feet(s) {
      const t = String(s || "").replace(/^[XYZ]\s*/i, "").trim(); if (!t) return null;
      const neg = t.startsWith("-"), m = t.replace(/^-/, "").match(/(\d+)'\s*-?\s*(\d+)?(?:\s+(\d+)\/(\d+))?/);
      if (!m) return null;
      const v = Number(m[1]) + ((Number(m[2] || 0) + (m[3] ? Number(m[3]) / Number(m[4]) : 0)) / 12);
      return neg ? -v : v;
    }
    const fmtFt = v => v == null ? "-" : `${Math.trunc(v)}'-${(Math.abs(v % 1) * 12).toFixed(1).replace(/\.0$/, "")}"`;

    let S = [];            // {m, serial, x, y, z, idf, zone, photos, items, labeledAt, runDoneAt, sw, port, wx, wy}
    let mode = "idf", sel = -1, layout = "floor";
    let OWNER = null, TASKREC = {}, PROJ = "", PRE = "";      // set by load(); used by the card's actions
    const clean = v => String(v || "").trim().replace(/\s+/g, "_").replace(/[^a-zA-Z0-9_-]/g, "");
    const metaPath = () => `${OWNER}/tasks/${TASK}/sensorMeta`;
    const photoDir = () => `${OWNER}/tasks/images/${PROJ}/sensors`;

    function assignSwitches() {   // balanced split by sensor # inside each IDF (same as the port-plan CSV)
      for (const [idf, sws] of Object.entries(SWITCHES)) {
        const rs = S.filter(s => s.idf === Number(idf)).sort((a, b) => a.m - b.m), k = sws.length;
        let i = 0;
        sws.forEach((sw, j) => { const size = Math.floor(rs.length / k) + (j < rs.length % k ? 1 : 0);
          rs.slice(i, i + size).forEach((s, p) => { s.sw = sw; s.port = p + 1; }); i += size; });
      }
    }

    async function load(user) {
      if (!user) { $("source").textContent = "Sign in to load the site."; return; }
      let meta = null, owner = null;
      for (const o of [...new Set([user.uid, TELAID_UID])]) {
        try { const v = (await get(ref(database, `${o}/tasks/${TASK}/sensorMeta`))).val(); if (v) { meta = v; owner = o; break; } } catch (_) {}
      }
      if (!meta) { $("source").textContent = "No sensor data found for this job."; return; }
      const task = (await get(ref(database, `${owner}/tasks/${TASK}`)).catch(() => null))?.val() || {};
      S = Object.entries(meta).map(([k, v]) => ({ m: Number(k), serial: v?.serial || "", x: feet(v?.m1), y: feet(v?.m2), z: feet(v?.m3),
        labeledAt: v?.labeledAt || null, runDoneAt: v?.runDoneAt || null, idf: idfOf(Number(k)), zone: zoneOf(Number(k)), photos: 0, items: [] }))
        .filter(s => s.m && s.x != null && s.y != null);
      if (IS_WM54) { assignSwitches(); wiringLayout(); }
      OWNER = owner; TASKREC = task;
      // photo counts from the file names in Storage (one list call)
      try {
        const proj = clean(task.project || task.customerName || TASK); PROJ = proj;
        const pre = clean(task.customerName || ""); PRE = clean(task.customerName || task.project || TASK);
        const res = await listAll(storageRef(storage, `${owner}/tasks/images/${proj}/sensors`));
        for (const it of res.items) {
          const rest = pre && it.name.startsWith(pre + "_") ? it.name.slice(pre.length + 1) : it.name.replace(/^.*?_(?=\d+-)/, "");
          const mm = rest.match(/^(\d{1,4})-/); if (!mm) continue;
          const s = S.find(x => x.m === Number(mm[1])); if (s) { s.photos++; s.items.push(it); }
        }
      } catch (_) { PROJ = PROJ || clean(task.project || task.customerName || TASK); }
      $("source").textContent = `${task.customerName || "Job " + TASK} · ${S.length} sensors · loaded ${new Date().toLocaleTimeString()}`;
      renderStats(); fit();
    }

    function renderStats() {
      const lab = S.filter(s => s.labeledAt).length, ph2 = S.filter(s => s.photos >= 2).length, ph0 = S.filter(s => !s.photos).length,
        runs = S.filter(s => s.runDoneAt).length;
      $("stats").innerHTML = `<span><b>${S.length}</b> sensors</span><span><b>${runs}</b> runs complete</span><span><b>${lab}</b> labeled</span><span><b>${ph2}</b> with both photos</span><span><b>${ph0}</b> with no photos</span>`;
    }

    // ---------- drawing ----------
    const cv = $("map"), cx = cv.getContext("2d");
    const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const IDF_COL = { 1: "#e8742c", 2: "#3b82f6", 3: "#22c55e", 4: "#eab308", 5: "#a855f7", 6: "#ec4899" };
    function colorOf(s) {
      if (mode === "idf") return IDF_COL[s.idf] || "#94a3b8";
      if (mode === "photos") return s.photos >= 2 ? "#22c55e" : s.photos === 1 ? "#f59e0b" : "#ef4444";
      if (mode === "labeled") return s.labeledAt ? "#22c55e" : "#ef4444";
      if (mode === "height") { const t = Math.max(0, Math.min(1, ((s.z ?? 12) - 7) / 10)); return `hsl(${220 - t * 200},75%,55%)`; }
      if (mode === "switch") return s.sw === "new" ? "#ef4444" : `hsl(${((Number(s.sw) || 0) * 47) % 360},70%,58%)`;
      if (mode === "runs") return s.runDoneAt ? "#22c55e" : "#ef4444";
    }
    function legend() {
      const L = {
        idf: Object.entries(IDF_COL).map(([k, c]) => [c, "IDF " + k]),
        photos: [["#22c55e", "2+ photos"], ["#f59e0b", "1 photo"], ["#ef4444", "none"]],
        labeled: [["#22c55e", "labeled"], ["#ef4444", "not yet"]],
        height: [["hsl(220,75%,55%)", "7 ft"], ["hsl(120,75%,55%)", "12 ft"], ["hsl(20,75%,55%)", "17 ft"]],
        switch: [["#ef4444", "needs the 3rd switch (IDF 2 / 5)"], ["#94a3b8", "each color = one switch #"]],
        runs: [["#22c55e", "run complete"], ["#ef4444", "not yet"]],
      }[mode];
      $("legend").innerHTML = L.map(([c, t]) => `<span><i style="background:${c}"></i>${esc(t)}</span>`).join("");
    }
    // WIRING view: MDF in the middle, the 6 IDFs on a ring, each IDF's switches around it, each switch's sensors
    // around the switch (one dot per port). Units are "feet" like the floor plan so zoom/pan/tap all just work.
    const HUB = {};   // "idf" / "idf-sw" -> [x, y] centres, for the lines and labels
    function wiringLayout() {
      HUB.mdf = [0, 0];
      const idfs = Object.keys(SWITCHES).map(Number);
      idfs.forEach((idf, a) => {
        const A = -Math.PI / 2 + a / idfs.length * 2 * Math.PI, ix = 150 * Math.cos(A), iy = 150 * Math.sin(A);
        HUB[idf] = [ix, iy];
        const sws = SWITCHES[idf];
        sws.forEach((sw, b) => {
          const Bn = A + (b - (sws.length - 1) / 2) * 0.95, sx = ix + 52 * Math.cos(Bn), sy = iy + 52 * Math.sin(Bn);
          HUB[idf + "-" + sw] = [sx, sy];
          const mine = S.filter(t => t.idf === idf && t.sw === sw).sort((p, q) => p.port - q.port);
          mine.forEach((t, k) => { const C = k / Math.max(1, mine.length) * 2 * Math.PI; t.wx = sx + 17 * Math.cos(C); t.wy = sy + 17 * Math.sin(C); });
        });
      });
      S.forEach(t => { if (t.wx == null) { t.wx = 0; t.wy = -20; } });
    }
    const X = s => layout === "wiring" ? s.wx : s.x, Y = s => layout === "wiring" ? s.wy : s.y;
    let view = { s: 1, ox: 0, oy: 0, dpr: 1 }, base = null, B = null;
    function fit() {
      const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
      if (!S.length) return draw();
      const xs = S.map(X), ys = S.map(Y);
      B = { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
      const pad = 24 * dpr, s = Math.min((cv.width - 2 * pad) / (B.x1 - B.x0 || 1), (cv.height - 2 * pad) / (B.y1 - B.y0 || 1));
      view = { s, dpr, ox: (cv.width - (B.x1 - B.x0) * s) / 2, oy: (cv.height - (B.y1 - B.y0) * s) / 2 }; base = Object.assign({}, view);
      draw();
    }
    // plan Y grows upward; the screen grows downward, so flip it
    const P = s => [view.ox + (X(s) - B.x0) * view.s, view.oy + (B.y1 - Y(s)) * view.s];
    const PP = ([x, y]) => [view.ox + (x - B.x0) * view.s, view.oy + (B.y1 - y) * view.s];
    function draw() {
      cx.fillStyle = css("--secondaryBackgroundColor") || "#0f172a"; cx.fillRect(0, 0, cv.width, cv.height);
      if (!S.length || !B) return;
      const dpr = view.dpr, zoom = view.s / base.s, r = Math.min(9, 3.2 * Math.sqrt(zoom)) * dpr;
      if (layout === "wiring") drawWiring(dpr, r);
      // 10 ft grid so distances read like a floor plan
      cx.strokeStyle = layout === "wiring" ? "rgba(0,0,0,0)" : "rgba(148,163,184,.10)"; cx.lineWidth = 1;
      const step = zoom > 3 ? 10 : 50;
      cx.beginPath();
      for (let gx = Math.ceil(B.x0 / step) * step; gx <= B.x1; gx += step) { const X = view.ox + (gx - B.x0) * view.s; cx.moveTo(X, 0); cx.lineTo(X, cv.height); }
      for (let gy = Math.ceil(B.y0 / step) * step; gy <= B.y1; gy += step) { const Y = view.oy + (B.y1 - gy) * view.s; cx.moveTo(0, Y); cx.lineTo(cv.width, Y); }
      cx.stroke();
      for (const s of S) { const [x, y] = P(s); if (x < -20 || y < -20 || x > cv.width + 20 || y > cv.height + 20) continue;
        cx.fillStyle = colorOf(s); cx.beginPath(); cx.arc(x, y, r, 0, 6.283); cx.fill(); }
      if (zoom >= 2.2) {
        cx.font = `600 ${11 * dpr}px system-ui, sans-serif`; cx.fillStyle = css("--textColor") || "#e5e7eb";
        for (const s of S) { const [x, y] = P(s); if (x > 0 && y > 0 && x < cv.width && y < cv.height) cx.fillText(String(s.m), x + r + 2 * dpr, y + 4 * dpr); }
      }
      if (sel >= 0) { const s = S[sel], [x, y] = P(s); cx.strokeStyle = css("--textColor") || "#fff"; cx.lineWidth = 2.5 * dpr;
        cx.beginPath(); cx.arc(x, y, r + 5 * dpr, 0, 6.283); cx.stroke(); }
      if (layout === "wiring") return;
      // scale bar
      const ft = zoom > 3 ? 10 : 50, w = ft * view.s;
      cx.fillStyle = css("--mutedText") || "#94a3b8"; cx.fillRect(14 * dpr, cv.height - 18 * dpr, w, 3 * dpr);
      cx.font = `${11 * dpr}px system-ui, sans-serif`; cx.fillText(ft + " ft", 14 * dpr, cv.height - 24 * dpr);
    }
    function drawWiring(dpr, r) {
      const fg = css("--textColor") || "#e5e7eb", mut = css("--mutedText") || "#94a3b8";
      cx.lineWidth = 1 * dpr; cx.strokeStyle = "rgba(148,163,184,.28)"; cx.beginPath();
      for (const s of S) { if (!s.sw) continue; const a = P(s), b = PP(HUB[s.idf + "-" + s.sw]); cx.moveTo(a[0], a[1]); cx.lineTo(b[0], b[1]); }
      cx.stroke();
      cx.lineWidth = 2.5 * dpr; cx.strokeStyle = "rgba(148,163,184,.45)"; cx.beginPath();
      for (const idf of Object.keys(SWITCHES)) { const c = PP(HUB[idf]), m = PP(HUB.mdf); cx.moveTo(m[0], m[1]); cx.lineTo(c[0], c[1]);
        for (const sw of SWITCHES[idf]) { const w = PP(HUB[idf + "-" + sw]); cx.moveTo(c[0], c[1]); cx.lineTo(w[0], w[1]); } }
      cx.stroke();
      cx.textAlign = "center";
      const node = (pt, rad, fill, label, sub) => { const [x, y] = PP(pt); cx.fillStyle = fill; cx.beginPath(); cx.arc(x, y, rad * dpr, 0, 6.283); cx.fill();
        cx.fillStyle = "#fff"; cx.font = `700 ${11 * dpr}px system-ui, sans-serif`; cx.fillText(label, x, y + 4 * dpr);
        if (sub) { cx.fillStyle = mut; cx.font = `600 ${10 * dpr}px system-ui, sans-serif`; cx.fillText(sub, x, y + (rad + 13) * dpr); } };
      node(HUB.mdf, 18, "#475569", "MDF");
      for (const idf of Object.keys(SWITCHES)) {
        const rs = S.filter(s => s.idf === Number(idf)), done = rs.filter(s => s.runDoneAt).length;
        node(HUB[idf], 16, IDF_COL[idf] || "#64748b", "IDF " + idf, `${done}/${rs.length} runs`);
        for (const sw of SWITCHES[idf]) { const n = S.filter(s => s.idf === Number(idf) && s.sw === sw).length;
          node(HUB[idf + "-" + sw], 11, sw === "new" ? "#ef4444" : "#334155", sw === "new" ? "new" : "#" + sw, `${n} / 18`); }
      }
      cx.textAlign = "start";
    }
    // ---------- the sensor card: photos, add photo, run complete, labeled ----------
    async function thumbs(s) {
      const box = $("photos"); if (!box) return;
      if (!s.items.length) { box.innerHTML = '<span class="muted">No photos yet.</span>'; return; }
      box.innerHTML = s.items.map(() => '<a><img alt="" /></a>').join("");
      const links = box.querySelectorAll("a");
      await Promise.all(s.items.map(async (it, k) => { try { const u = await getDownloadURL(it);
        links[k].href = u; links[k].target = "_blank"; links[k].rel = "noopener"; links[k].firstChild.src = u; links[k].firstChild.alt = it.name; } catch (_) {} }));
    }
    async function setFlag(field, on) {
      const s = S[sel]; if (!s || !OWNER) return;
      const ts = on ? Date.now() : null, btn = $(field === "runDoneAt" ? "runBtn" : "labBtn"); if (btn) btn.disabled = true;
      try { await update(ref(database, metaPath()), { [`${s.m}/${field}`]: ts }); s[field] = ts; renderStats(); show(sel); }
      catch (e) { alert("Couldn't save: " + (e.code || e.message || e)); if (btn) btn.disabled = false; }
    }
    function resizeImage(file, maxW) { return new Promise((res, rej) => { const img = new Image(), u = URL.createObjectURL(file);
      img.onload = () => { let w = img.width, h = img.height; if (w > maxW) { h *= maxW / w; w = maxW; }
        const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej("Resize failed"), "image/jpeg", 0.9); };
      img.onerror = () => rej("Invalid image."); img.src = u; }); }
    function addBar(blob, text) { return new Promise((res, rej) => { const img = new Image(), u = URL.createObjectURL(blob);   // same bottom bar as radar-tools
      img.onload = () => { const bar = Math.max(80, img.width * 0.08), c = document.createElement("canvas"); c.width = img.width; c.height = img.height + bar;
        const g = c.getContext("2d"); g.drawImage(img, 0, 0); g.fillStyle = "black"; g.fillRect(0, img.height, c.width, bar);
        let fs = Math.floor(c.width / 15); g.font = `${fs}px Arial`; g.textAlign = "center"; g.textBaseline = "middle";
        while (g.measureText(text).width > c.width * 0.9 && fs > 10) { fs -= 2; g.font = `${fs}px Arial`; }
        g.fillStyle = "white"; g.fillText(text, c.width / 2, img.height + bar / 2);
        URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej("Markup failed"), "image/jpeg", 0.95); };
      img.onerror = () => rej("Invalid image."); img.src = u; }); }
    async function uniqueName(dir, name) {
      const dot = name.lastIndexOf("."), b = name.slice(0, dot), ext = name.slice(dot); let n = 0;
      for (;;) { const t = n ? `${b}_${n}${ext}` : name;
        try { await getDownloadURL(storageRef(storage, `${dir}/${t}`)); n++; }
        catch (e) { if (e?.code === "storage/object-not-found") return t; throw e; } }
    }
    async function addPhoto(file) {
      const s = S[sel]; if (!s || !file || !OWNER) return;
      let serial = clean(s.serial);
      if (!serial) { serial = clean(prompt(`Sensor #${s.m} has no serial yet. Serial number:`) || ""); if (!serial) return;
        await update(ref(database, metaPath()), { [`${s.m}/serial`]: serial, [`${s.m}/updatedAt`]: Date.now() }).catch(() => {}); s.serial = serial; }
      const st = $("upState"); if (st) st.textContent = "Uploading...";
      try {
        const nn = String(s.m).padStart(2, "0");
        let blob = await resizeImage(file, 2048);
        blob = await addBar(blob, `${String(TASKREC.customerName || TASKREC.project || "").trim()} ${nn} - ${serial}`);
        const dir = photoDir(), name = await uniqueName(dir, `${PRE}_${nn}-${serial}.jpg`);
        await uploadBytes(storageRef(storage, `${dir}/${name}`), blob, { contentType: "image/jpeg" });
        s.items.push(storageRef(storage, `${dir}/${name}`)); s.photos++;
        renderStats(); show(sel);
      } catch (e) { if (st) st.textContent = ""; alert("Upload failed: " + (e.code || e.message || e)); }
    }
    function show(i) {
      sel = i; const s = S[i];
      $("info").innerHTML = `<div class="mk">#${s.m}</div><div class="kv">
        <b>Serial</b><span>${esc(s.serial) || "-"}</span>
        <b>Position</b><span>X ${fmtFt(s.x)} · Y ${fmtFt(s.y)}</span>
        <b>Height</b><span>${fmtFt(s.z)}</span>
        ${s.idf ? `<b>IDF / zone</b><span>IDF ${s.idf} · zone ${s.zone}</span>` : ""}
        ${s.sw ? `<b>Switch</b><span>${s.sw === "new" ? "3rd switch needed (not on site yet)" : "#" + s.sw}${s.port ? " · port " + s.port : ""} (planned)</span>` : ""}
        <b>Run</b><span>${s.runDoneAt ? "complete, " + new Date(s.runDoneAt).toLocaleString() : "not yet"}</span>
        <b>Labeled</b><span>${s.labeledAt ? "yes, " + new Date(s.labeledAt).toLocaleString() : "not yet"}</span>
        <b>Photos</b><span>${s.photos} of 2</span></div>
        <div class="photos" id="photos"></div>
        <div class="acts">
          <label class="btn primary">&#128247; Add photo<input type="file" id="addPhoto" accept="image/*" capture="environment" hidden /></label>
          <button type="button" id="runBtn" class="${s.runDoneAt ? "done" : ""}">${s.runDoneAt ? "&#10003; Run complete" : "Mark run complete"}</button>
          <button type="button" id="labBtn" class="${s.labeledAt ? "done" : ""}">${s.labeledAt ? "&#10003; Labeled" : "Mark labeled"}</button>
          <span class="muted" id="upState"></span>
        </div>
        <div class="note">Photos save like radar-tools: "${esc(PRE)}_${String(s.m).padStart(2, "0")}-${esc(s.serial || "serial")}.jpg" with the label bar.</div>`;
      $("addPhoto").onchange = e => addPhoto(e.target.files[0]);
      $("runBtn").onclick = () => setFlag("runDoneAt", !s.runDoneAt);
      $("labBtn").onclick = () => setFlag("labeledAt", !s.labeledAt);
      thumbs(s);
      draw();
    }

    // ---------- zoom / pan / tap ----------
    const ptr = new Map(); let drag = null, pinch = null, moved = false;
    const toC = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * view.dpr, (e.clientY - r.top) * view.dpr]; };
    function zoomAt(px, py, f) { if (!base) return; const ns = Math.max(base.s * .7, Math.min(base.s * 30, view.s * f)); f = ns / view.s;
      view.ox = px - (px - view.ox) * f; view.oy = py - (py - view.oy) * f; view.s = ns; draw(); }
    cv.addEventListener("wheel", e => { e.preventDefault(); const [x, y] = toC(e); zoomAt(x, y, Math.exp(-e.deltaY * .0015)); }, { passive: false });
    cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId, toC(e)); moved = false;
      if (ptr.size === 1) drag = toC(e); if (ptr.size === 2) { const [a, b] = [...ptr.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); } });
    cv.addEventListener("pointermove", e => { if (!ptr.has(e.pointerId)) return; const p = toC(e); ptr.set(e.pointerId, p);
      if (ptr.size === 2 && pinch) { const [a, b] = [...ptr.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, d / pinch); pinch = d; moved = true; }
      else if (drag) { const dx = p[0] - drag[0], dy = p[1] - drag[1]; if (Math.abs(dx) + Math.abs(dy) > 6) moved = true; view.ox += dx; view.oy += dy; drag = p; draw(); } });
    const up = e => { ptr.delete(e.pointerId); if (ptr.size < 2) pinch = null; if (!ptr.size) drag = null; };
    cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
    cv.addEventListener("dblclick", () => { if (base) { view = Object.assign({}, base); draw(); } });
    cv.addEventListener("click", e => { if (moved) { moved = false; return; }
      const [mx, my] = toC(e); let best = -1, bd = (22 * view.dpr) ** 2;
      S.forEach((s, i) => { const [x, y] = P(s), d = (x - mx) ** 2 + (y - my) ** 2; if (d < bd) { bd = d; best = i; } });
      if (best >= 0) show(best); });
    $("modes").addEventListener("click", e => { const b = e.target.closest("button[data-m]"); if (!b) return;
      mode = b.dataset.m; document.querySelectorAll("#modes button").forEach(x => x.classList.toggle("on", x === b)); legend(); draw(); });
    $("find").addEventListener("change", e => { const i = S.findIndex(s => s.m === Number(e.target.value)); if (i < 0) return;
      const s = S[i]; view.s = base.s * 6; const [x, y] = [ (X(s) - B.x0) * view.s, (B.y1 - Y(s)) * view.s ];
      view.ox = cv.width / 2 - x; view.oy = cv.height / 2 - y; show(i); });
    $("views").addEventListener("click", e => { const b = e.target.closest("button[data-v]"); if (!b) return;
      if (b.dataset.v === "wiring" && !IS_WM54) { alert("The wiring view needs a switch plan - only Walmart 54 has one so far."); return; }
      layout = b.dataset.v; document.querySelectorAll("#views button").forEach(x => x.classList.toggle("on", x === b)); fit(); });
    addEventListener("resize", fit);
    legend(); fit();
    onAuthStateChanged(auth, u => load(u));
  </script>
</body>
