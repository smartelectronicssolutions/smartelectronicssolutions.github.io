<!DOCTYPE html>
<html lang="en">
<head>
  <title>Sign in - Luis Solutions</title>
  <meta charset="UTF-8" />
  <meta name="version" content="1.0.0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="../assets/css/online.css" />
  <script>(function () { var t = localStorage.getItem("ss-theme"); if (t === "light") document.documentElement.classList.add("light"); }());</script>
  <style>
    .sso { max-width: 360px; margin: 12vh auto 0; padding: 24px; border: 1px solid var(--border, #333); border-radius: 12px; background: var(--panel, rgba(255,255,255,.03)); }
    .sso h1 { font-size: 1.25rem; margin: 0 0 4px; }
    .sso p { margin: 0 0 16px; opacity: .8; font-size: .9rem; }
    .sso input { width: 100%; box-sizing: border-box; margin: 0 0 10px; padding: 10px; font-size: 1rem; }
    .sso button { width: 100%; padding: 10px; font-size: 1rem; cursor: pointer; }
    .sso .msg { margin-top: 12px; font-size: .9rem; min-height: 1.2em; }
    .sso .err { color: #e06c6c; }
    .sso .who { margin: 0 0 12px; }
    .sso .link { background: none; border: 0; padding: 6px 0 0; color: inherit; opacity: .7; text-decoration: underline; width: auto; font-size: .85rem; }
  </style>
</head>
<body>
<main class="sso">
  <h1>Sign in</h1>
  <p id="sub">with your Luis Solutions account</p>
  <div id="signed" hidden>
    <div class="who">Signed in as <b id="who"></b></div>
    <button id="go">Continue</button>
    <button class="link" id="other">Use a different account</button>
  </div>
  <form id="form" hidden>
    <input id="email" type="email" autocomplete="username" placeholder="Email" required />
    <input id="pass" type="password" autocomplete="current-password" placeholder="Password" required />
    <button type="submit">Sign in</button>
  </form>
  <div class="msg" id="msg"></div>
</main>
<script type="module">
// SSO hand-off page for the romm-sso bridge (E:\Containers\ops\romm-sso, 2026-10-13).
// The bridge sends people here with ?rid=<pending request>; this page signs them in with Firebase (or reuses the
// session these sites already have), then hands the Firebase ID token to the bridge, which redirects back to the app.
import { auth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "../assets/js/firebase-init.js";
const q = new URLSearchParams(location.search);
const BRIDGES = ["https://auth.luissolutions.us", "http://localhost:3120"];   // never post a token anywhere else
const bridge = BRIDGES.includes(q.get("bridge")) ? q.get("bridge") : BRIDGES[0];
const rid = q.get("rid") || "", appName = (q.get("app") || "the app").slice(0, 40);
const $ = id => document.getElementById(id), msg = (t, err) => { $("msg").textContent = t; $("msg").className = "msg" + (err ? " err" : ""); };
$("sub").textContent = `to continue to ${appName}`;
if (!rid) msg("Open this from the app's sign-in button.", true);

let busy = false;
async function handOff(user) {
  if (busy || !rid) return; busy = true; msg(`Signing you in to ${appName}...`);
  try {
    const idToken = await user.getIdToken(true);
    const r = await fetch(`${bridge}/authorize/complete`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ rid, idToken }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.redirect) throw new Error(j.error || `Sign-in failed (${r.status})`);
    location.replace(j.redirect);
  } catch (e) { busy = false; msg(e.message, true); }
}

onAuthStateChanged(auth, user => {
  $("signed").hidden = !user; $("form").hidden = !!user;
  if (user) { $("who").textContent = user.email; }
});
$("go").addEventListener("click", () => auth.currentUser && handOff(auth.currentUser));
$("other").addEventListener("click", () => signOut(auth));
$("form").addEventListener("submit", async e => {
  e.preventDefault(); msg("Signing in...");
  try { const c = await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); handOff(c.user); }
  catch (err) { msg(err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" ? "Wrong email or password." : err.message, true); }
});
</script>
</body>
</html>
