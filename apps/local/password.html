<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator</title>
  <!-- house style (2026-09-30, L: "match the current theme"): shared online.css + light/dark toggle.
       Local-only app - no Firebase, so no auth bar. -->
  <link rel="stylesheet" href="../assets/css/online.css" />
  <link rel="icon" href="../../favicon.ico" />
  <script>
    (function () {
      const t = localStorage.getItem("ss-theme");
      if (t === "light") document.documentElement.classList.add("light");
    })();
  </script>
  <style>
    .app-shell { max-width: 640px; margin: auto; padding: 12px; }
    .card { border: 1px solid rgba(128,128,128,.35); border-radius: 12px; padding: 14px 16px; margin: 14px 0; }
    .card h2 { margin: 0 0 10px; font-size: 1.15rem; }
    .result { font-family: ui-monospace, Consolas, monospace; font-size: 1.2rem; word-break: break-all;
              min-height: 1.6em; padding: 10px 12px; border-radius: 8px; background: rgba(128,128,128,.15);
              cursor: pointer; margin-bottom: 12px; user-select: all; }
    .result:hover { background: rgba(128,128,128,.25); }
    .setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0; }
    .setting input[type=number], .setting select { width: 7em; padding: 4px 6px; border-radius: 6px; }
    .setting input[type=checkbox] { width: 20px; height: 20px; }
    .hint { opacity: .75; font-size: .9em; }
    .card button { width: 100%; margin-top: 10px; }
    .input-wrapper { display: flex; gap: 8px; margin-top: 8px; }
    .input-wrapper .input-box { flex: 1; padding: 6px 8px; border-radius: 6px; }
    .input-wrapper button { width: auto; margin: 0; }
  </style>

<body>
  <header style="position:relative;">
    <div class="logo-box"><a href="../../index.html"><img src="../../assets/img/android-chrome-192x192.png" alt="Home"></a></div>
    <h1>Password Generator</h1>
    <button id="theme-toggle" title="Toggle theme">☀️</button>
    <script>
      (function () {
        const btn = document.getElementById("theme-toggle");
        const html = document.documentElement;
        btn.textContent = html.classList.contains("light") ? "🌙" : "☀️";
        btn.addEventListener("click", function () {
          const next = html.classList.contains("light") ? "dark" : "light";
          html.classList.toggle("light", next === "light");
          localStorage.setItem("ss-theme", next);
          btn.textContent = next === "light" ? "🌙" : "☀️";
        });
      })();
    </script>
  </header>

  <main>
    <div class="app-shell" id="password-app">
      <div class="card">
        <h2>Password</h2>
        <div class="result" title="Tap to copy"><span id="result"></span></div>
        <div class="setting"><label for="length">Length</label><input type="number" id="length" min="4" max="23" value="16" /></div>
        <div class="setting"><label for="uppercase">Uppercase letters</label><input type="checkbox" id="uppercase" checked /></div>
        <div class="setting"><label for="lowercase">Lowercase letters</label><input type="checkbox" id="lowercase" checked /></div>
        <div class="setting"><label for="numbers">Numbers</label><input type="checkbox" id="numbers" checked /></div>
        <div class="setting"><label for="symbols">Symbols</label><input type="checkbox" id="symbols" checked /></div>
        <button id="generate">Generate password</button>
      </div>

      <div class="card" id="phrase-app">
        <h2>Word Generator (passphrase)</h2>
        <div class="result" title="Tap to copy"><span id="phrase-result"></span></div>
        <div class="setting"><label for="phrase-list">Word list</label>
          <select id="phrase-list"><option value="eff">Short &amp; easy (EFF)</option><option value="bip39">Trezor-style (BIP39)</option></select></div>
        <div class="setting"><label for="phrase-words">Number of words</label><input type="number" id="phrase-words" min="3" max="10" value="4" /></div>
        <div class="setting"><label for="phrase-sep">Separator</label>
          <select id="phrase-sep"><option value="-">- dash</option><option value=".">. dot</option><option value="_">_ underscore</option><option value=" ">space</option><option value="">none</option></select></div>
        <div class="setting"><label for="phrase-caps">Capitalize each word</label><input type="checkbox" id="phrase-caps" checked /></div>
        <div class="setting"><label for="phrase-num">Add a number</label><input type="checkbox" id="phrase-num" checked /></div>
        <div class="setting"><span id="phrase-bits" class="hint"></span></div>
        <button id="phrase-generate">Generate words</button>
      </div>

      <div class="card convert-container">
        <h2>Character Converter</h2>
        <div class="setting"><label for="conversion-type">Conversion type</label>
          <select id="conversion-type">
            <option value="rot13">ROT13</option>
            <option value="table1">Major System</option>
            <option value="table2">Letter #</option>
          </select></div>
        <div class="setting"><label for="alternate-caps">Apply Alts</label><input type="checkbox" id="alternate-caps" checked /></div>
        <div class="input-wrapper">
          <input class="input-box" id="input-box" type="password" placeholder="Enter text">
          <button class="copy-button" id="copy-input">Copy</button>
        </div>
        <div class="hint">Characters: <span id="input-counter">0</span></div>
      </div>
    </div>
  </main>

  <script>
    const resultEl = document.getElementById('result');
    const lengthEl = document.getElementById('length');
    const uppercaseEl = document.getElementById('uppercase');
    const lowercaseEl = document.getElementById('lowercase');
    const numbersEl = document.getElementById('numbers');
    const symbolsEl = document.getElementById('symbols');
    const generateEl = document.getElementById('generate');

    const randomFunc = {
      lower: getRandomLower,
      upper: getRandomUpper,
      number: getRandomNumber,
      symbol: getRandomSymbol
    };

    resultEl.addEventListener('click', () => {
      const textarea = document.createElement('textarea');
      const password = resultEl.innerText;

      if (!password) { return; }

      textarea.value = password;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      textarea.remove();

      resultEl.innerText = 'Copied to clipboard!';
      setTimeout(() => {
        resultEl.innerText = password;
      }, 1000);
    });

    generateEl.addEventListener('click', () => {
      const length = +lengthEl.value;
      const hasLower = lowercaseEl.checked;
      const hasUpper = uppercaseEl.checked;
      const hasNumber = numbersEl.checked;
      const hasSymbol = symbolsEl.checked;

      resultEl.innerText = generatePassword(hasLower, hasUpper, hasNumber, hasSymbol, length);
    });

    function generatePassword(lower, upper, number, symbol, length) {
      let generatedPassword = '';
      const typesCount = lower + upper + number + symbol;
      const typesArr = [{ lower }, { upper }, { number }, { symbol }].filter(item => Object.values(item)[0]);

      if (typesCount === 0) {
        return '';
      }

      for (let i = 0; i < length; i += typesCount) {
        typesArr.forEach(type => {
          const funcName = Object.keys(type)[0];
          generatedPassword += randomFunc[funcName]();
        });
      }

      const finalPassword = generatedPassword.slice(0, length);

      return finalPassword;
    }

    // Crypto-grade pick in [0, n) - rejection sampling so no value is favored (2026-09-30, L: keep the
    // lower/upper/number/symbol order, just stop the picks inside each slot from being predictable).
    function randInt(n) {
      const buf = new Uint32Array(1);
      const limit = Math.floor(0x100000000 / n) * n;
      do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
      return buf[0] % n;
    }

    function getRandomLower() {
      return String.fromCharCode(randInt(26) + 97);
    }

    function getRandomUpper() {
      return String.fromCharCode(randInt(26) + 65);
    }

    function getRandomNumber() {
      return +String.fromCharCode(randInt(10) + 48);
    }

    function getRandomSymbol() {
      const symbols = '!@#$%^&*(){}[]=<>/,.'
      return symbols[randInt(symbols.length)];
    }

    const conversionTable1 = {
      'c': 7, 'C': 7,
      'r': 4, 'R': 4,
      's': 0, 'S': 0, 'z': 0, 'Z': 0,
      't': 1, 'T': 1, 'd': 1, 'D': 1,
      'n': 2, 'N': 2,
      'm': 3, 'M': 3,
      'l': 5, 'L': 5,
      'j': 6, 'J': 6,
      'k': 7, 'K': 7, 'q': 7, 'Q': 7,
      'f': 8, 'F': 8, 'v': 8, 'V': 8,
      'p': 9, 'P': 9, 'b': 9, 'B': 9
    };

    const conversionTable2 = {
      'a': 1, 'A': 1,
      'b': 2, 'B': 2,
      'c': 3, 'C': 3,
      'd': 4, 'D': 4,
      'e': 5, 'E': 5,
      'f': 6, 'F': 6,
      'g': 7, 'G': 7,
      'h': 8, 'H': 8,
      'i': 9, 'I': 9,
      'j': 10, 'J': 10,
      'k': 11, 'K': 11,
      'l': 12, 'L': 12,
      'm': 13, 'M': 13,
      'n': 14, 'N': 14,
      'o': 15, 'O': 15,
      'p': 16, 'P': 16,
      'q': 17, 'Q': 17,
      'r': 18, 'R': 18,
      's': 19, 'S': 19,
      't': 20, 'T': 20,
      'u': 21, 'U': 21,
      'v': 22, 'V': 22,
      'w': 23, 'W': 23,
      'x': 24, 'X': 24,
      'y': 25, 'Y': 25,
      'z': 26, 'Z': 26,
    };

    const inputBoxEl = document.getElementById('input-box');
    const conversionTypeEl = document.getElementById('conversion-type');

    function convertText(text, conversionTable) {
      return text.split('').map(char => {
        if (conversionTable[char]) {
          return conversionTable[char];
        } else {
          return char;
        }
      }).join('');
    }

    inputBoxEl.addEventListener('input', () => {
      const conversionType = conversionTypeEl.value;
      let inputBoxValue = inputBoxEl.value.replace(/\s/g, '');

      let convertedText;
      switch (conversionType) {
        case 'table1':
          convertedText = convertText(inputBoxValue, conversionTable1);
          break;
        case 'table2':
          convertedText = convertText(inputBoxValue, conversionTable2);
          break;
        case 'rot13':
          convertedText = applyROT13(inputBoxValue);
          break;
        default:
          convertedText = inputBoxValue;
      }

      if (document.getElementById('alternate-caps').checked) {
        convertedText = alternateCaps(convertedText);
      }

      inputBoxEl.value = convertedText;
      document.getElementById('input-counter').innerText = convertedText.length;
    });

    function alternateCaps(text) {
      let result = '';
      for (let i = 0; i < text.length; i++) {
        let char = text[i];
        if (i % 2 === 0) {
          char = char.toUpperCase();
        } else {
          char = char.toLowerCase();
        }

        if (char === 's' || char === 'S') {
          char = '$';
        } else if (char === 'a' || char === 'A') {
          char = '@';
        }

        result += char;
      }
      return result;
    }

    const copyInputEl = document.getElementById('copy-input');
    copyInputEl.addEventListener('click', () => {
      const inputBox = document.getElementById('input-box');
      const password = inputBox.value;

      if (password) {
        localStorage.setItem('copiedPassword', password);

        const textarea = document.createElement('textarea');
        textarea.value = password;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);

        copyInputEl.innerText = 'Copied!';
        setTimeout(() => {
          copyInputEl.innerText = 'Copy';
        }, 1000);

        setTimeout(() => {
          localStorage.removeItem('copiedPassword');
        }, 1000);
      }
    });

    function applyROT13(text) {
      return text.split('').map(char => {
        if (char >= 'a' && char <= 'z') {
          return String.fromCharCode(((char.charCodeAt(0) - 97 + 13) % 26) + 97);
        } else if (char >= 'A' && char <= 'Z') {
          return String.fromCharCode(((char.charCodeAt(0) - 65 + 13) % 26) + 65);
        }
        return char;
      }).join('');
    }
  </script>

    (function () {
      const out = document.getElementById('phrase-result');
      const bits = document.getElementById('phrase-bits');
      function makePhrase() {
        const n = Math.min(10, Math.max(3, +document.getElementById('phrase-words').value || 4));
        const sep = document.getElementById('phrase-sep').value;
        const caps = document.getElementById('phrase-caps').checked;
        const addNum = document.getElementById('phrase-num').checked;
        const LIST = document.getElementById('phrase-list').value === 'bip39' ? BIP39 : EFF_SHORT;
        const parts = [];
        for (let i = 0; i < n; i++) {
          const w = LIST[randInt(LIST.length)];
          parts.push(caps ? w[0].toUpperCase() + w.slice(1) : w);
        }
        if (addNum) parts.splice(randInt(parts.length + 1), 0, String(randInt(100)));
        out.innerText = parts.join(sep);
        const b = n * Math.log2(LIST.length) + (addNum ? Math.log2(100 * (n + 1)) : 0);
        bits.innerText = '~' + Math.round(b) + ' bits' + (b >= 70 ? ' - strong' : b >= 50 ? ' - good for most logins' : ' - add a word');
      }
      document.getElementById('phrase-generate').addEventListener('click', makePhrase);
      // Trezor-style looks like a seed card: lowercase, space-separated, no number - switching sets that up (still editable)
      document.getElementById('phrase-list').addEventListener('change', e => {
        const t = e.target.value === 'bip39';
        document.getElementById('phrase-caps').checked = !t;
        document.getElementById('phrase-num').checked = !t;
        document.getElementById('phrase-sep').value = t ? ' ' : '-';
        if (t && +document.getElementById('phrase-words').value < 7) document.getElementById('phrase-words').value = 7;
        makePhrase();
      });
      out.addEventListener('click', () => {
        const p = out.innerText; if (!p || p === 'Copied!') return;
        navigator.clipboard.writeText(p).then(() => { out.innerText = 'Copied!'; setTimeout(() => { out.innerText = p; }, 1000); });
      });
      makePhrase();
      document.getElementById('generate').click();   // a fresh password on load too, so neither box opens empty
    })();
  </script>
