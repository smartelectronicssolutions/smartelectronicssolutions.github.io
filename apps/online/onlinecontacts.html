<!doctype html>
<html lang="en">

<head>
  <title>Contact Information Management</title>
  <meta charset="UTF-8" />
  <meta name="version" content="1.0.1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../assets/css/online.css" />
  <script>(function () { var t = localStorage.getItem("ss-theme"); if (t === "light") document.documentElement.classList.add("light"); }());</script>
  <script type="module" src="../assets/js/auth.js" defer></script>
  <script src="../assets/js/links-aside.js" defer></script>
  <script src="../assets/js/search.js" defer></script>
  <style>
    main {
      padding: 12px 16px 60px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .toolbar #searchContacts {
      flex: 1 1 240px;
      min-width: 180px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
    }

    .toolbar .count {
      font-size: 13px;
      color: var(--muted);
      margin-left: auto;
    }

    .chk {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      cursor: pointer;
    }

    .btn {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface2);
      color: inherit;
      cursor: pointer;
      font-size: 14px;
    }

    .btn.primary {
      background: var(--accent);
      color: var(--on-primary);
      border-color: transparent;
    }

    .btn.danger {
      background: var(--danger);
      color: var(--on-primary);
      border-color: transparent;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }

    table.contacts {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    table.contacts th {
      text-align: left;
      padding: 10px 12px;
      background: var(--surface2);
      position: sticky;
      top: 0;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
      z-index: 1;
    }

    table.contacts th .arrow {
      color: var(--muted);
      font-size: 11px;
    }

    table.contacts td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    table.contacts tr.row {
      cursor: pointer;
    }

    table.contacts tr.row:hover td {
      background: var(--surface2);
    }

    table.contacts .name {
      font-weight: 600;
      white-space: nowrap;
    }

    table.contacts .muted,
    .missing {
      color: var(--muted);
    }

    tr.incomplete td:first-child {
      box-shadow: inset 3px 0 0 var(--warn);
    }

    .trunc {
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--scrim);
      display: none;
      align-items: flex-start;
      justify-content: center;
      z-index: 1000;
      padding: 40px 16px;
      overflow-y: auto;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 520px;
      position: relative;
      box-shadow: var(--shadow);
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
    }

    .modal-card h2 {
      margin: 0 40px 12px 0;
    }

    .modal-card label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
    }

    .modal-card input {
      width: 100%;
      padding: 9px;
      margin-top: 4px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .contact-summary {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .contact-subtle {
      font-size: 12px;
      color: var(--muted);
    }

    .field-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .field-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 12px;
    }

    .project-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: var(--surface2);
      margin-bottom: 8px;
    }

    .project-card h4 {
      margin: 0 0 6px;
    }

    /* 2026-11-10 People view: everyone on any task's contacts[] (PM, store staff, network team) */
    .view-toggle {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .view-toggle button {
      padding: 8px 12px;
      border: none;
      border-radius: 0;
      margin: 0;
      background: var(--surface2);
      color: inherit;
      cursor: pointer;
      font-size: 14px;
    }

    .view-toggle button.on {
      background: var(--accent);
      color: var(--on-primary);
    }

    table.contacts td a {
      color: inherit;
    }

    table.contacts .jobs {
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <header>
    <div class="logo-box"><a href="../../index.html" title="Home"><img src="../../assets/img/android-chrome-192x192.png" alt="Home" style="height:40px;vertical-align:middle;"></a></div>
    <h1>Contacts Manager</h1>
    <div class="auth-bar"><span id="auth-label">Not signed in</span><button id="auth-btn">Sign In</button></div>
    <button id="theme-toggle" title="Toggle theme">☀️</button>
    <script src="../assets/js/theme-toggle.js"></script>
    <div id="login-inline">
      <h3>Sign In</h3><input type="email" id="email-in" placeholder="Email" /><input type="password" id="pass-in"
        placeholder="Password" /><button id="do-login">Sign In</button>
      <p id="auth-err"></p>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="view-toggle" role="group" aria-label="View">
        <button type="button" id="view-customers" class="on">Customers</button>
        <button type="button" id="view-people">People</button>
      </div>
      <input type="text" id="searchContacts" placeholder="Search name, email, phone, company…" />
      <label class="chk" id="incompleteWrap"><input type="checkbox" id="incompleteOnly" /> Incomplete only</label>
      <button class="btn primary" id="open-add">+ Add</button>
      <span class="count" id="count"></span>
    </div>

    <div class="table-wrap" id="customers-wrap">
      <table class="contacts">
        <thead>
          <tr>
            <th data-sort="name">Name <span class="arrow"></span></th>
            <th data-sort="phone">Phone <span class="arrow"></span></th>
            <th data-sort="email">Email <span class="arrow"></span></th>
            <th data-sort="address">Address <span class="arrow"></span></th>
            <th data-sort="company">Company <span class="arrow"></span></th>
          </tr>
        </thead>
        <tbody id="contacts-body"></tbody>
      </table>
    </div>

    <div class="table-wrap" id="people-wrap" hidden>
      <table class="contacts">
        <thead>
          <tr>
            <th data-psort="name">Name <span class="arrow"></span></th>
            <th data-psort="role">Role <span class="arrow"></span></th>
            <th data-psort="phone">Phone <span class="arrow"></span></th>
            <th data-psort="email">Email <span class="arrow"></span></th>
            <th data-psort="jobs">Jobs <span class="arrow"></span></th>
          </tr>
        </thead>
        <tbody id="people-body"></tbody>
      </table>
    </div>
  </main>

  <!-- Edit modal -->
  <div id="contact-modal" class="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" data-close>×</button>
      <h2 id="contact-name"></h2>
      <div class="contact-summary">
        <div>
          <div class="contact-subtle">Phones on record</div>
          <div id="contact-phone-list" class="field-list"></div>
        </div>
        <div>
          <div class="contact-subtle">Emails on record</div>
          <div id="contact-email-list" class="field-list"></div>
        </div>
        <div>
          <div class="contact-subtle">Addresses on record</div>
          <div id="contact-address-list" class="field-list"></div>
        </div>
      </div>
      <div class="contact-subtle">Update all records for this contact:</div>
      <label>Phone<input type="tel" id="contact-phone" placeholder="Phone" /></label>
      <label>Email<input type="email" id="contact-email" placeholder="Email" /></label>
      <label>Address<input type="text" id="contact-address" placeholder="Address" /></label>
      <div class="modal-actions">
        <button class="btn primary" id="save-contact-button">Save</button>
        <button class="btn danger" id="delete-contact-button">Delete</button>
      </div>
      <div id="contact-extra" class="contact-subtle" style="margin-top:12px"></div>
      <h3>Projects</h3>
      <div id="projects-list"></div>
    </div>
  </div>

  <!-- Person modal (read-only: people live on each job's contacts[], edited in onlinejob) -->
  <div id="person-modal" class="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" data-close>×</button>
      <h2 id="person-name"></h2>
      <div class="contact-summary">
        <div>
          <div class="contact-subtle">Roles</div>
          <div id="person-role-list" class="field-list"></div>
        </div>
        <div>
          <div class="contact-subtle">Phones</div>
          <div id="person-phone-list" class="field-list"></div>
        </div>
        <div>
          <div class="contact-subtle">Emails</div>
          <div id="person-email-list" class="field-list"></div>
        </div>
      </div>
      <div class="contact-subtle">Edit a person on the job itself (Jobs app &gt; Contacts).</div>
      <h3>Jobs</h3>
      <div id="person-jobs"></div>
    </div>
  </div>

  <!-- Add modal -->
  <div id="add-modal" class="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" data-close>×</button>
      <h2>Add Contact</h2>
      <label>Name<input type="text" id="new-contact-name" placeholder="Contact name" /></label>
      <label>Phone<input type="tel" id="new-contact-phone" placeholder="Phone" /></label>
      <label>Email<input type="email" id="new-contact-email" placeholder="Email" /></label>
      <label>Address<input type="text" id="new-contact-address" placeholder="Address" /></label>
      <div class="modal-actions">
        <button class="btn primary" id="add-contact-button">Add Contact</button>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      auth,
      onAuthStateChanged,
      database,
      ref,
      get,
      set,
      push,
      remove,
      update,
    } from "../assets/js/firebase-init.js";
    import { onIdTokenChanged } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js";

    const body = document.getElementById("contacts-body");
    const countEl = document.getElementById("count");
    const searchContacts = document.getElementById("searchContacts");
    const incompleteOnly = document.getElementById("incompleteOnly");
    const contactModal = document.getElementById("contact-modal");
    const addModal = document.getElementById("add-modal");
    const contactNameElem = document.getElementById("contact-name");
    const contactPhoneInput = document.getElementById("contact-phone");
    const contactEmailInput = document.getElementById("contact-email");
    const contactAddressInput = document.getElementById("contact-address");
    const contactExtra = document.getElementById("contact-extra");
    const newContactNameInput = document.getElementById("new-contact-name");
    const newContactPhoneInput = document.getElementById("new-contact-phone");
    const newContactEmailInput = document.getElementById("new-contact-email");
    const newContactAddressInput = document.getElementById("new-contact-address");

    const contactSearchHelper = window.SearchEngine?.attachAuto
      ? window.SearchEngine.attachAuto(searchContacts, {
        defaultFields: ["name", "email", "company", "phone"],
        placeholderAdvanced: '🔎… e.g. name:"smith" or company:roycroft',
      })
      : null;

    let selectedContactId = null;
    let selectedName = null;
    let DATABASE_BASE_PATH = "public";
    let authReady = false;
    let currentUser = null;
    let allRows = [];
    let sortField = "name";
    let sortDir = 1;
    let allPeople = [];
    let view = "customers";
    let pSortField = "name";
    let pSortDir = 1;
    const peopleBody = document.getElementById("people-body");
    const personModal = document.getElementById("person-modal");

    function canWrite() {
      return !!(authReady && currentUser);
    }

    onAuthStateChanged(auth, (user) => {
      authReady = true;
      currentUser = user;
      DATABASE_BASE_PATH = user ? (window.lsBasePath ? window.lsBasePath(user) : user.uid) : "public";
      fetchContacts();
    });
    onIdTokenChanged(auth, (user) => {
      currentUser = user;
      DATABASE_BASE_PATH = user ? (window.lsBasePath ? window.lsBasePath(user) : user.uid) : "public";
    });

    async function fetchContacts() {
      const tasksRef = ref(database, `${DATABASE_BASE_PATH}/tasks`);
      const snapshot = await get(tasksRef);
      allRows = snapshot.exists() ? aggregate(snapshot.val()) : [];
      allPeople = snapshot.exists() ? aggregatePeople(snapshot.val()) : [];
      renderTable();
    }

    const uniqueValues = (values) => [
      ...new Set(values.map((v) => String(v || "").trim()).filter(Boolean)),
    ];

    function aggregate(tasks) {
      const map = {};
      for (const taskId in tasks) {
        const task = tasks[taskId];
        const name = (task.customerName || "Unnamed Contact").trim();
        if (!name) continue;
        (map[name] = map[name] || []).push({ taskId, task });
      }
      const rows = [];
      for (const name in map) {
        const cts = map[name];
        const phones = uniqueValues(cts.map((c) => c.task.customerPhone));
        const emails = uniqueValues(cts.map((c) => c.task.customerEmail));
        const addresses = uniqueValues(cts.map((c) => c.task.customerAddress));
        const company = cts.map((c) => c.task.company).find(Boolean) || "";
        const last = cts
          .map((c) => new Date(c.task.endTime || c.task.startTime || 0).getTime())
          .reduce((a, b) => Math.max(a, b), 0);
        const projectCount = cts.filter((c) => c.task.project || c.task.startTime).length;
        rows.push({
          name, tasks: cts, phones, emails, addresses, company,
          projectCount, last, taskId: cts[0].taskId,
          incomplete: !phones.length || !addresses.length,
          search: [name, emails.join(" "), phones.join(" "), company].join(" ").toLowerCase(),
        });
      }
      return rows;
    }

    // People = each task's contacts[] {name, role, phone, email}, deduped by normalized name
    // (a nameless entry folds into the person with the same phone digits). Same tasks read, no extra fetch.
    const normName = (n) => String(n || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
    const digits = (p) => String(p || "").replace(/\D/g, "");
    const telHref = (p) => { const v = String(p || "").trim(); return "tel:" + (v.startsWith("+") ? "+" : "") + digits(v); };
    function aggregatePeople(tasks) {
      const map = new Map();
      const byPhone = new Map();
      const loose = [];
      for (const taskId in tasks) {
        const task = tasks[taskId] || {};
        const c = task.contacts;
        const list = Array.isArray(c) ? c : (c && typeof c === "object" ? Object.values(c) : []);
        list.forEach((x) => {
          if (!x || typeof x !== "object") return;
          const name = String(x.name || "").trim();
          const entry = { name, role: String(x.role || "").trim(), phone: String(x.phone || "").trim(), email: String(x.email || "").trim(), taskId, task };
          if (!normName(name)) { if (digits(entry.phone) || entry.email) loose.push(entry); return; }
          const k = normName(name);
          if (!map.has(k)) map.set(k, []);
          map.get(k).push(entry);
          if (digits(entry.phone)) byPhone.set(digits(entry.phone), k);
        });
      }
      loose.forEach((e) => {
        const k = byPhone.get(digits(e.phone)) || ("#" + (digits(e.phone) || e.email.toLowerCase()));
        if (!map.has(k)) map.set(k, []);
        map.get(k).push(e);
      });
      const rows = [];
      map.forEach((entries) => {
        const name = (entries.find((e) => e.name) || {}).name || entries[0].phone || entries[0].email;
        const roles = uniqueValues(entries.map((e) => e.role));
        const phones = uniqueValues(entries.map((e) => e.phone));
        const emails = uniqueValues(entries.map((e) => e.email));
        const jobs = [];
        const seen = new Set();
        entries.forEach((e) => { if (!seen.has(e.taskId)) { seen.add(e.taskId); jobs.push({ taskId: e.taskId, task: e.task }); } });
        jobs.sort((a, b) => (Date.parse(b.task.startTime) || 0) - (Date.parse(a.task.startTime) || 0));
        const jobNames = uniqueValues(jobs.map((j) => j.task.customerName));
        rows.push({
          name, roles, phones, emails, jobs, jobNames,
          search: [name, roles.join(" "), phones.join(" "), emails.join(" "), jobNames.join(" ")].join(" ").toLowerCase(),
        });
      });
      return rows;
    }

    function pSortVal(r) {
      switch (pSortField) {
        case "role": return (r.roles[0] || "~").toLowerCase();
        case "phone": return r.phones[0] || "~";
        case "email": return (r.emails[0] || "~").toLowerCase();
        case "jobs": return -r.jobs.length;
        default: return r.name.toLowerCase();
      }
    }

    function renderPeople() {
      const q = String(searchContacts.value || "").trim().toLowerCase();
      const rows = allPeople.filter((r) => !q || r.search.includes(q));
      rows.sort((a, b) => { const av = pSortVal(a), bv = pSortVal(b); return av < bv ? -pSortDir : av > bv ? pSortDir : 0; });
      peopleBody.innerHTML = "";
      const frag = document.createDocumentFragment();
      rows.forEach((r) => {
        const tr = document.createElement("tr");
        tr.className = "row";
        const nameTd = document.createElement("td");
        nameTd.className = "name";
        nameTd.textContent = r.name;
        tr.appendChild(nameTd);
        tr.appendChild(cell(r.roles.join(", "), !r.roles.length));
        const phTd = document.createElement("td");
        if (r.phones.length) {
          r.phones.forEach((ph, i) => {
            if (i) phTd.appendChild(document.createTextNode(", "));
            const a = document.createElement("a"); a.href = telHref(ph); a.textContent = ph;
            a.addEventListener("click", (e) => e.stopPropagation());
            phTd.appendChild(a);
          });
        } else phTd.innerHTML = '<span class="missing">—</span>';
        tr.appendChild(phTd);
        const emTd = document.createElement("td");
        if (r.emails.length) {
          r.emails.forEach((em, i) => {
            if (i) emTd.appendChild(document.createTextNode(", "));
            const a = document.createElement("a"); a.href = "mailto:" + encodeURIComponent(em).replace(/%40/g, "@"); a.textContent = em;
            a.addEventListener("click", (e) => e.stopPropagation());
            emTd.appendChild(a);
          });
        } else emTd.innerHTML = '<span class="missing">—</span>';
        tr.appendChild(emTd);
        const jTd = document.createElement("td");
        jTd.className = "jobs trunc";
        const jt = `${r.jobs.length} job${r.jobs.length === 1 ? "" : "s"}` + (r.jobNames.length ? ` · ${r.jobNames.join(", ")}` : "");
        jTd.textContent = jt;
        jTd.title = jt;
        tr.appendChild(jTd);
        tr.onclick = () => openPerson(r);
        frag.appendChild(tr);
      });
      peopleBody.appendChild(frag);
      countEl.textContent = `${rows.length} of ${allPeople.length} people`;
      document.querySelectorAll("th[data-psort] .arrow").forEach((a) => (a.textContent = ""));
      const active = document.querySelector(`th[data-psort="${pSortField}"] .arrow`);
      if (active) active.textContent = pSortDir > 0 ? "▲" : "▼";
    }

    function openPerson(r) {
      document.getElementById("person-name").textContent = r.name;
      renderChips(document.getElementById("person-role-list"), r.roles);
      renderChips(document.getElementById("person-phone-list"), r.phones);
      renderChips(document.getElementById("person-email-list"), r.emails);
      const box = document.getElementById("person-jobs");
      box.innerHTML = "";
      r.jobs.forEach(({ taskId, task }) => {
        const card = document.createElement("div");
        card.className = "project-card";
        const h4 = document.createElement("h4");
        const a = document.createElement("a");
        a.href = `onlinejob.html?task=${encodeURIComponent(taskId)}`;
        a.textContent = [task.customerName, task.project].filter(Boolean).join(" - ") || "Untitled job";
        h4.appendChild(a);
        card.appendChild(h4);
        const info = document.createElement("div");
        info.className = "contact-subtle";
        info.textContent = task.startTime ? new Date(task.startTime).toLocaleString() : "No start time";
        card.appendChild(info);
        box.appendChild(card);
      });
      personModal.classList.add("open");
    }

    function setView(v) {
      view = v;
      document.getElementById("view-customers").classList.toggle("on", v === "customers");
      document.getElementById("view-people").classList.toggle("on", v === "people");
      document.getElementById("customers-wrap").hidden = v !== "customers";
      document.getElementById("people-wrap").hidden = v !== "people";
      document.getElementById("incompleteWrap").style.display = v === "people" ? "none" : "";
      document.getElementById("open-add").style.display = v === "people" ? "none" : "";
      try { localStorage.setItem("contacts-view", v); } catch (e) { }
      renderTable();
    }

    function sortVal(r) {
      switch (sortField) {
        case "phone": return r.phones[0] || "~";
        case "email": return (r.emails[0] || "~").toLowerCase();
        case "address": return (r.addresses[0] || "~").toLowerCase();
        case "company": return (r.company || "~").toLowerCase();
        default: return r.name.toLowerCase();
      }
    }

    function currentView() {
      let rows = allRows.slice();
      const q = String(searchContacts.value || "").trim();
      if (q) {
        if (contactSearchHelper) {
          const items = rows.map((r) => ({
            row: r, name: r.name, email: r.emails[0] || "",
            phone: r.phones[0] || "", company: r.company || "",
          }));
          rows = contactSearchHelper.filter(items, q).map((x) => x.row);
        } else {
          const ql = q.toLowerCase();
          rows = rows.filter((r) => r.search.includes(ql));
        }
      }
      if (incompleteOnly.checked) rows = rows.filter((r) => r.incomplete);
      rows.sort((a, b) => {
        const av = sortVal(a), bv = sortVal(b);
        return av < bv ? -sortDir : av > bv ? sortDir : 0;
      });
      return rows;
    }

    function cell(text, missing) {
      const td = document.createElement("td");
      if (missing) { td.innerHTML = '<span class="missing">—</span>'; return td; }
      td.className = "trunc";
      td.textContent = text;
      td.title = text;
      return td;
    }

    function renderTable() {
      if (view === "people") { renderPeople(); return; }
      const rows = currentView();
      body.innerHTML = "";
      const frag = document.createDocumentFragment();
      rows.forEach((r) => {
        const tr = document.createElement("tr");
        tr.className = "row" + (r.incomplete ? " incomplete" : "");
        const nameTd = document.createElement("td");
        nameTd.className = "name";
        nameTd.textContent = r.name;
        tr.appendChild(nameTd);
        tr.appendChild(cell(r.phones[0], !r.phones.length));
        tr.appendChild(cell(r.emails[0], !r.emails.length));
        tr.appendChild(cell(r.addresses[0], !r.addresses.length));
        tr.appendChild(cell(r.company, !r.company));
        tr.onclick = () => openContact(r);
        frag.appendChild(tr);
      });
      body.appendChild(frag);
      countEl.textContent = `${rows.length} of ${allRows.length} contacts`;
      document.querySelectorAll("th[data-sort] .arrow").forEach((a) => (a.textContent = ""));
      const active = document.querySelector(`th[data-sort="${sortField}"] .arrow`);
      if (active) active.textContent = sortDir > 0 ? "▲" : "▼";
    }

    const renderChips = (el, values) => {
      el.innerHTML = "";
      if (!values.length) {
        const empty = document.createElement("span");
        empty.className = "contact-subtle";
        empty.textContent = "—";
        el.appendChild(empty);
        return;
      }
      values.forEach((val) => {
        const chip = document.createElement("span");
        chip.className = "field-chip";
        chip.textContent = val;
        el.appendChild(chip);
      });
    };

    function openContact(r) {
      selectedContactId = r.taskId;
      selectedName = r.name;
      contactNameElem.textContent = r.name;
      contactPhoneInput.value = r.phones[0] || "";
      contactEmailInput.value = r.emails[0] || "";
      contactAddressInput.value = r.addresses[0] || "";
      contactPhoneInput.placeholder = r.phones.length > 1 ? "Multiple values" : "Phone";
      contactEmailInput.placeholder = r.emails.length > 1 ? "Multiple values" : "Email";
      contactAddressInput.placeholder = r.addresses.length > 1 ? "Multiple values" : "Address";
      renderChips(document.getElementById("contact-phone-list"), r.phones);
      renderChips(document.getElementById("contact-email-list"), r.emails);
      renderChips(document.getElementById("contact-address-list"), r.addresses);

      const meta = [];
      if (r.company) meta.push(r.company);
      const msg = r.tasks.map((c) => c.task.msgCount).find(Boolean);
      const lc = r.tasks.map((c) => c.task.lastContact).find(Boolean);
      if (msg) meta.push(`${msg} emails`);
      if (lc) meta.push(`last contact ${lc}`);
      contactExtra.textContent = meta.join(" · ");

      renderProjects(r.tasks);
      contactModal.classList.add("open");
    }

    function renderProjects(customerTasks) {
      const projectsList = document.getElementById("projects-list");
      projectsList.innerHTML = "";
      const real = customerTasks.filter(({ task }) => task.project || task.startTime);
      if (!real.length) {
        projectsList.innerHTML = '<div class="contact-subtle">No linked jobs or projects.</div>';
        return;
      }
      real.forEach(({ task }) => {
        const projectDiv = document.createElement("div");
        projectDiv.className = "project-card";
        const h4 = document.createElement("h4");
        h4.textContent = task.project || "Untitled Project";
        projectDiv.appendChild(h4);
        const start = task.startTime ? new Date(task.startTime).toLocaleString() : "N/A";
        const end = task.endTime ? new Date(task.endTime).toLocaleString() : "N/A";
        const info = document.createElement("div");
        info.className = "contact-subtle";
        info.textContent = `Start: ${start} · End: ${end}`;
        projectDiv.appendChild(info);
        if (task.notes) {
          const notesDiv = document.createElement("div");
          notesDiv.textContent = task.notes;
          projectDiv.appendChild(notesDiv);
        }
        projectsList.appendChild(projectDiv);
      });
    }

    // sorting
    document.querySelectorAll("th[data-sort]").forEach((th) => {
      th.addEventListener("click", () => {
        const f = th.dataset.sort;
        if (sortField === f) sortDir = -sortDir;
        else { sortField = f; sortDir = 1; }
        renderTable();
      });
    });

    document.querySelectorAll("th[data-psort]").forEach((th) => {
      th.addEventListener("click", () => {
        const f = th.dataset.psort;
        if (pSortField === f) pSortDir = -pSortDir;
        else { pSortField = f; pSortDir = 1; }
        renderPeople();
      });
    });
    document.getElementById("view-customers").addEventListener("click", () => setView("customers"));
    document.getElementById("view-people").addEventListener("click", () => setView("people"));
    try { if (localStorage.getItem("contacts-view") === "people") setView("people"); } catch (e) { }

    searchContacts.addEventListener("input", renderTable);
    incompleteOnly.addEventListener("change", renderTable);

    // modal close handlers
    document.querySelectorAll("[data-close]").forEach((b) =>
      b.addEventListener("click", () => {
        contactModal.classList.remove("open");
        addModal.classList.remove("open");
        personModal.classList.remove("open");
      })
    );
    [contactModal, addModal, personModal].forEach((m) =>
      m.addEventListener("click", (e) => { if (e.target === m) m.classList.remove("open"); })
    );
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { contactModal.classList.remove("open"); addModal.classList.remove("open"); personModal.classList.remove("open"); }
    });

    document.getElementById("open-add").addEventListener("click", () => {
      newContactNameInput.value = "";
      newContactPhoneInput.value = "";
      newContactEmailInput.value = "";
      newContactAddressInput.value = "";
      addModal.classList.add("open");
    });

    document.getElementById("save-contact-button").addEventListener("click", async () => {
      if (!selectedName) return;
      if (!canWrite()) return;
      const phone = contactPhoneInput.value;
      const email = contactEmailInput.value;
      const address = contactAddressInput.value;
      const targetName = selectedName;
      const tasksRef = ref(database, `${DATABASE_BASE_PATH}/tasks`);
      const snapshot = await get(tasksRef);
      if (!snapshot.exists()) return;
      const tasks = snapshot.val();
      const updates = {};
      for (const taskId in tasks) {
        if (tasks[taskId].customerName === targetName) {
          updates[`${taskId}/customerPhone`] = phone;
          updates[`${taskId}/customerEmail`] = email;
          updates[`${taskId}/customerAddress`] = address;
        }
      }
      try {
        await update(tasksRef, updates);
        contactModal.classList.remove("open");
        fetchContacts();
      } catch (error) {
        console.error("Error updating contact:", error);
        alert("Error updating contacts.");
      }
    });

    document.getElementById("delete-contact-button").addEventListener("click", () => {
      if (!selectedContactId) return;
      if (!canWrite()) return;
      const contactRef = ref(database, `${DATABASE_BASE_PATH}/tasks/${selectedContactId}`);
      // tasks are a shared record - guard against nuking job/invoice/ledger data
      get(contactRef).then((snap) => {
        const t = snap.exists() ? snap.val() : {};
        if ((t.startTime || t.invoiceSaved || t.paymentTxId) &&
          !confirm("This record also holds job or invoice data. Deleting removes ALL of it. Delete anyway?")) return;
        remove(contactRef).then(() => {
          contactModal.classList.remove("open");
          fetchContacts();
        }).catch((error) => console.error("Error deleting contact:", error));
      });
    });

    document.getElementById("add-contact-button").addEventListener("click", () => {
      const contactName = newContactNameInput.value.trim();
      if (!contactName) return;
      if (!canWrite()) return;
      const tasksRef = ref(database, `${DATABASE_BASE_PATH}/tasks`);
      const newContactRef = push(tasksRef);
      set(newContactRef, {
        customerName: contactName,
        customerPhone: newContactPhoneInput.value,
        customerEmail: newContactEmailInput.value,
        customerAddress: newContactAddressInput.value,
      }).then(() => {
        addModal.classList.remove("open");
        fetchContacts();
      }).catch((error) => {
        console.error("Error adding contact:", error);
        alert("Failed to add contact.");
      });
    });
  </script>
    <script src="../assets/js/reveal.js?v=4" defer></script>
