<!doctype html>
<html lang="en">

<head>
  <script>(function(){try{if(localStorage.getItem("ss-theme")==="light")document.documentElement.classList.add("light")}catch(e){}})();</script>  <!-- saved light/dark before first paint (2026-10-01) -->
  <title>Live Notes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="../assets/css/online.css">
  <script type="module" src="../assets/js/auth.js" defer></script>
  <script src="../assets/js/links-aside.js" defer></script>
  <style>
    #note-list li:hover {
      cursor: pointer;
      background: var(--hover);
    }
    /* Stable editor: comfortable height, user-draggable, and it SCROLLS instead of growing endlessly as you type. */
    #note {
      width: 100%;
      box-sizing: border-box;
      min-height: 220px;
      max-height: 55vh;
      resize: vertical;
      overflow: auto;
    }
    #note.tall { min-height: 75vh; max-height: 85vh; }
  </style>
</head>

<body>
  <header>
    <div class="logo-box"><a href="../../index.html" title="Home"><img src="../../assets/img/android-chrome-192x192.png" alt="Home" style="height:40px;vertical-align:middle;"></a></div>
    <h1>Online Notes</h1>
    <div class="auth-bar"><span id="auth-label">Not signed in</span><button id="auth-btn">Sign In</button></div>
    <button id="theme-toggle" title="Toggle theme">☀️</button>
    <script>(function () { var b = document.getElementById("theme-toggle"), h = document.documentElement; b.textContent = h.classList.contains("light") ? "🌙" : "☀️"; b.addEventListener("click", function () { var n = h.classList.contains("light") ? "dark" : "light"; h.classList.toggle("light", n === "light"); localStorage.setItem("ss-theme", n); b.textContent = n === "light" ? "🌙" : "☀️"; }); })();</script>
    <div id="login-inline">
      <h3>Sign In</h3><input type="email" id="email-in" placeholder="Email" /><input type="password" id="pass-in"
        placeholder="Password" /><button id="do-login">Sign In</button>
      <p id="auth-err"></p>
    </div>
  </header>

  <main>
    <section id="main-window">
      <form class="notes">
        <label for="input-name">Name</label>
        <input required type="text" id="input-name" name="input-name" placeholder="Name">
        <label for="notes">Notes</label>
        <textarea name="notes" id="note" cols="30" rows="10"></textarea>
      </form>
      <!-- WORDS, NOT JUST EMOJIS (L, 2026-09-26) -->
      <button id="copy-btn" title="Copy the note text">📰 Copy</button>
      <button id="paste-btn" title="Paste into the note">📋 Paste</button>
      <button id="save-btn" title="Save this note">💾 Save</button>
      <!-- PRIVATE / PUBLIC (L, 2026-09-26: "the notes app should work like the journals with saving - public and private, depending
           on who's logged in; I can switch a note if public. Share is just to other users via the share node"). -->
      <button id="scope-btn" type="button" title="Where this note is saved. On a saved note, tapping it MOVES the note.">Private</button>
      <button class="clear-button" id="delete-btn" title="Delete this note">❌ Delete</button>
      <button id="undo-btn" title="Undo the last change">↩️ Undo</button>
      <button id="share-btn" title="Share this note with the other users (tap again to unshare)">📤 Share</button>
      <label id="enc-lbl" title="Type your note, then type a secret word — a moment after you stop typing, the note auto-encrypts (AES-256) in place. Type the word again to open it. Empty word = plain note. Only the encrypted text is stored.">🔑 Lock word <input type="password" id="note-key" placeholder="secret word (auto-locks)" style="width:auto" autocomplete="off"></label>
      <span id="enc-status" style="font-size:.85em;opacity:.75;margin-left:6px"></span>
      <label for="autosave-checkbox" title="Off by default. When on, saves every 40s. Either way, closing the tab with unsaved changes will prompt you.">Auto-save:</label>
      <input type="checkbox" id="autosave-checkbox">
      <!-- SHARE (L, 2026-09-26: same format as the origin + a flag): 📤 puts the SAVED note as stored at share/notes/<name>
           with sharedBy/sharedByName (an encrypted note stays encrypted); tap again to unshare. -->
      <small id="share-status" style="display:block;margin:4px 0"></small>
      <section id="note-list"></section>
      <button id="resizeTextareaBtn">Expand</button>
      <button class="clear-button" id="clear-btn">Clear</button>
    </section>
  </main>

  <script type="module">
    import { auth, onAuthStateChanged, database, ref, onValue, set, get, push, remove } from '../assets/js/firebase-init.js';

    const nameInput = document.getElementById('input-name');
    const notesTextarea = document.getElementById('note');
    const noteList = document.getElementById('note-list');
    let deletedNotes = [];
    let autoSaveInterval;
    let DATABASE_BASE_PATH = 'public';
    let curScope = 'public';   // 'private' ({uid}/notes) | 'public' (public/notes) - the loaded note's home, or where a new note goes
    const signedIn = () => DATABASE_BASE_PATH !== 'public';
    const notesRoot = scope => (scope === 'private' && signedIn()) ? DATABASE_BASE_PATH : 'public';
    function paintScope() {
      const b = document.getElementById('scope-btn'); if (!b) return;
      if (!signedIn()) { curScope = 'public'; b.textContent = '🌐 Public'; b.disabled = true; b.title = 'Signed out: notes are public. Sign in for private notes.'; return; }
      b.disabled = false;
      b.textContent = curScope === 'public' ? '🌐 Public' : 'Private';   // no padlock icon (L 2026-10-04)
    }
    let unsub = null;
    let dirty = false;         // unsaved edits present? -> prompt on tab close (autosave is OFF by default)

    // ---- Password encryption for a note's body (AES-256-GCM, PBKDF2 key). ----
    // Stored blob: "AGCM1.<saltB64>.<ivB64>.<cipherB64>". Only the body is encrypted;
    // the note NAME stays plaintext (it is the Firebase key + list label).
    const keyInput = document.getElementById('note-key');
    let clearText = '';        // the note's plaintext - held for the whole session once known; null only for a saved note not yet opened
    let lockedBlob = null;     // the stored cipher blob (AGCM1. AES, or legacy SXOR1.); null for a plain, never-encrypted note
    let revealed = true;       // is the window showing plaintext (editable) vs the encrypted cipher block (read-only)?
    let lastWord = '';         // the word this note is encrypted under this session (memory only, never stored) - lets edits re-save encrypted
    let wordTimer = null;      // debounce so the live convert waits until you stop typing the word
    const WORD_DELAY = 1600;   // ms after the last key keystroke before the note auto-converts
    const ENC_PREFIX = 'AGCM1.';   // AES-256-GCM notes - the real engine, shared with testbed/encryption.html
    const SX_PREFIX = 'SXOR1.';    // legacy light cipher from an interim build - READ-ONLY: revealed notes re-save as AES
    const SX_MAGIC = 'SXOK';
    const isEncrypted = s => typeof s === 'string' && (s.startsWith(ENC_PREFIX) || s.startsWith(SX_PREFIX));
    const setStatus = t => { const e = document.getElementById('enc-status'); if (e) e.textContent = t; };
    // Legacy SXOR1 read-back ONLY (so notes saved by the interim build still open); new notes are always AES.
    function _sxSeed(s){ let h = 2166136261 >>> 0; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
    function _sxStream(seed, n){ let x = (seed || 0x9e3779b9) >>> 0; const o = new Uint8Array(n); for (let i=0;i<n;i++){ x ^= x<<13; x ^= x>>>17; x ^= x<<5; x >>>= 0; o[i] = x & 0xff; } return o; }
    function sxDecode(blob, pw){ try { const r = Uint8Array.from(atob(blob.slice(SX_PREFIX.length)), c=>c.charCodeAt(0)); const k = _sxStream(_sxSeed(pw), r.length); const o = new Uint8Array(r.length); for (let i=0;i<r.length;i++) o[i] = r[i]^k[i]; const t = new TextDecoder('utf-8', {fatal:false}).decode(o); return t.startsWith(SX_MAGIC) ? {ok:true, plain:t.slice(SX_MAGIC.length)} : {ok:false}; } catch(_){ return {ok:false}; } }
    // Display reflects `revealed`: true -> plaintext, editable; false -> the clean cipher block, read-only.
    const _cipherView = b => (b || '').replace(ENC_PREFIX, '').replace(SX_PREFIX, '');
    function renderNote(){
      if (revealed) {
        notesTextarea.value = clearText || '';
        notesTextarea.readOnly = false;
        setStatus(lockedBlob ? 'open - type the word to lock' : '');
      } else {
        notesTextarea.value = lockedBlob ? _cipherView(lockedBlob) : (clearText || '');
        notesTextarea.readOnly = !!lockedBlob;
        setStatus(lockedBlob ? 'encrypted - type the word to open' : '');
      }
    }
    // LIVE CONVERT (no buttons): a short pause after you type the key word flips the note. Typing the word toggles locked/open.
    function scheduleWord(){
      if (wordTimer) clearTimeout(wordTimer);
      if (keyInput.value.trim()) setStatus('... converting');
      wordTimer = setTimeout(wordSettled, WORD_DELAY);
    }
    async function wordSettled(){
      wordTimer = null;
      const pw = keyInput.value.trim();
      if (!revealed) {                                       // LOCKED -> the word opens it
        if (!pw) { renderNote(); return; }
        let plain = null;
        try {
          if (lockedBlob.startsWith(SX_PREFIX)) { const r = sxDecode(lockedBlob, pw); if (r.ok) plain = r.plain; }
          else plain = await decryptText(lockedBlob, pw);
        } catch (_){}
        if (plain != null) { clearText = plain; lastWord = pw; revealed = true; keyInput.value = ''; renderNote(); }
        else if (clearText != null) { revealed = true; keyInput.value = ''; renderNote(); }   // in-session: we still hold it
        else { notesTextarea.value = await garbageView(lockedBlob, pw); notesTextarea.readOnly = true; setStatus('wrong word - this is the note under that word'); }   // GARBAGE VIEW (L 2026-10-03, see garbageView)
      } else {                                               // OPEN -> the word locks it (encrypt)
        if (!pw || !(clearText && clearText.trim())) { renderNote(); return; }
        try { lockedBlob = await encryptText(clearText, pw); lastWord = pw; }
        catch { setStatus('encryption failed'); return; }
        revealed = false; keyInput.value = ''; renderNote();
      }
    }
    const _b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
    const _unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    async function _deriveKey(password, salt) {
      const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 210000, hash: 'SHA-256' },
        km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    }
    async function encryptText(plaintext, password) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await _deriveKey(password, salt);
      const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(plaintext));
      return ENC_PREFIX + _b64(salt) + '.' + _b64(iv) + '.' + _b64(ct);
    }
    async function decryptText(blob, password) {
      const [, saltB, ivB, ctB] = blob.split('.');
      const key = await _deriveKey(password, _unb64(saltB));
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: _unb64(ivB) }, key, _unb64(ctB));
      return new TextDecoder().decode(pt);
    }
    // GARBAGE VIEW (L 2026-10-03: "if we removed the GCM it would show garbage until the right word is in - I want to see how
    // that would look"): GCM REFUSES a wrong word (the tag check fails), so the note never shows anything but the cipher
    // block. A cipher without that tag (AES-CTR) would hand back random bytes under a wrong word. This shows exactly those
    // bytes - the ciphertext run through AES-CTR with the key the wrong word makes - WITHOUT dropping GCM: the real note
    // still only opens under the right word, and a tampered blob is still refused. Same bytes, same look, no loss of safety.
    async function garbageView(blob, password) {
      try {
        const [, saltB, ivB, ctB] = blob.split('.'), salt = _unb64(saltB), ct = _unb64(ctB);
        const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 210000, hash: 'SHA-256' }, km, { name: 'AES-CTR', length: 256 }, false, ['decrypt']);
        const counter = new Uint8Array(16); counter.set(_unb64(ivB).slice(0, 12));
        const bytes = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-CTR', counter, length: 32 }, key, ct.slice(0, ct.length - 16)));   // the last 16 bytes are GCM's tag, not text
        return new TextDecoder('utf-8', { fatal: false }).decode(bytes);
      } catch (_) { return _cipherView(blob); }
    }
    window.__notesCrypto = { encryptText, decryptText, garbageView };   // test hook (nothing saved by it)

    // Shared read-view: onlinenotes.html?s=<id> loads a note someone shared (public/sharedNotes).
    async function loadSharedView() {
      const id = new URLSearchParams(location.search).get('s');
      if (!id) return;
      try {
        const snap = await get(ref(database, `public/sharedNotes/${id}`));
        const n = snap.val();
        document.getElementById('share-status').textContent = n ? '🔗 Shared note - type the word in 🔑 Lock word to open it.' : 'That shared note was not found - it may have been unshared.';
        for (const b of ['save-btn', 'share-btn', 'delete-btn', 'autosave-checkbox']) { const e = document.getElementById(b); if (e) e.style.display = 'none'; }
        const al = document.querySelector('label[for="autosave-checkbox"]'); if (al) al.style.display = 'none';
        if (!n) return;
        nameInput.value = n.name || '(shared note)';
        lastWord = ''; dirty = false;
        if (isEncrypted(n.note)) { lockedBlob = n.note; clearText = null; revealed = false; renderNote(); }
        else { lockedBlob = null; clearText = n.note || ''; revealed = true; renderNote(); }
      } catch (e) { console.error('shared view failed:', e); }
    }

    onAuthStateChanged(auth, (user) => {
      DATABASE_BASE_PATH = user ? `${user.uid}` : 'public';
      curScope = user ? 'private' : 'public'; paintScope();
      populateNoteList();
    });

    const setupEventListeners = () => {
      document.getElementById('copy-btn').addEventListener('click', copyNote);
      document.getElementById('paste-btn').addEventListener('click', pasteNote);
      document.getElementById('save-btn').addEventListener('click', () => saveNote());
      document.getElementById('delete-btn').addEventListener('click', () => deleteNote());
      document.getElementById('clear-btn').addEventListener('click', clearNoteInputs);
      document.getElementById('undo-btn').addEventListener('click', undoDelete);
      // LIVE, no buttons: typing the 🔑 word auto-converts after a short pause (scheduleWord -> wordSettled).
      // Typing the word toggles the note between open (editable) and encrypted. Enter applies immediately.
      keyInput.addEventListener('input', scheduleWord);
      keyInput.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        if (wordTimer) clearTimeout(wordTimer);
        wordSettled();
      });
      document.getElementById('autosave-checkbox').addEventListener('change', toggleAutoSave);
      document.addEventListener("keydown", handleKeyboardShortcuts);
      notesTextarea.addEventListener('input', () => {
        if (notesTextarea.readOnly) return;                            // hidden cipher view isn't editable
        clearText = notesTextarea.value;                               // edits captured; re-encrypted (AES) on auto-convert or 💾 Save
        dirty = true;                                                  // unsaved change -> prompt on tab close
      });
      nameInput.addEventListener('input', () => { dirty = true; });
      // Ask before losing unsaved work when the tab/window closes (autosave is off by default).
      window.addEventListener('beforeunload', (e) => {
        if (dirty) { e.preventDefault(); e.returnValue = ''; }
      });
    };

    const copyNote = () => {
      notesTextarea.select();
      document.execCommand('copy');
      console.log('Copied to clipboard');
    };

    const pasteNote = async () => {
      try {
        const clipboardData = await navigator.clipboard.readText();
        notesTextarea.value += clipboardData;
      } catch (err) {
        console.error('Failed to paste from clipboard:', err);
        alert('Failed to paste from clipboard.');
      }
    };

    // SHARE SYNC (2026-10-01, L: "make it sync"): saving a note I have shared also refreshes my share/notes copy, so the
    // others see the new version live. One-way (me -> them): only when the share entry is mine (rules enforce it too);
    // a same-named note someone else shares is never touched. Encrypted stays encrypted (rec.note is the cipher).
    const syncShare = async (name, rec) => {
      if (DATABASE_BASE_PATH === 'public') return;
      try {
        const sref = ref(database, `share/notes/${name}`);
        const cur = (await get(sref)).val();
        if (!cur || cur.sharedBy !== DATABASE_BASE_PATH) return;
        await set(sref, { ...rec, sharedBy: cur.sharedBy, sharedByName: cur.sharedByName || '', sharedAt: cur.sharedAt || Date.now(), sharedUpdatedAt: Date.now() });
        const st = document.getElementById('share-status'); if (st) st.textContent = `Shared copy of "${name}" updated.`;
      } catch (e) { console.warn('share sync failed:', e); }
    };

    const saveNote = async (silent = false) => {
      const nameToSave = nameInput.value.trim();
      const saveBtn = document.getElementById('save-btn');
      const timestamp = new Date().toISOString();

      // The plaintext lives in clearText; store the CIPHER whenever the note has a word (never the plaintext).
      // The word box is blank at rest, so re-encrypt from lastWord (the word this note is locked under this session).
      const hasContent = (clearText != null && clearText.trim()) || (lockedBlob != null);
      if (!nameToSave || !hasContent) {
        if (!silent) console.log('Please enter both the name and note before saving');
        return;
      }
      let noteToSave, encFlag = false;
      if (clearText != null) {                                                            // we hold the plaintext (open/authoring or in-session locked)
        if (lastWord) { noteToSave = await encryptText(clearText, lastWord); encFlag = true; }  // encrypted note -> re-encrypt the latest text
        else { noteToSave = clearText; encFlag = false; }                                  // never given a word -> plain note
      } else {                                                                            // a saved encrypted note not opened this session -> store its cipher as-is
        noteToSave = lockedBlob; encFlag = true;
      }

      try {
        const notesRef = ref(database, `${notesRoot(curScope)}/notes/${nameToSave}`);
        const snapshot = await get(notesRef);
        const existingNote = snapshot.val();
        const rec = { name: nameToSave, note: noteToSave, timestamp, enc: encFlag };

        if (!existingNote || new Date(timestamp) > new Date(existingNote.timestamp)) {
          await set(notesRef, rec);
          await syncShare(nameToSave, rec);
          console.log('Note saved successfully');
          updateSaveButton(saveBtn);
        } else {
          const userChoice = confirm(
            `⚠️ A newer version of "${nameToSave}" already exists.\nDo you want to overwrite it with your current changes?`
          );
          if (userChoice) {
            await set(notesRef, rec);
          await syncShare(nameToSave, rec);
            console.log('Note overwritten by user choice');
            updateSaveButton(saveBtn);
          } else {
            console.log('Save cancelled. Newer note preserved.');
          }
        }
      } catch (err) {
        console.error('Failed to save note:', err);
        if (!silent) alert('Failed to save the note. Please try again.');
      }
    };

    const updateSaveButton = (button) => {
      dirty = false;                    // a successful save clears the unsaved-changes flag
      button.textContent = 'Saved';
      button.style.backgroundColor = 'lightblue';
      setTimeout(() => {
        button.textContent = '💾 Save';
        button.style.backgroundColor = '';
      }, 2000);
    };

    // --- Share (2026-09-26): the saved note as stored at share/notes/<name> + sharedBy; tap again to unshare ---
    let mineShared = {};
    async function toggleShareNote() {
      const st = document.getElementById('share-status');
      if (DATABASE_BASE_PATH === 'public') { alert('Sign in to share a note.'); return; }
      const name = nameInput.value.trim();
      if (!name) { alert('Open or save a note first.'); return; }
      const path = `share/notes/${name}`;
      try {
        const cur = (await get(ref(database, path))).val();
        if (cur && cur.sharedBy === DATABASE_BASE_PATH) {
          if (!confirm(`Unshare "${name}"?`)) return;
          await remove(ref(database, path)); st.textContent = `"${name}" unshared.`; return;
        }
        if (cur) { st.textContent = `Someone else already shares a note called "${name}" - rename yours to share it.`; return; }
        const saved = (await get(ref(database, `${notesRoot(curScope)}/notes/${name}`))).val();
        if (!saved) { alert('Save the note first - sharing sends the saved copy.'); return; }
        let me = '';
        try { me = (await get(ref(database, `share/directory/${DATABASE_BASE_PATH}/name`))).val() || ''; } catch (e) { }
        await set(ref(database, path), { ...saved, sharedBy: DATABASE_BASE_PATH, sharedByName: me || (auth.currentUser && auth.currentUser.email) || '', sharedAt: Date.now() });
        st.textContent = `"${name}" shared with the other users${saved.enc || isEncrypted(saved.note) ? ' (it is locked - send the word separately)' : ''}. Tap 📤 Share again to unshare.`;
      } catch (e) { st.textContent = 'Not saved: ' + (e.code || e.message || e); }
    }
    document.getElementById('share-btn').addEventListener('click', toggleShareNote);
    document.getElementById('scope-btn').addEventListener('click', async () => {
      if (!signedIn()) return;
      const to = curScope === 'public' ? 'private' : 'public', name = nameInput.value.trim(), st = document.getElementById('share-status');
      const here = name ? (await get(ref(database, `${notesRoot(curScope)}/notes/${name}`))).val() : null;
      if (!here) { curScope = to; paintScope(); st.textContent = `New notes will save as ${to === 'public' ? 'Public (anyone can see it in the list)' : 'Private (only you)'}.`; return; }
      if (to === 'public' && !isEncrypted(here.note) && !confirm(`Make "${name}" public? It is not locked, so anyone who opens Notes can read it.`)) return;
      const there = (await get(ref(database, `${notesRoot(to)}/notes/${name}`))).val();
      if (there && !confirm(`A ${to} note called "${name}" already exists. Replace it?`)) return;
      try {
        await set(ref(database, `${notesRoot(to)}/notes/${name}`), { ...here, timestamp: new Date().toISOString() });
        await remove(ref(database, `${notesRoot(curScope)}/notes/${name}`));
        curScope = to; paintScope(); st.textContent = `"${name}" moved to ${to === 'public' ? 'Public' : 'Private'}.`;
      } catch (e) { st.textContent = 'Not moved: ' + (e.code || e.message || e); }
    });

    // Delete (2026-10-01, L: "there's no way I see to delete a note"): the toolbar ❌ only worked on the note loaded in the
    // editor and failed SILENTLY otherwise (console.log). Now: every own note in the list has its own 🗑, and the toolbar
    // button says what's wrong instead of doing nothing.
    const deleteNote = async (nameArg, scopeArg) => {
      const nameToDelete = (typeof nameArg === 'string' ? nameArg : nameInput.value).trim();
      const scope = scopeArg || curScope;
      const loadedHere = nameToDelete === nameInput.value.trim();

      if (!nameToDelete) { alert('Open a note first (tap it in the list), or use the 🗑 next to a note.'); return; }
      {
        const userConfirmed = confirm(`Are you sure you want to delete the note with name: ${nameToDelete}?`);
        if (!userConfirmed) {
          console.log('Note deletion cancelled.');
          return;
        }

        try {
          const notesRef = ref(database, `${notesRoot(scope)}/notes`);
          const snapshot = await get(notesRef);
          const notes = snapshot.val();

          if (notes) {
            const noteId = Object.keys(notes).find(id => notes[id].name === nameToDelete);
            if (noteId) {
              const deletedNote = notes[noteId];
              storeDeletedNote(deletedNote.name, deletedNote.note);
              await set(ref(database, `${notesRoot(scope)}/notes/${noteId}`), null);
              if (loadedHere) clearNoteInputs();
              console.log(`Deleted the note with name: ${nameToDelete}`);
            } else {
              alert(`No saved note named "${nameToDelete}" here - it may be unsaved, or in the other (Private/Public) list.`);
            }
          } else {
            alert('No saved notes here to delete.');
          }
        } catch (err) {
          console.error('Failed to delete note:', err);
          alert('Failed to delete the note. Please try again.');
        }
      }
    };

    const clearNoteInputs = () => {
      nameInput.value = '';
      notesTextarea.value = '';
      notesTextarea.readOnly = false;
      clearText = '';
      lockedBlob = null;
      revealed = true;
      lastWord = '';
      keyInput.value = '';
      if (wordTimer) { clearTimeout(wordTimer); wordTimer = null; }
      setStatus('');
      dirty = false;
    };

    const populateNoteList = () => {
      if (unsub) {
        unsub();
        unsub = null;
      }
      const notesRef = ref(database, `${DATABASE_BASE_PATH}/notes`);
      let own = {}, shared = {}, pub = {};
      const draw = () => {
        noteList.innerHTML = '';
        const mine = signedIn() ? Object.entries(own || {}).map(([k, n]) => ({ ...(mineShared[k] ? { ...n, __mineShared: true } : n), __scope: 'private' })) : [];
        const all = [...mine,
                     ...Object.values(pub || {}).filter(n => n && n.name).map(n => ({ ...n, __scope: 'public' })),
                     ...Object.values(shared || {}).map(n => ({ ...n, sharedByLabel: n.sharedByName || 'someone', __shared: true, __scope: 'shared' }))];
        if (!all.length) { noteList.innerHTML = '<li>No notes found</li>'; return; }
        all.sort((a, b) => new Date(b.timestamp || b.sharedAt) - new Date(a.timestamp || a.sharedAt)).forEach(note => createNoteListItem(note));
      };
      const unOwn = signedIn() ? onValue(notesRef, snapshot => { own = snapshot.val() || {}; draw(); }) : () => {};
      const unPub = onValue(ref(database, 'public/notes'), snapshot => { pub = snapshot.val() || {}; draw(); }, () => { });
      // share/notes: notes people shared (same shape + sharedBy). Other people's show as "shared by X"; opening one
      // loads it, and saving makes it your own note. Mine are tagged "shared" on my own row.
      const unShared = DATABASE_BASE_PATH !== 'public'
        ? onValue(ref(database, 'share/notes'), snap => {
            const all = snap.val() || {}; shared = {}; mineShared = {};
            for (const [k, n] of Object.entries(all)) { if (!n) continue; if (n.sharedBy === DATABASE_BASE_PATH) mineShared[k] = true; else shared[k] = n; }
            draw();
          }, () => { })
        : null;
      unsub = () => { unOwn(); unPub(); if (unShared) unShared(); };
    };

    const createNoteListItem = (note) => {
      const listItem = document.createElement('li');

      const nameSpan = document.createElement('span');
      nameSpan.style.fontWeight = 'bold';
      nameSpan.textContent = note.name;

      const timestampSpan = document.createElement('span');
      timestampSpan.style.fontWeight = 'normal';
      timestampSpan.style.marginLeft = '10px';
      timestampSpan.textContent = ` (${new Date(note.timestamp).toLocaleString()})`;

      listItem.appendChild(nameSpan);
      listItem.appendChild(timestampSpan);
      if (note.__scope === 'private' || note.__scope === 'public') {
        const sc = document.createElement('span');
        sc.textContent = note.__scope === 'public' ? ' · Public' : ' · Private';
        sc.style.cssText = 'font-weight:normal;font-size:0.8em;margin-left:6px;opacity:.75';
        listItem.appendChild(sc);
      }

      if (note.__mineShared) {
        const t = document.createElement('span'); t.textContent = ' · shared'; t.style.cssText = 'font-weight:normal;font-size:0.8em;color:#4a90d9;margin-left:6px'; listItem.appendChild(t);
      }
      if (note.sharedBy) {
        const shareTag = document.createElement('span');
        shareTag.textContent = ' · shared' + (note.sharedByLabel ? ' by ' + note.sharedByLabel : '');
        shareTag.style.cssText = 'font-weight:normal;font-size:0.8em;color:#4a90d9;margin-left:6px';
        listItem.appendChild(shareTag);
      }

      if (isEncrypted(note.note)) {
        const lockTag = document.createElement('span');
        lockTag.textContent = '';   // a locked note carries no icon in the list (L 2026-10-04 "just the icon, not the encrypting")
        lockTag.title = 'Encrypted — set the matching key to read';
        lockTag.style.marginLeft = '6px';
        listItem.appendChild(lockTag);
      }

      // 🗑 on my own notes (private + public). Notes others shared with me are theirs - no delete here.
      if (note.__scope === 'private' || (note.__scope === 'public' && !note.sharedBy)) {
        const del = document.createElement('button');
        del.type = 'button'; del.textContent = '🗑'; del.title = 'Delete this note';
        del.style.cssText = 'float:right;padding:0 8px;margin-left:8px;background:transparent;border:none;cursor:pointer;font-size:1.05em';
        del.addEventListener('click', ev => { ev.stopPropagation(); deleteNote(note.name, note.__scope === 'public' ? 'public' : 'private'); });
        listItem.insertBefore(del, listItem.firstChild);
      }

      listItem.addEventListener('click', () => {
        nameInput.value = note.name;
        curScope = note.__scope === 'public' ? 'public' : (signedIn() ? 'private' : 'public'); paintScope();
        lastWord = '';
        if (isEncrypted(note.note)) {
          lockedBlob = note.note; clearText = null; revealed = false;   // encrypted: shows cipher until the word is typed
        } else {
          lockedBlob = null; clearText = note.note; revealed = true;    // plain: readable; type a word to encrypt it
        }
        keyInput.value = '';                                            // don't carry a previous note's word onto this one
        renderNote();
        dirty = false;                                                  // freshly loaded = no unsaved changes yet
      });

      noteList.appendChild(listItem);
    };

    const storeDeletedNote = (name, note) => {
      deletedNotes.push({ name, note });
    };

    const undoDelete = async () => {
      if (deletedNotes.length > 0) {
        const lastDeletedNote = deletedNotes.pop();
        const { name, note } = lastDeletedNote;

        const notesRef = ref(database, `${DATABASE_BASE_PATH}/notes/${name}`);
        try {
          await set(notesRef, { name, note, timestamp: new Date().toISOString() });
          console.log(`Undone the deletion of the note with name: ${name}`);
          populateNoteList();
        } catch (error) {
          console.error('Failed to undo the deletion:', error);
        }
      } else {
        console.log('No deleted notes to undo');
      }
    };


    const toggleAutoSave = (event) => {
      if (event.target.checked) {
        autoSaveInterval = setInterval(() => saveNote(true), 40000);
      } else {
        clearInterval(autoSaveInterval);
      }
    };

    const handleKeyboardShortcuts = (event) => {
      if (event.ctrlKey && event.key === "s") {
        event.preventDefault();
        document.getElementById("save-btn").click();
      }
    };

    document.addEventListener("DOMContentLoaded", () => {
      setupEventListeners();
      // Autosave is OFF by default (checkbox unchecked). It only runs if the user turns it on.
      // Unsaved changes are caught by the beforeunload prompt instead.
      loadSharedView();
    });

    // Expand/Collapse toggles a taller editing height (the box scrolls; it never grows as you type).
    document.getElementById('resizeTextareaBtn').addEventListener('click', () => {
      const tall = notesTextarea.classList.toggle('tall');
      document.getElementById('resizeTextareaBtn').textContent = tall ? 'Collapse' : 'Expand';
    });
  </script>
    <script src="../assets/js/reveal.js?v=4" defer></script>
</body>
