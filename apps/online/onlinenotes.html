<!doctype html>
<html lang="en">

<head>
  <title>Live Notes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="../assets/css/online.css">
  <script type="module" src="../assets/js/auth.js" defer></script>
  <script src="../assets/js/links-aside.js" defer></script>
  <style>
    #note-list li:hover {
      cursor: pointer;
      background: var(--primaryColor);
    }
  </style>
</head>

<body>
  <header>
    <div class="logo-box"><a href="../../index.html" title="Home"><img src="../../assets/img/android-chrome-192x192.png" alt="Home" style="height:40px;vertical-align:middle;"></a></div>
    <h1>Online Notes</h1>
    <div class="auth-bar"><span id="auth-label">Not signed in</span><button id="auth-btn">Sign In</button></div>
    <button id="theme-toggle" title="Toggle theme">☀️</button>
    <script>(function () { var b = document.getElementById("theme-toggle"), h = document.documentElement; b.textContent = h.classList.contains("light") ? "🌙" : "☀️"; b.addEventListener("click", function () { var n = h.classList.contains("light") ? "dark" : "light"; h.classList.toggle("light", n === "light"); localStorage.setItem("ss-theme", n); b.textContent = n === "light" ? "🌙" : "☀️"; }); })();</script>
    <div id="login-inline">
      <h3>Sign In</h3><input type="email" id="email-in" placeholder="Email" /><input type="password" id="pass-in"
        placeholder="Password" /><button id="do-login">Sign In</button>
      <p id="auth-err"></p>
    </div>
  </header>

  <main>
    <section id="main-window">
      <form class="notes">
        <label for="input-name">Name</label>
        <input required type="text" id="input-name" name="input-name" placeholder="Name">
        <label for="notes">Notes</label>
        <textarea name="notes" id="note" cols="30" rows="10"></textarea>
      </form>
      <button id="copy-btn">📰</button>
      <button id="paste-btn">📋</button>
      <button id="save-btn">💾</button>
      <button class="clear-button" id="delete-btn">❌</button>
      <button id="undo-btn">↩️</button>
      <label id="enc-lbl" title="Type the key to unlock/read this note (press Enter); clear it to lock. With a key set, the note is stored encrypted (AES-256-GCM). No key = plain note.">🔑 <input type="password" id="note-key" placeholder="key — locks / unlocks" style="width:auto" autocomplete="off"></label>
      <label for="autosave-checkbox">Auto-💾:</label>
      <input type="checkbox" id="autosave-checkbox" checked>
      <section id="note-list"></section>
      <button id="resizeTextareaBtn">Expand</button>
      <button class="clear-button" id="clear-btn">Clear</button>
    </section>
  </main>

  <script type="module">
    import { auth, onAuthStateChanged, database, ref, onValue, set, get, push } from '../assets/js/firebase-init.js';

    const nameInput = document.getElementById('input-name');
    const notesTextarea = document.getElementById('note');
    const noteList = document.getElementById('note-list');
    let deletedNotes = [];
    let autoSaveInterval;
    let DATABASE_BASE_PATH = 'public';
    let unsub = null;

    // ---- Password encryption for a note's body (AES-256-GCM, PBKDF2 key). ----
    // Stored blob: "AGCM1.<saltB64>.<ivB64>.<cipherB64>". Only the body is encrypted;
    // the note NAME stays plaintext (it is the Firebase key + list label).
    const keyInput = document.getElementById('note-key');
    let clearText = '';        // the note's plaintext — the true content; null while LOCKED (dropped, recoverable only via the key)
    let lockedBlob = null;     // the stored cipher blob (SXOR1./AGCM1.); null for a plain, never-keyed note
    let pwCommitted = false;   // false while composing a note's FIRST key (keystrokes re-key live); true once locked/loaded (keystrokes only unlock)
    const ENC_PREFIX = 'AGCM1.';   // legacy AES notes (read-only compat, decrypt via Enter)
    const SX_PREFIX = 'SXOR1.';    // live stream cipher — the key is a reveal LENS: right word shows the note, no/wrong word shows gibberish
    const SX_MAGIC = 'SXOK';  // integrity marker -> detect the correct key for display
    const isEncrypted = s => typeof s === 'string' && (s.startsWith(SX_PREFIX) || s.startsWith(ENC_PREFIX));
    // Fast keystream (FNV seed -> xorshift PRNG). Lighter than AES, chosen for the real-time per-keystroke morph.
    function _sxSeed(s){ let h = 2166136261 >>> 0; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
    function _sxStream(seed, n){ let x = (seed || 0x9e3779b9) >>> 0; const o = new Uint8Array(n); for (let i=0;i<n;i++){ x ^= x<<13; x ^= x>>>17; x ^= x<<5; x >>>= 0; o[i] = x & 0xff; } return o; }
    function sxEncrypt(plain, pw){ const d = new TextEncoder().encode(SX_MAGIC + plain); const k = _sxStream(_sxSeed(pw), d.length); const o = new Uint8Array(d.length); for (let i=0;i<d.length;i++) o[i] = d[i]^k[i]; return SX_PREFIX + btoa(String.fromCharCode(...o)); }
    function sxDecode(blob, pw){ try { const r = Uint8Array.from(atob(blob.slice(SX_PREFIX.length)), c=>c.charCodeAt(0)); const k = _sxStream(_sxSeed(pw), r.length); const o = new Uint8Array(r.length); for (let i=0;i<r.length;i++) o[i] = r[i]^k[i]; const t = new TextDecoder('utf-8', {fatal:false}).decode(o); return t.startsWith(SX_MAGIC) ? {ok:true, plain:t.slice(SX_MAGIC.length)} : {ok:false, view:t}; } catch(_){ return {ok:false, view:''}; } }
    // Central render: the key is a REVEAL LENS. Right word -> the note (editable). No/wrong word -> gibberish (locked).
    function renderNote(){
      const pw = keyInput.value;
      if (!lockedBlob) {                                   // plain note — no key ever set
        notesTextarea.value = clearText || '';
        notesTextarea.readOnly = false;
        return;
      }
      if (lockedBlob.startsWith(ENC_PREFIX)) {             // legacy AES note — press Enter with the key to decrypt
        notesTextarea.value = lockedBlob; notesTextarea.readOnly = true; return;
      }
      const r = sxDecode(lockedBlob, pw);
      if (pw && r.ok) {                                    // the same word -> the real note, editable
        clearText = r.plain;
        notesTextarea.value = clearText;
        notesTextarea.readOnly = false;
      } else {                                             // no word / wrong word -> unreadable, locked; drop the plaintext
        clearText = null;
        notesTextarea.value = r.view;
        notesTextarea.readOnly = true;
      }
    }
    const _b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
    const _unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    async function _deriveKey(password, salt) {
      const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 210000, hash: 'SHA-256' },
        km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    }
    async function encryptText(plaintext, password) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await _deriveKey(password, salt);
      const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(plaintext));
      return ENC_PREFIX + _b64(salt) + '.' + _b64(iv) + '.' + _b64(ct);
    }
    async function decryptText(blob, password) {
      const [, saltB, ivB, ctB] = blob.split('.');
      const key = await _deriveKey(password, _unb64(saltB));
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: _unb64(ivB) }, key, _unb64(ctB));
      return new TextDecoder().decode(pt);
    }

    // Shared read-view: onlinenotes.html?s=<id> loads a note someone shared (public/sharedNotes).
    async function loadSharedView() {
      const id = new URLSearchParams(location.search).get('s');
      if (!id) return;
      try {
        const snap = await get(ref(database, `public/sharedNotes/${id}`));
        const n = snap.val();
        if (!n) { alert('That shared note was not found (it may have been removed).'); return; }
        nameInput.value = n.name || '(shared note)';
        if (isEncrypted(n.note)) { lockedBlob = n.note; clearText = null; pwCommitted = true; renderNote(); }
        else { lockedBlob = null; clearText = n.note || ''; pwCommitted = false; renderNote(); }
      } catch (e) { console.error('shared view failed:', e); }
    }

    onAuthStateChanged(auth, (user) => {
      DATABASE_BASE_PATH = user ? `${user.uid}` : 'public';
      populateNoteList();
    });

    const setupEventListeners = () => {
      document.getElementById('copy-btn').addEventListener('click', copyNote);
      document.getElementById('paste-btn').addEventListener('click', pasteNote);
      document.getElementById('save-btn').addEventListener('click', () => saveNote());
      document.getElementById('delete-btn').addEventListener('click', deleteNote);
      document.getElementById('clear-btn').addEventListener('click', clearNoteInputs);
      document.getElementById('undo-btn').addEventListener('click', undoDelete);
      // ACTIVE REVEAL LENS — the note window responds on EVERY keystroke of the 🔑 key field.
      // Type a note, then type a key: the note stays readable while you set the word (it's being encrypted underneath).
      // Take the key away and it turns to gibberish; type the SAME word back and the note returns. Only the cipher is stored.
      keyInput.addEventListener('input', () => {
        const pw = keyInput.value;
        if (!pwCommitted) {                                  // still composing this note's first key
          if (pw && clearText != null) lockedBlob = sxEncrypt(clearText, pw);   // re-key live so building the word never scrambles
          else if (!pw && lockedBlob) pwCommitted = true;    // key taken away -> lock it in (render drops the plaintext)
        }
        renderNote();
      });
      // Legacy AES notes (AGCM1.) can't morph live — press Enter with the key to decrypt one.
      keyInput.addEventListener('keydown', async (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const key = keyInput.value.trim();
        if (lockedBlob && lockedBlob.startsWith(ENC_PREFIX) && key) {
          try {
            clearText = await decryptText(lockedBlob, key);   // legacy AES decrypt...
            lockedBlob = sxEncrypt(clearText, key);           // ...then upgrade to the live SXOR cipher under the same word
            pwCommitted = true;                               // existing encrypted note: the word unlocks; clearing it re-locks
            renderNote();                                     // key stays in the field -> shows the note, editable
          }
          catch { alert('That key does not match this note.'); }
        }
      });
      document.getElementById('autosave-checkbox').addEventListener('change', toggleAutoSave);
      document.addEventListener("keydown", handleKeyboardShortcuts);
      notesTextarea.addEventListener('input', () => {
        autoResizeTextarea('note');
        if (notesTextarea.readOnly) return;               // locked / gibberish view isn't editable
        clearText = notesTextarea.value;
        const pw = keyInput.value;
        if (pw) lockedBlob = sxEncrypt(clearText, pw);    // a key is set -> keep the stored cipher current under it
        else lockedBlob = null;                           // no key -> a plain note
      });
    };

    const copyNote = () => {
      notesTextarea.select();
      document.execCommand('copy');
      console.log('Copied to clipboard');
    };

    const pasteNote = async () => {
      try {
        const clipboardData = await navigator.clipboard.readText();
        notesTextarea.value += clipboardData;
      } catch (err) {
        console.error('Failed to paste from clipboard:', err);
        alert('Failed to paste from clipboard.');
      }
    };

    const saveNote = async (silent = false) => {
      const nameToSave = nameInput.value.trim();
      const saveBtn = document.getElementById('save-btn');
      const timestamp = new Date().toISOString();

      // The plaintext lives in clearText; store the CIPHER whenever a key is/was used (never the plaintext).
      const pw = keyInput.value;
      const hasContent = (clearText != null && clearText.trim()) || (lockedBlob && lockedBlob.startsWith(SX_PREFIX));
      if (!nameToSave || !hasContent) {
        if (!silent) console.log('Please enter both the name and note before saving');
        return;
      }
      let noteToSave = clearText, encFlag = false;
      if (lockedBlob) { noteToSave = lockedBlob; encFlag = true; }                          // encrypted (locked or unlocked) -> store the cipher
      else if (pw && clearText) { noteToSave = sxEncrypt(clearText, pw); encFlag = true; }  // safety net: key set but no blob yet

      try {
        const notesRef = ref(database, `${DATABASE_BASE_PATH}/notes/${nameToSave}`);
        const snapshot = await get(notesRef);
        const existingNote = snapshot.val();
        const rec = { name: nameToSave, note: noteToSave, timestamp, enc: encFlag };

        if (!existingNote || new Date(timestamp) > new Date(existingNote.timestamp)) {
          await set(notesRef, rec);
          console.log('Note saved successfully');
          updateSaveButton(saveBtn);
        } else {
          const userChoice = confirm(
            `⚠️ A newer version of "${nameToSave}" already exists.\nDo you want to overwrite it with your current changes?`
          );
          if (userChoice) {
            await set(notesRef, rec);
            console.log('Note overwritten by user choice');
            updateSaveButton(saveBtn);
          } else {
            console.log('Save cancelled. Newer note preserved.');
          }
        }
      } catch (err) {
        console.error('Failed to save note:', err);
        if (!silent) alert('Failed to save the note. Please try again.');
      }
    };

    const updateSaveButton = (button) => {
      button.textContent = 'Saved';
      button.style.backgroundColor = 'lightblue';
      setTimeout(() => {
        button.textContent = '💾';
        button.style.backgroundColor = '';
      }, 2000);
    };

    // --- Share: copy the note to a public share node and put a read-link in the clipboard. ---
    const shareNote = async () => {
      const name = nameInput.value.trim();
      const key = keyInput.value;
      const plaintext = (clearText || '').trim();
      if (!name || !plaintext) { alert('Load or type a note first.'); return; }
      let body = plaintext, encFlag = false;
      if (key) {   // if a key is set, the shared copy is encrypted too
        try { body = await encryptText(plaintext, key); encFlag = true; }
        catch (e) { console.error('Encryption failed:', e); alert('Encryption failed.'); return; }
      }
      try {
        const shareRef = push(ref(database, 'public/sharedNotes'));
        await set(shareRef, { name, note: body, enc: encFlag, sharedBy: DATABASE_BASE_PATH, timestamp: new Date().toISOString() });
        const link = `${location.origin}${location.pathname}?s=${shareRef.key}`;
        try { await navigator.clipboard.writeText(link); alert(`Share link copied to clipboard${encFlag ? ' — the note is encrypted, so send the key separately' : ''}:\n\n${link}`); }
        catch { prompt('Copy this share link:', link); }
      } catch (err) {
        console.error('Share failed:', err);
        alert('Could not create the share link.');
      }
    };

    const deleteNote = async () => {
      const nameToDelete = nameInput.value.trim();

      if (nameToDelete) {
        const userConfirmed = confirm(`Are you sure you want to delete the note with name: ${nameToDelete}?`);
        if (!userConfirmed) {
          console.log('Note deletion cancelled.');
          return;
        }

        try {
          const notesRef = ref(database, `${DATABASE_BASE_PATH}/notes`);
          const snapshot = await get(notesRef);
          const notes = snapshot.val();

          if (notes) {
            const noteId = Object.keys(notes).find(id => notes[id].name === nameToDelete);
            if (noteId) {
              const deletedNote = notes[noteId];
              storeDeletedNote(deletedNote.name, deletedNote.note);
              await set(ref(database, `${DATABASE_BASE_PATH}/notes/${noteId}`), null);
              clearNoteInputs();
              console.log(`Deleted the note with name: ${nameToDelete}`);
            } else {
              console.log('Note not found.');
            }
          } else {
            console.log('No notes available.');
          }
        } catch (err) {
          console.error('Failed to delete note:', err);
          alert('Failed to delete the note. Please try again.');
        }
      } else {
        console.log('Please enter the name of the note to delete.');
      }
    };

    const clearNoteInputs = () => {
      nameInput.value = '';
      notesTextarea.value = '';
      notesTextarea.readOnly = false;
      clearText = '';
      lockedBlob = null;
      pwCommitted = false;
      // keyInput is left as-is, so you can Clear and write another note under the same key.
    };

    const populateNoteList = () => {
      if (unsub) {
        unsub();
        unsub = null;
      }
      const notesRef = ref(database, `${DATABASE_BASE_PATH}/notes`);
      unsub = onValue(notesRef, snapshot => {
        const notes = snapshot.val();
        noteList.innerHTML = '';

        if (notes) {
          const sortedNotes = Object.values(notes).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
          sortedNotes.forEach(note => createNoteListItem(note));
        } else {
          noteList.innerHTML = '<li>No notes found</li>';
        }
      });
    };

    const createNoteListItem = (note) => {
      const listItem = document.createElement('li');

      const nameSpan = document.createElement('span');
      nameSpan.style.fontWeight = 'bold';
      nameSpan.textContent = note.name;

      const timestampSpan = document.createElement('span');
      timestampSpan.style.fontWeight = 'normal';
      timestampSpan.style.marginLeft = '10px';
      timestampSpan.textContent = ` (${new Date(note.timestamp).toLocaleString()})`;

      listItem.appendChild(nameSpan);
      listItem.appendChild(timestampSpan);

      if (note.sharedBy) {
        const shareTag = document.createElement('span');
        shareTag.textContent = ' · shared' + (note.sharedByLabel ? ' by ' + note.sharedByLabel : '');
        shareTag.style.cssText = 'font-weight:normal;font-size:0.8em;color:#4a90d9;margin-left:6px';
        listItem.appendChild(shareTag);
      }

      if (isEncrypted(note.note)) {
        const lockTag = document.createElement('span');
        lockTag.textContent = ' 🔒';
        lockTag.title = 'Encrypted — set the matching key to read';
        lockTag.style.marginLeft = '6px';
        listItem.appendChild(lockTag);
      }

      listItem.addEventListener('click', () => {
        nameInput.value = note.name;
        if (isEncrypted(note.note)) {
          lockedBlob = note.note; clearText = null; pwCommitted = true;   // encrypted: locked until the same word is typed
        } else {
          lockedBlob = null; clearText = note.note; pwCommitted = false;  // plain: readable, and a key can encrypt it
        }
        renderNote();
      });

      noteList.appendChild(listItem);
    };

    const storeDeletedNote = (name, note) => {
      deletedNotes.push({ name, note });
    };

    const undoDelete = async () => {
      if (deletedNotes.length > 0) {
        const lastDeletedNote = deletedNotes.pop();
        const { name, note } = lastDeletedNote;

        const notesRef = ref(database, `${DATABASE_BASE_PATH}/notes/${name}`);
        try {
          await set(notesRef, { name, note, timestamp: new Date().toISOString() });
          console.log(`Undone the deletion of the note with name: ${name}`);
          populateNoteList();
        } catch (error) {
          console.error('Failed to undo the deletion:', error);
        }
      } else {
        console.log('No deleted notes to undo');
      }
    };

    const autoResizeTextarea = (id) => {
      const textarea = document.getElementById(id);
      textarea.style.height = textarea.scrollHeight + 'px';
    };

    const toggleAutoSave = (event) => {
      if (event.target.checked) {
        autoSaveInterval = setInterval(() => saveNote(true), 40000);
      } else {
        clearInterval(autoSaveInterval);
      }
    };

    const handleKeyboardShortcuts = (event) => {
      if (event.ctrlKey && event.key === "s") {
        event.preventDefault();
        document.getElementById("save-btn").click();
      }
    };

    document.addEventListener("DOMContentLoaded", () => {
      setupEventListeners();
      autoSaveInterval = setInterval(() => saveNote(true), 40000);
      loadSharedView();
    });

    document.getElementById('resizeTextareaBtn').addEventListener('click', () => {
      autoResizeTextarea('note');
    });
  </script>
</body>

</html>
