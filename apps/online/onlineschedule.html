<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Scheduler</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/online.css">
    <style>
        #calendar {
            max-width: 900px;
            margin: 50px auto;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            padding: 0;
            padding-top: 10px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: var(--scrim);
            overflow: auto;
        }

        .modal-content {
            background-color: var(--surface);   /* was var(--backgroundColor): undefined in online.css -> transparent box */
            color: var(--text);
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            max-width: 600px;
            margin: 0 auto;
        }

        .close {
            color: var(--muted);
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: var(--text);
            text-decoration: none;
            cursor: pointer;
        }

        .fc .fc-scroller-liquid-absolute {
            position: relative;
        }

        .fc-direction-ltr .fc-daygrid-event.fc-event-end:hover,
        .fc-h-event .fc-event-main-frame:hover {
            background: var(--accent);
            cursor: pointer;
            overflow: auto;
        }

        .lg-scheduled { color: var(--info); }
        .lg-active { color: var(--warn); }
        .lg-complete { color: var(--ok); }

        .fc,
        .fc-scroller-liquid {
            height: auto !important;
        }
    </style>
    <script type="module" src="../assets/js/auth.js" defer></script>
    <script src="../assets/js/links-aside.js" defer></script>
</head>

<body>
    <header>
    <div class="logo-box"><a href="../../index.html" title="Home"><img src="../../assets/img/android-chrome-192x192.png" alt="Home" style="height:40px;vertical-align:middle;"></a></div>
        <h1>Appointment Scheduler</h1>
        <div class="auth-bar"><span id="auth-label">Not signed in</span><button id="auth-btn">Sign In</button></div>
        <button id="theme-toggle" title="Toggle theme">☀️</button>
        <script>(function () { var b = document.getElementById("theme-toggle"), h = document.documentElement; b.textContent = h.classList.contains("light") ? "🌙" : "☀️"; b.addEventListener("click", function () { var n = h.classList.contains("light") ? "dark" : "light"; h.classList.toggle("light", n === "light"); localStorage.setItem("ss-theme", n); b.textContent = n === "light" ? "🌙" : "☀️"; }); })();</script>
        <div id="login-inline">
            <h3>Sign In</h3><input type="email" id="email-in" placeholder="Email" /><input type="password" id="pass-in"
                placeholder="Password" /><button id="do-login">Sign In</button>
            <p id="auth-err"></p>
        </div>
    </header>
    <section>

        <div id="cal-legend" style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:8px 4px;font-size:0.85rem">
            <span style="font-weight:600">Show:</span>
            <label><input type="checkbox" class="cal-filter" value="scheduled" checked> <span class="lg-scheduled">🗓 Scheduled</span></label>
            <label><input type="checkbox" class="cal-filter" value="active" checked> <span class="lg-active">● Active</span></label>
            <label><input type="checkbox" class="cal-filter" value="complete" checked> <span class="lg-complete">✓ Complete</span></label>
        </div>
        <div id="calendar"></div>
        <div id="appointmentModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Schedule Appointment</h2>
                <form id="appointmentForm">
                    <input type="hidden" id="id">
                    <label for="customerName">Name:</label>
                    <input type="text" id="customerName" required><br>

                    <label for="project">Project:</label>
                    <input type="text" id="project"><br>

                    <label for="appointmentDate">Date:</label>
                    <input type="date" id="appointmentDate" readonly><br>

                    <label for="appointmentTime">Time:</label>
                    <input type="time" id="appointmentTime"><br>

                    <label for="customerAddress" id="addressLabel" style="cursor: pointer;">Address:</label>
                    <input type="text" id="customerAddress" placeholder="Enter address"><br>

                    <label for="customerPhone" id="phoneLabel" style="cursor: pointer;">Phone Number:</label>
                    <input type="tel" id="customerPhone" placeholder="Enter phone number"><br>

                    <label for="appointmentNotes">Notes:</label>
                    <textarea id="appointmentNotes"></textarea><br>

                    <button type="submit">Save Appointment</button>
                    <button type="button" id="startButton" style="display:none;">▶ Start job (moves to onlinejob)</button>
                    <button type="button" id="deleteButton" style="display:none;">Delete Appointment</button>
                </form>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.js"></script>
    <script type="module">
        import { database, ref, get, set, remove, update, onValue, auth, onAuthStateChanged } from '../assets/js/firebase-init.js';

        let calendar;
        const modal = document.getElementById("appointmentModal");
        const closeBtn = document.querySelector(".close");
        const form = document.getElementById("appointmentForm");
        const deleteButton = document.getElementById('deleteButton');
        const startButton = document.getElementById('startButton');
        let DATABASE_BASE_PATH = 'public';
        let unsubTasks = null;

        document.addEventListener('DOMContentLoaded', function () {
            const calendarEl = document.getElementById('calendar');

            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,listWeek'
                },
                views: {
                    dayGridMonth: { buttonText: 'Month View' },
                    listWeek: { type: 'list', duration: { month: 1 }, buttonText: 'List View' }
                },
                dateClick: function (info) {
                    openModalForNewAppointment(info.dateStr);
                },
                eventClick: function (info) {
                    openModalForExistingTask(info.event);
                },
                events: []
            });

            calendar.render();

            setupFirebaseListener();
            document.querySelectorAll('.cal-filter').forEach(c => c.addEventListener('change', renderEvents));
        });

        function setupFirebaseListener() {
            onAuthStateChanged(auth, (user) => {
                DATABASE_BASE_PATH = user ? `${user.uid}` : 'public';

                if (unsubTasks) unsubTasks();

                const tasksRef = ref(database, DATABASE_BASE_PATH + '/tasks');

                unsubTasks = onValue(tasksRef, (snapshot) => {
                    lastTasks = snapshot.val() || {};
                    renderEvents();
                }, (error) => {
                    console.error("Firebase read error:", error);
                });
            });
        }

        function openModalForNewAppointment(dateStr) {
            resetForm();
            document.getElementById('appointmentDate').value = dateStr;
            modal.style.display = "block";
            deleteButton.style.display = 'none';
            startButton.style.display = 'none';
        }

        function openModalForExistingTask(event) {
            resetForm();
            fillFormWithTaskDetails(event);
            modal.style.display = "block";
            deleteButton.style.display = 'block';
            const p = event.extendedProps || {};
            startButton.style.display = (p.status === 'scheduled' && !p.endTime) ? 'block' : 'none';
        }

        closeBtn.onclick = () => modal.style.display = "none";
        window.onclick = (e) => { if (e.target == modal) modal.style.display = "none"; };

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const appointmentData = getFormData();
            saveAppointmentToDatabase(appointmentData);

            modal.style.display = "none";
            form.reset();
        });

        deleteButton.addEventListener('click', function () {
            const id = document.getElementById('id').value;
            if (id && confirm('Are you sure you want to delete this task?')) {
                deleteTask(id);
            }
        });

        // Flip a scheduled (future) job to active so it moves into onlinejob's active log — same record, no re-entry.
        startButton.addEventListener('click', function () {
            const id = document.getElementById('id').value;
            if (!id) return;
            update(ref(database, `${DATABASE_BASE_PATH}/tasks/${id}`), { status: 'active' })
                .then(() => { modal.style.display = 'none'; })
                .catch(err => console.error('Error starting job:', err));
        });

        let lastTasks = {};
        // Re-render the calendar from the latest tasks, honoring the Show: filters (scheduled/active/complete).
        function renderEvents() {
            if (!calendar) return;
            const show = new Set([...document.querySelectorAll('.cal-filter:checked')].map(c => c.value));
            calendar.getEvents().forEach(e => e.remove());
            Object.keys(lastTasks).forEach(id => {
                const t = lastTasks[id];
                if (t && typeof t === 'object' && show.has(jobState(t))) calendar.addEvent(formatTaskAsEvent(t, id));
            });
        }
        function formatTaskAsEvent(task, id) {
            const state = jobState(task);
            const eventColor = getEventColor(task);
            const badge = { complete: '✓ ', scheduled: '🗓 ', active: '● ' }[state];
            return {
                id: id,
                title: badge + (task.customerName || '(no name)'),
                start: task.startTime,
                end: task.endTime,
                backgroundColor: eventColor,
                borderColor: eventColor,
                extendedProps: { ...task }
            };
        }

        // Job state drives the calendar indicator: scheduled = future job (status, checked FIRST because a
        // bot-booked job carries a planned end time/segment too); complete = has an end time;
        // active = undergoing (default, incl. legacy jobs with no status field).
        function jobState(task) {
            if (task.status === 'scheduled') return 'scheduled';
            if (task.endTime) return 'complete';
            return 'active';
        }
        function getEventColor(task) {
            return { complete: '#4ade80', scheduled: '#60a5fa', active: '#fbbf24' }[jobState(task)];
        }

        function fillFormWithTaskDetails(event) {
            const { title: customerName, start, extendedProps } = event;
            const { customerAddress, notes, project, id, customerPhone } = extendedProps;

            const startDateTime = new Date(start);
            const localDate = startDateTime.toLocaleDateString('en-CA');
            const localTime = startDateTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });

            document.getElementById('customerName').value = customerName || '';
            document.getElementById('appointmentDate').value = localDate;
            document.getElementById('appointmentTime').value = localTime;
            document.getElementById('customerAddress').value = customerAddress || '';
            document.getElementById('appointmentNotes').value = notes || '';
            document.getElementById('project').value = project || '';
            document.getElementById('id').value = id || '';
            document.getElementById('customerPhone').value = customerPhone || '';
        }

        function getFormData() {
            const date = document.getElementById('appointmentDate').value;
            const time = document.getElementById('appointmentTime').value;

            const localDateTime = new Date(`${date}T${time}:00`).toISOString();

            const existingId = document.getElementById('id').value;
            const data = {
                customerName: document.getElementById('customerName').value,
                startTime: localDateTime,
                customerAddress: document.getElementById('customerAddress').value,
                customerPhone: document.getElementById('customerPhone').value,
                notes: document.getElementById('appointmentNotes').value,
                project: document.getElementById('project').value,
                id: existingId || Date.now().toString()
            };
            if (!existingId) data.status = 'scheduled';   // brand-new = a future/scheduled job; edits leave status untouched
            return data;
        }

        function saveAppointmentToDatabase(appointment) {
            const taskRef = ref(database, `${DATABASE_BASE_PATH}/tasks/${appointment.id}`);
            // update() merges only the appointment fields onto the shared task record
            // (tasks also hold job + invoice data). No read-then-set race, and it no
            // longer stamps invoiceType='quote' onto plain job tasks.
            update(taskRef, appointment).then(() => {
                console.log('Task saved successfully.');
            }).catch(error => console.error('Error saving task:', error));
        }

        function deleteTask(id) {
            const taskRef = ref(database, `${DATABASE_BASE_PATH}/tasks/${id}`);
            get(taskRef).then(snap => {
                const t = snap.exists() ? snap.val() : {};
                // tasks are shared - guard against nuking job/invoice/ledger data
                if ((t.startTime || t.invoiceSaved || t.paymentTxId) &&
                    !confirm('This record also holds job time-tracking or invoice data. Deleting removes ALL of it. Delete anyway?')) return;
                remove(taskRef).then(() => {
                    const event = calendar.getEventById(id);
                    if (event) event.remove();
                    alert('Task deleted successfully.');
                    modal.style.display = "none";
                }).catch(error => console.error('Error deleting task:', error));
            }).catch(error => {
                console.error('Error checking task before delete:', error);
                alert('Failed to delete task.');
            });
        }

        function resetForm() {
            form.reset();
            document.getElementById('id').value = '';
        }

        document.getElementById('addressLabel').addEventListener('click', () => {
            const addressInput = document.getElementById('customerAddress');
            const address = addressInput.value.trim();

            if (address) {
                navigator.clipboard.writeText(address)
                    .then(() => {
                        alert('Address copied to clipboard!');
                    })
                    .catch(err => {
                        console.error('Error copying address:', err);
                        alert('Failed to copy address.');
                    });
            } else {
                alert('No address to copy.');
            }
        });

        document.getElementById('phoneLabel').addEventListener('click', () => {
            const phoneInput = document.getElementById('customerPhone');
            const phoneNumber = phoneInput.value.trim();

            if (phoneNumber) {
                const tempLink = document.createElement('a');
                tempLink.href = `tel:${phoneNumber}`;
                tempLink.click();
            } else {
                alert('No phone number to call.');
            }
        });
    </script>
    <script src="../assets/js/reveal.js?v=2" defer></script>
</body>

</html>
