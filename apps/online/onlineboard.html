<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="version" content="1.1.9">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Campfire</title>

  <link rel="stylesheet" href="../assets/css/online.css" />
  <link rel="icon" href="../../favicon.ico" />

  <script>
    (function () {
      const t = localStorage.getItem("ss-theme");
      if (t === "light") document.documentElement.classList.add("light");
    })();
  </script>

  <script type="module" src="../assets/js/auth.js"></script>

  <style>
    .cf-note { color: var(--muted); font-size: .85rem; margin: 0; padding: 12px; }
    #cf-app[hidden], #cf-out[hidden], #cf-compose[hidden] { display: none; }

    /* email layout: folders | message list | reading pane */
    body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }   /* the page never scrolls: each pane does, however tall the header wraps */
    main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 8px; box-sizing: border-box; }
    #cf-app { flex: 1; min-height: 0; display: grid; grid-template-columns: 170px minmax(240px, 340px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr);
      border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
    .cf-side { padding: 12px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; min-width: 0; overflow-y: auto; }
    .cf-new { width: 100%; margin-bottom: 8px; font-weight: 600; }
    .cf-folder { display: flex; justify-content: space-between; width: 100%; background: none; border: 0; color: var(--text); padding: 8px 10px; border-radius: var(--radius); text-align: left; cursor: pointer; }
    .cf-folder:hover { background: var(--hover); }
    .cf-folder.on { background: var(--surface2); font-weight: 600; }
    .cf-warn { margin-top: auto; color: var(--muted); font-size: .75rem; }

    /* a div, not a section: online.css gives section a margin, padding and border (and nav a 300px width) */
    .cf-listpane { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--border); }
    .cf-search { padding: 8px; border-bottom: 1px solid var(--border); }
    .cf-search input { width: 100%; box-sizing: border-box; font-size: 16px; }
    #cf-list { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
    .cf-row { display: block; width: 100%; box-sizing: border-box; overflow: hidden; background: none; border: 0; border-bottom: 1px solid var(--border); color: var(--text); padding: 10px 12px; text-align: left; cursor: pointer; }
    .cf-row:hover { background: var(--hover); }
    .cf-row.on { background: var(--surface2); }
    .cf-row-top { display: flex; justify-content: space-between; gap: 8px; font-size: .85rem; }
    .cf-row-from, .cf-row-subject, .cf-row-snip { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .cf-row-when { color: var(--muted); font-size: .75rem; flex: none; }
    .cf-row-subject { font-size: .9rem; margin-top: 2px; }
    .cf-row-snip { color: var(--muted); font-size: .8rem; margin-top: 2px; }
    .cf-row.unread .cf-row-from, .cf-row.unread .cf-row-subject { font-weight: 700; }

    #cf-read { overflow-y: auto; padding: 16px; min-width: 0; }
    .cf-back { display: none; margin-bottom: 10px; }
    .cf-subject { font-size: 1.2rem; font-weight: 600; margin: 0 0 8px; overflow-wrap: anywhere; }
    .cf-meta { color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; margin-bottom: 2px; }
    .cf-body { white-space: pre-wrap; overflow-wrap: anywhere; margin: 16px 0 0; }
    .cf-files { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
    .cf-file { overflow-wrap: anywhere; }
    .cf-file img { max-width: 100%; max-height: 360px; border-radius: var(--radius); display: block; }
    .cf-actions { display: flex; gap: 8px; margin-top: 16px; }
    .cf-msg { padding: 12px 0; border-top: 1px solid var(--border); }
    .cf-msg .cf-body { margin-top: 10px; }
    .cf-msg .cf-del { margin-top: 8px; font-size: .8rem; }
    .cf-setting { display: block; margin: 16px 0 6px; }
    .cf-setting select { display: block; margin-top: 4px; font-size: 16px; }
    .cf-setting-btn { margin-top: 16px; }
    .cf-del.armed { color: var(--danger); border-color: var(--danger); }

    #cf-compose { position: fixed; right: 16px; bottom: 16px; width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; box-sizing: border-box;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 8px 28px var(--shadow); padding: 12px; z-index: 50; }
    .cf-compose-head { display: flex; justify-content: space-between; align-items: center; font-weight: 600; margin-bottom: 8px; }
    #cf-compose label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 8px; }
    #cf-compose input, #cf-compose select, #cf-compose textarea { display: block; width: 100%; box-sizing: border-box; font-size: 16px; margin-top: 4px; }
    #cf-compose textarea { min-height: 150px; resize: vertical; }
    .cf-picked { color: var(--muted); font-size: .85rem; margin: 0 0 8px; overflow-wrap: anywhere; }
    .cf-send { display: flex; align-items: center; gap: 10px; }
    .cf-count { color: var(--muted); font-size: .8rem; margin-left: auto; }
    .cf-err { color: var(--danger); font-size: .85rem; min-height: 1.2em; margin: 8px 0 0; }

    @media (max-width: 760px) {
      main { padding: 0; }
      #cf-app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); border-radius: 0; border-left: 0; border-right: 0; }
      .cf-side { flex-direction: row; flex-wrap: wrap; align-items: center; border-right: 0; border-bottom: 1px solid var(--border); padding: 8px; }
      .cf-new { width: auto; margin: 0; }
      .cf-folder { width: auto; gap: 6px; }
      .cf-warn { display: none; }
      .cf-listpane { border-right: 0; }
      #cf-read { display: none; }
      #cf-app.reading .cf-side, #cf-app.reading .cf-listpane { display: none; }
      #cf-app.reading { grid-template-rows: minmax(0, 1fr); }
      #cf-app.reading #cf-read { display: block; }
      .cf-back { display: inline-block; }
    }
  </style>
</head>

<body>

  <header style="position:relative;">
    <div class="logo-box"><a href="../../index.html"><img src="../../assets/img/android-chrome-192x192.png"
          alt="Luis Solutions"></a></div>
    <h1>The Campfire</h1>
    <div class="auth-bar">
      <span id="auth-label">Not signed in</span>
      <button id="auth-btn">Sign In</button>
    </div>
    <button id="theme-toggle" title="Toggle theme">☀️</button>
    <script src="../assets/js/theme-toggle.js"></script>
    <div id="login-inline">
      <h3>Sign In</h3>
      <input type="email" id="email-in" placeholder="Email" />
      <input type="password" id="pass-in" placeholder="Password" />
      <button id="do-login">Sign In</button>
      <p id="auth-err"></p>
    </div>
  </header>

  <main>
    <p id="cf-out" class="cf-note">Checking your sign-in…</p>
    <div id="cf-app" hidden>
      <div class="cf-side">
        <button type="button" id="cf-new" class="cf-new">✏️ Compose</button>
        <button type="button" class="cf-folder on" data-folder="inbox"><span>Inbox</span><span id="cf-unread"></span></button>
        <button type="button" class="cf-folder" data-folder="sent"><span>Sent</span></button>
        <button type="button" class="cf-folder" data-folder="all"><span>All</span></button>
        <button type="button" id="cf-settings" class="cf-folder"><span>⚙ Settings</span></button>
        <p class="cf-warn">Every signed-in account can read this. Keep private matters off it.<span id="cf-keepnote"></span></p>
      </div>
      <div class="cf-listpane">
        <div class="cf-search"><input id="cf-search" type="search" placeholder="Search" /></div>
        <div id="cf-list"></div>
      </div>
      <article id="cf-read"><p class="cf-note">Pick a message to read it.</p></article>
    </div>

    <form id="cf-compose" hidden>
      <div class="cf-compose-head"><span id="cf-compose-title">New message</span><button type="button" id="cf-close" title="Close">✕</button></div>
      <label>To
        <select id="cf-to">
          <option value="all">Everyone</option>
          <option value="LD">LD: Luis + Droplet</option>
          <option value="NL">NL: Nick + Lumen</option>
          <option value="KC">KC: Kevin + Cairn</option>
        </select>
      </label>
      <label>Subject <input id="cf-subject" maxlength="120" required /></label>
      <label>Message <textarea id="cf-body" maxlength="4000" required></textarea></label>
      <label>Files (PDFs, photos, anything; up to 5, 200 MB each, big ones split on their own) <input type="file" id="cf-files" multiple /></label>
      <p id="cf-picked" class="cf-picked"></p>
      <div class="cf-send">
        <button type="submit" id="cf-post">Send</button>
        <span id="cf-count" class="cf-count">0 / 4000</span>
      </div>
      <p id="cf-err" class="cf-err"></p>
    </form>
  </main>

  <script type="module">
    import { auth, database, ref, get, set, update, remove, onValue, onAuthStateChanged, query, limitToLast,
      storage, storageRef, uploadBytes, getDownloadURL, deleteObject }
      from "../assets/js/firebase-init.js";

    // The Campfire is one shared node, share/mail. Rules: any signed-in account reads; a post can only be written as its own uid.
    const NODE = "share/mail";
    const MAX_FILES = 5, MAX_BYTES = 200e6, PART_BYTES = 24e6;
    const STORAGE_HOST = "https://firebasestorage.googleapis.com/v0/b/persinfo-df93f.appspot.com/o/";
    const $ = id => document.getElementById(id);
    let me = null, names = {}, posts = {}, stopFeed = null;
    const SETTINGS = "share/campfire/settings";   // retainDays: read by svc-board-watch, which does the deleting
    let folder = "inbox", open = "", replyTo = "", settings = {}, stopSettings = null, inSettings = false;

    const nameOf = uid => (names[uid] && names[uid].name) || "";
    const sizeText = n => n >= 1e6 ? `${(n / 1e6).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1e3))} KB`;
    const tsOf = (k, p) => Number(p.ts) || Number(k) || 0;
    const fromOf = p => String(p.from || nameOf(p.sharedBy) || "Unknown");
    const filesOf = p => Array.isArray(p.files) ? p.files : [];

    // read state is per person, per browser: a list of opened keys
    const readKey = () => `cf_read_${me ? me.uid : ""}`;
    function loadRead() { try { return new Set(JSON.parse(localStorage.getItem(readKey()) || "[]")); } catch (_) { return new Set(); } }
    function markRead(k) {
      const s = loadRead(); s.add(k);
      try { localStorage.setItem(readKey(), JSON.stringify([...s].slice(-500))); } catch (_) { /* private window: unread just stays */ }
    }

    onAuthStateChanged(auth, async user => {
      me = user;
      if (stopFeed) { stopFeed(); stopFeed = null; }
      if (stopSettings) { stopSettings(); stopSettings = null; }
      if (!user || user.isAnonymous) {              // SES style: no login, off to the login page, then back here
        location.replace("../../reg.html?next=" + encodeURIComponent("/apps/online/onlineboard.html"));
        return;
      }
      $("cf-app").hidden = false;
      $("cf-out").hidden = true;
      try { names = (await get(ref(database, "share/directory"))).val() || {}; } catch (_) { names = {}; }
      stopSettings = onValue(ref(database, SETTINGS), snap => { settings = snap.val() || {}; keepNote(); if (inSettings) renderSettings(); }, () => {});
      stopFeed = onValue(query(ref(database, NODE), limitToLast(100)), snap => { posts = snap.val() || {}; renderList(); if (open && !inSettings) renderRead(); },
        err => { $("cf-list").textContent = /permission/i.test(err.message) ? "Your account is waiting for Luis to approve it." : "Could not load the Campfire: " + err.message; });
    });

    // Threads, the way Outlook does it: a reply joins its parent through replyTo, and a post with no
    // replyTo joins the conversation with the same subject once any "Re:" is stripped.
    const baseSubject = s => String(s || "").replace(/^(\s*re:\s*)+/i, "").trim().toLowerCase();

    function threads() {
      const keys = Object.keys(posts).sort((a, b) => tsOf(a, posts[a] || {}) - tsOf(b, posts[b] || {}));
      const threadOf = {}, bySubject = {}, groups = {};
      for (const k of keys) {
        const p = posts[k] || {}, s = baseSubject(p.subject);
        const id = (p.replyTo && threadOf[p.replyTo]) || (s && bySubject[s]) || k;
        threadOf[k] = id;
        if (s && !bySubject[s]) bySubject[s] = id;
        (groups[id] = groups[id] || []).push(k);
      }
      return groups;
    }

    function visible() {
      const q = $("cf-search").value.trim().toLowerCase(), groups = threads();
      const last = id => { const ks = groups[id], k = ks[ks.length - 1]; return tsOf(k, posts[k] || {}); };
      return Object.keys(groups).filter(id => {
        const ps = groups[id].map(k => posts[k] || {});
        const anyMine = ps.some(p => p.sharedBy === me.uid), anyTheirs = ps.some(p => p.sharedBy !== me.uid);
        if ((folder === "inbox" && !anyTheirs) || (folder === "sent" && !anyMine)) return false;
        return !q || ps.some(p => [p.from, p.to, p.subject, p.body].some(v => String(v || "").toLowerCase().includes(q)));
      }).sort((a, b) => last(b) - last(a)).map(id => ({ id, keys: groups[id] }));
    }

    function shortWhen(t) {
      const d = new Date(t), now = new Date();
      return d.toDateString() === now.toDateString() ? d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : d.toLocaleDateString([], { month: "short", day: "numeric" });
    }

    const isUnread = (k, read) => !read.has(k) && (posts[k] || {}).sharedBy !== me.uid;

    function row(th, read) {
      const first = posts[th.keys[0]] || {}, lastKey = th.keys[th.keys.length - 1], p = posts[lastKey] || {};
      const b = document.createElement("button");
      b.type = "button";
      b.className = `cf-row${th.id === open ? " on" : ""}${th.keys.some(k => isUnread(k, read)) ? " unread" : ""}`;
      const top = document.createElement("div"); top.className = "cf-row-top";
      const from = document.createElement("span"); from.className = "cf-row-from";
      from.textContent = (folder === "sent" ? `To: ${p.to || "all"}` : fromOf(p)) + (th.keys.length > 1 ? ` (${th.keys.length})` : "");
      const when = document.createElement("span"); when.className = "cf-row-when"; when.textContent = shortWhen(tsOf(lastKey, p));
      top.append(from, when);
      const subject = document.createElement("div"); subject.className = "cf-row-subject";
      subject.textContent = `${th.keys.some(k => filesOf(posts[k] || {}).length) ? "📎 " : ""}${String(first.subject || "(no subject)")}`;
      const snip = document.createElement("div"); snip.className = "cf-row-snip"; snip.textContent = String(p.body || "").replace(/\s+/g, " ").slice(0, 90);
      b.append(top, subject, snip);
      b.addEventListener("click", () => { inSettings = false; open = th.id; th.keys.forEach(markRead); renderList(); renderRead(); $("cf-app").classList.add("reading"); });
      return b;
    }

    function renderList() {
      const read = loadRead(), list = $("cf-list"), shown = visible();
      if (!shown.length) {
        const empty = document.createElement("p");
        empty.className = "cf-note"; empty.textContent = "Nothing here.";
        list.replaceChildren(empty);
      } else {
        list.replaceChildren(...shown.map(th => row(th, read)));
      }
      const groups = threads();
      const unread = Object.keys(groups).filter(id => groups[id].some(k => isUnread(k, read))).length;
      $("cf-unread").textContent = unread || "";
    }

    // A big file is stored as 24 MB parts: uploaded split, put back together here so the download is the original file.
    function partsRow(f) {
      const urls = f.parts.map(p => String((p || {}).url || ""));
      if (!urls.length || !urls.every(u => u.startsWith(STORAGE_HOST))) return null;
      const name = String(f.name || "file"), label = `⬇ ${name}${f.size ? ` (${sizeText(Number(f.size))})` : ""}`;
      const row = document.createElement("div"); row.className = "cf-file";
      const b = document.createElement("button"); b.type = "button"; b.textContent = label;
      b.addEventListener("click", async () => {
        b.disabled = true;
        try {
          const blobs = [];
          for (let i = 0; i < urls.length; i++) {
            b.textContent = `Downloading part ${i + 1} of ${urls.length}…`;
            const r = await fetch(urls[i]);
            if (!r.ok) throw new Error(`part ${i + 1} failed`);
            blobs.push(await r.blob());
          }
          const link = document.createElement("a");
          link.href = URL.createObjectURL(new Blob(blobs, { type: String(f.type || "application/octet-stream") }));
          link.download = name; document.body.append(link); link.click(); link.remove();
          setTimeout(() => URL.revokeObjectURL(link.href), 60000);
          b.textContent = label;
        } catch (e) { b.textContent = "Download failed: " + e.message; }
        b.disabled = false;
      });
      row.append(b);
      return row;
    }

    function fileRow(f) {
      if (Array.isArray(f.parts)) return partsRow(f);
      const url = String(f.url || "");
      if (!url.startsWith(STORAGE_HOST)) return null;     // only our own bucket: a post can't plant any other link
      const row = document.createElement("div");
      row.className = "cf-file";
      const a = document.createElement("a");
      a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
      const name = String(f.name || "file");
      if (/^image\//.test(String(f.type || ""))) {
        const img = document.createElement("img");
        img.src = url; img.alt = name; img.loading = "lazy";
        a.append(img);
      } else {
        a.textContent = `⬇ ${name}${f.size ? ` (${sizeText(Number(f.size))})` : ""}`;
      }
      row.append(a);
      return row;
    }

    function message(k) {
      const p = posts[k] || {}, box = document.createElement("div");
      box.className = "cf-msg";
      const from = fromOf(p), account = nameOf(p.sharedBy);
      const m1 = document.createElement("div"); m1.className = "cf-meta";
      // `from` is free text: the account name comes from the uid, which the rules guarantee
      m1.textContent = `From: ${from}${account && account !== from ? ` (account: ${account})` : ""}`;
      const m2 = document.createElement("div"); m2.className = "cf-meta"; m2.textContent = `To: ${p.to || "all"} · ${new Date(tsOf(k, p)).toLocaleString()}`;
      const body = document.createElement("p"); body.className = "cf-body"; body.textContent = String(p.body || "");
      box.append(m1, m2, body);
      const rows = filesOf(p).map(fileRow).filter(Boolean);
      if (rows.length) { const w = document.createElement("div"); w.className = "cf-files"; w.append(...rows); box.append(w); }
      if (p.sharedBy === me.uid) box.append(deleteButton(k, p));
      return box;
    }

    function renderRead() {
      const pane = $("cf-read"), keys = threads()[open];
      if (!keys) { open = ""; const n = document.createElement("p"); n.className = "cf-note"; n.textContent = "Pick a message to read it."; pane.replaceChildren(n); $("cf-app").classList.remove("reading"); return; }
      keys.forEach(markRead);                       // a reply landing in the open thread counts as read
      const back = document.createElement("button");
      back.type = "button"; back.className = "cf-back"; back.textContent = "← Back";
      back.addEventListener("click", () => $("cf-app").classList.remove("reading"));
      const lastKey = keys[keys.length - 1], first = posts[keys[0]] || {};
      const subject = document.createElement("h2"); subject.className = "cf-subject"; subject.textContent = String(first.subject || "(no subject)");
      const acts = document.createElement("div"); acts.className = "cf-actions";
      const rep = document.createElement("button"); rep.type = "button"; rep.textContent = "↩ Reply";
      rep.addEventListener("click", () => compose(lastKey, posts[lastKey] || {}));
      acts.append(rep);
      pane.replaceChildren(back, subject, ...keys.map(message), acts);
      pane.scrollTop = pane.scrollHeight;           // newest message at the bottom, in view
    }

    const keepText = d => Number(d) > 0 ? `Messages and their files delete themselves after ${Number(d)} days.` : "Messages are kept until someone deletes them.";
    function keepNote() { $("cf-keepnote").textContent = settings.retainDays === undefined ? "" : ` ${keepText(settings.retainDays)}`; }

    function renderSettings() {
      const pane = $("cf-read");
      const back = document.createElement("button");
      back.type = "button"; back.className = "cf-back"; back.textContent = "← Back";
      back.addEventListener("click", () => { inSettings = false; $("cf-app").classList.remove("reading"); });
      const h = document.createElement("h2"); h.className = "cf-subject"; h.textContent = "Settings";
      const who = document.createElement("div"); who.className = "cf-meta"; who.textContent = `Signed in as ${nameOf(me.uid) || me.email || "you"}`;
      const owner = settings.sharedBy === me.uid;
      const label = document.createElement("label"); label.className = "cf-setting"; label.textContent = "Keep messages for";
      const sel = document.createElement("select"); sel.id = "cf-keep"; sel.disabled = !owner;
      [[7, "7 days"], [30, "30 days"], [90, "90 days"], [0, "Forever"]].forEach(([v, t]) => { const o = document.createElement("option"); o.value = v; o.textContent = t; sel.append(o); });
      sel.value = String(Number(settings.retainDays) || 0);
      const note = document.createElement("div"); note.className = "cf-meta";
      note.textContent = `${keepText(settings.retainDays)} This applies to everyone.${owner ? "" : " Only Luis can change it."}`;
      sel.addEventListener("change", async () => {
        try { await set(ref(database, SETTINGS), { sharedBy: me.uid, retainDays: Number(sel.value), updatedAt: Date.now() }); }
        catch (e) { note.textContent = "Could not save: " + e.message; }
      });
      label.append(sel);
      const mark = document.createElement("button"); mark.type = "button"; mark.className = "cf-setting-btn"; mark.textContent = "Mark everything as read";
      mark.addEventListener("click", () => { Object.keys(posts).forEach(markRead); renderList(); mark.textContent = "All marked as read"; });
      pane.replaceChildren(back, h, who, label, note, mark);
    }

    function deleteButton(k, p) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "cf-del"; b.textContent = "Delete";
      let timer = 0;
      b.addEventListener("click", async () => {
        if (!b.classList.contains("armed")) {      // two taps: the first only arms it
          b.classList.add("armed"); b.textContent = "Tap again to delete";
          timer = setTimeout(() => { b.classList.remove("armed"); b.textContent = "Delete"; }, 4000);
          return;
        }
        clearTimeout(timer);
        try {
          await remove(ref(database, `${NODE}/${k}`));
          const mine = filesOf(p).flatMap(f => Array.isArray(f.parts) ? f.parts : [f]).filter(f => String(f.path || "").startsWith(`${me.uid}/`));
          await Promise.allSettled(mine.map(f => deleteObject(storageRef(storage, f.path))));
        } catch (e) { b.textContent = "Delete failed: " + e.message; }
      });
      return b;
    }

    async function upload(file, stamp) {
      const safe = String(file.name || "file").replace(/[^\w.\-]+/g, "_").slice(-80);
      const path = `${me.uid}/console/attach/campfire/${stamp}_${safe}`;
      const type = file.type || "application/octet-stream";
      const put = async (blob, p) => { const r = storageRef(storage, p); await uploadBytes(r, blob, { contentType: "application/octet-stream" }); return { url: await getDownloadURL(r), path: p }; };
      if (file.size > PART_BYTES) {
        const parts = [], n = Math.ceil(file.size / PART_BYTES);
        for (let i = 0; i < n; i++) {
          $("cf-post").textContent = `Uploading ${String(file.name || safe).slice(0, 24)}: part ${i + 1} of ${n}…`;
          parts.push(await put(file.slice(i * PART_BYTES, (i + 1) * PART_BYTES), `${path}.part${i + 1}`));
        }
        return { name: String(file.name || safe), type, size: file.size, parts };
      }
      const r = storageRef(storage, path);
      await uploadBytes(r, file, { contentType: type });
      return { name: String(file.name || safe), url: await getDownloadURL(r), type, size: file.size, path };
    }

    function compose(key, p) {
      replyTo = key || "";
      $("cf-compose").reset();
      $("cf-picked").textContent = ""; $("cf-err").textContent = ""; $("cf-count").textContent = "0 / 4000";
      $("cf-compose-title").textContent = key ? "Reply" : "New message";
      if (key) {
        const s = String(p.subject || "");
        $("cf-subject").value = /^re:/i.test(s) ? s : `Re: ${s}`.slice(0, 120);
        if ([...$("cf-to").options].some(o => o.value === p.to)) $("cf-to").value = p.to;   // a reply keeps its audience
      }
      $("cf-compose").hidden = false;
      $(key ? "cf-body" : "cf-subject").focus();
    }

    document.querySelectorAll(".cf-folder").forEach(b => b.addEventListener("click", () => {
      folder = b.dataset.folder;
      document.querySelectorAll(".cf-folder").forEach(x => x.classList.toggle("on", x === b));
      renderList();
    }));
    $("cf-settings").addEventListener("click", () => { inSettings = true; open = ""; renderList(); renderSettings(); $("cf-app").classList.add("reading"); });
    $("cf-search").addEventListener("input", renderList);
    $("cf-new").addEventListener("click", () => compose());
    $("cf-close").addEventListener("click", () => { $("cf-compose").hidden = true; });
    $("cf-body").addEventListener("input", () => { $("cf-count").textContent = `${$("cf-body").value.length} / 4000`; });
    $("cf-files").addEventListener("change", () => {
      const list = [...$("cf-files").files];
      $("cf-err").textContent = list.length > MAX_FILES ? `Up to ${MAX_FILES} files per message.` :
        list.some(f => f.size > MAX_BYTES) ? "Each file has to be 200 MB or smaller." : "";
      $("cf-picked").textContent = list.map(f => `${f.name} (${sizeText(f.size)})`).join(", ");
    });

    $("cf-compose").addEventListener("submit", async e => {
      e.preventDefault();
      if (!me) return;
      const subject = $("cf-subject").value.trim(), body = $("cf-body").value.trim();
      if (!subject || !body) return;
      const picked = [...$("cf-files").files];
      if (picked.length > MAX_FILES || picked.some(f => f.size > MAX_BYTES)) {
        $("cf-err").textContent = `Up to ${MAX_FILES} files, 200 MB each.`;
        return;
      }
      const btn = $("cf-post"), ts = Date.now();
      btn.disabled = true; $("cf-err").textContent = "";
      if (picked.length) btn.textContent = "Uploading…";
      try {
        const files = await Promise.all(picked.map((f, i) => upload(f, `${ts}_${i}`)));
        const rec = {
          sharedBy: me.uid, from: nameOf(me.uid) || me.displayName || me.email || "Unknown",
          to: $("cf-to").value, subject, body, ts,
          ...(files.length ? { files } : {}), ...(replyTo ? { replyTo } : {})
        };
        // one write: the post and this account's rate mark, or the rules refuse it (one post per 10 seconds)
        await update(ref(database), { [`${NODE}/${ts}`]: rec, [`share/rate/${me.uid}`]: { ".sv": "timestamp" } });
        $("cf-compose").hidden = true;
      } catch (err) { $("cf-err").textContent = /permission/i.test(err.message) ? "Please wait 10 seconds between messages, then send again." : "Send failed: " + err.message; }
      btn.disabled = false; btn.textContent = "Send";
    });
  </script>
</body>
