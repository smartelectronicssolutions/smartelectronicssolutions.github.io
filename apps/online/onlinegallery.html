<!DOCTYPE html>
<html lang="en">

<head>
  <script>(function(){try{if(localStorage.getItem("ss-theme")==="light")document.documentElement.classList.add("light")}catch(e){}})();</script>  <!-- saved light/dark before first paint (2026-10-01) -->
    <meta charset="UTF-8">
    <title>Photo Upload & Show</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="../assets/css/online.css">
    <script type="module" src="../assets/js/auth.js"></script>
    <script src="../assets/js/links-aside.js" defer></script>
    <style>
        /* ---- Upload / show sections: centered form layout ---- */
        main { max-width: 720px; margin: 0 auto; padding: 16px; }
        #uploadSection, #showSection {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 460px;
            margin: 0 auto;
            padding: 16px 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius, 8px);
        }
        #uploadSection label, #showSection label {
            display: block;
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 2px;
        }
        #uploadSection input[type="text"],
        #uploadSection input[type="file"],
        #showSection select {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: var(--bg);
            color: var(--text);
            font-size: 16px;
            font-family: inherit;
        }
        #uploadSection .row,
        #uploadSection .button-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        #uploadSection button { flex: 0 0 auto; }
        /* Hide the stray <br>s coming from the source markup */
        #uploadSection br, #showSection br { display: none; }
        #uploadSection .check-row {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.85rem; color: var(--muted);
        }
        main > h1 { text-align: center; }

        /* ---- Modal markup edit/remove section ---- */
        #markup-edit-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #markup-edit-section .label {
            font-size: 0.78rem; color: var(--muted);
            text-transform: uppercase; letter-spacing: 1px;
        }
        #markup-edit-section input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-size: 16px;
        }
        #markup-edit-section .button-row {
            display: flex; gap: 8px; flex-wrap: wrap;
        }
        #markup-edit-section button { flex: 1 1 auto; }
        #markup-edit-section .danger-btn {
            background: var(--danger); color: var(--on-primary); border: 0;
            padding: 8px 12px; border-radius: 5px; cursor: pointer;
        }
        #markup-edit-section .danger-btn:hover { background: var(--danger); opacity: 0.85; }

        .thumbnail {
            max-width: 150px;
            cursor: pointer;
            border-radius: 15px;
            transition: transform 0.2s;
            width: 100%;
        }

        .thumbnail:hover {
            transform: scale(1.1);
        }

        .thumbnailItem {
            position: relative;
            text-align: center;
            margin: 5px;
        }

        #gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            justify-content: center;
        }

        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--scrim);
            justify-content: center;
            align-items: center;
        }

        #modalContent {
            position: relative;
            background: var(--surface);
            padding: 10px;
            border-radius: 5px;
        }

        #modalImage {
            max-width: 90vw;
            max-height: 80vh;
            display: block;
            margin-bottom: 10px;
        }

        #modalFileName {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }

        .favorite-star {
            cursor: pointer;
            font-size: 20px;
            user-select: none;
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: color-mix(in srgb, var(--surface) 70%, transparent);
            width: 30px;
            border-radius: 50%;
        }

        .favorite-star:hover {
            background-color: var(--primary);
            color: var(--on-primary);
        }

        .favorite-star.favorited {
            color: var(--warn);
        }

        @media (max-width: 439px) {
            .thumbnail {
                max-width: 145px;
            }
        }

        #loadingOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--scrim);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: var(--text);
            font-size: 18px;
        }

        .spinner {
            border: 6px solid var(--muted);
            border-top: 6px solid var(--primary);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <header>
    <div class="logo-box"><a href="../../index.html" title="Home"><img src="../../assets/img/android-chrome-192x192.png" alt="Home" style="height:40px;vertical-align:middle;"></a></div>
        <h1>Photo Gallery</h1>
        <div class="auth-bar"><span id="auth-label">Not signed in</span><button id="auth-btn">Sign In</button></div>
        <button id="theme-toggle" title="Toggle theme">☀️</button>
        <script>(function () { var b = document.getElementById("theme-toggle"), h = document.documentElement; b.textContent = h.classList.contains("light") ? "🌙" : "☀️"; b.addEventListener("click", function () { var n = h.classList.contains("light") ? "dark" : "light"; h.classList.toggle("light", n === "light"); localStorage.setItem("ss-theme", n); b.textContent = n === "light" ? "🌙" : "☀️"; }); })();</script>
        <div id="login-inline">
            <h3>Sign In</h3><input type="email" id="email-in" placeholder="Email" /><input type="password" id="pass-in"
                placeholder="Password" /><button id="do-login">Sign In</button>
            <p id="auth-err"></p>
        </div>
    </header>
    <main>

        <h1>Photo Upload</h1>
        <div id="uploadSection">
            <div>
                <label for="fileUploader">Choose an image</label>
                <input type="file" id="fileUploader" accept="image/*">
            </div>
            <div>
                <label for="imageNameInput">Image Name</label>
                <input type="text" id="imageNameInput" placeholder="Enter image name">
            </div>
            <div>
                <label for="imageLabel">Folder Name</label>
                <input type="text" id="imageLabel" placeholder="Enter folder label">
            </div>
            <div>
                <label for="markupTextInput">Markup Text (optional)</label>
                <input type="text" id="markupTextInput" placeholder="Burned into the bottom of the image">
            </div>
            <!-- (the "center the markup" option is gone 2026-10-04 - the shared bar is the one rule) -->
            <label class="check-row" hidden>
            </label>
            <div class="button-row">
                <button id="uploadButton">Upload Image</button>
                <button id="clearFields" style="display: none;">Clear</button>
            </div>
        </div>

        <hr>

        <h1>Show Images</h1>
        <div id="showSection">
            <label for="folderDropdown">Select a Site:</label>
            <select id="folderDropdown">
                <option value="">-- Select a Site --</option>
            </select>
            <label for="imageDropdown">Select an Image:</label>
            <select id="imageDropdown">
                <option value="">-- Select an Image --</option>
            </select>

            <div id="gallery"></div>

        </div>

    </main>

    <div id="modal">
        <div id="modalContent">
            <img id="modalImage" style="margin: 0 auto;" src="" alt="Large View">
            <p id="modalFileName"></p>
            <button id="downloadButton">Download</button>
            <button id="deleteButton" class="clear-button">Delete</button>
            <button id="closeModalButton">Close</button>
            <button id="moveButton">Move Photo</button>
            <br>
            <label for="moveToFolder">To Folder:</label>
            <select id="moveToFolder"></select>

            <div id="markup-edit-section">
                <span class="label">Markup tools</span>
                <input type="text" id="editMarkupInput" placeholder="Add or replace markup text…">
                <div class="button-row">
                    <button id="applyMarkupButton">Apply / Replace Markup</button>
                    <button id="removeMarkupButton" class="danger-btn">Remove Markup</button>
                </div>
            </div>

            <div id="modalNavLeft" style="position:absolute;top:0;left:0;width:40%;height:80%;cursor:pointer;"></div>
            <div id="modalNavRight" style="position:absolute;top:0;right:0;width:40%;height:80%;cursor:pointer;"></div>

        </div>
    </div>

    <script type="module">
        import {
            storage, storageRef, uploadBytesResumable, getDownloadURL,
            listAll, deleteObject, onAuthStateChanged, auth,
            getBlob, uploadBytes, database, get, ref, set
        } from '../assets/js/firebase-init.js';
    // base override (2026-10-04): the Louverse board opens this app on the tree it is reading (?base=<uid>) - local helper, not an import (a cached firebase-init would lack it)
    const basePathFor = u => { let b = ""; try { b = new URLSearchParams(location.search).get("base") || ""; } catch (_) {} return (u && /^[A-Za-z0-9_-]{6,64}$/.test(b)) ? b : (u ? u.uid : "public"); };
        import { resizeImg, stampImg, unstampImg, thumbOf, forgetThumb } from '../assets/js/imgupload.js?v=20261004c';   // THE photo rules - one copy for every app (2026-10-03); + unstamp / thumbs (2026-10-04)

        /* ===============================
           GLOBAL STATE
        ================================ */
        let DATABASE_BASE_PATH = 'public';
        let currentImages = [];
        let currentIndex = -1;
        let currentFolderLoadToken = 0;

        /* ===============================
           DOM REFERENCES
        ================================ */
        const fileUploader = document.getElementById('fileUploader');
        const imageLabel = document.getElementById('imageLabel');
        const imageNameInput = document.getElementById('imageNameInput');
        const markupTextInput = document.getElementById('markupTextInput');
        const uploadButton = document.getElementById('uploadButton');
        const folderDropdown = document.getElementById('folderDropdown');
        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('modal');
        const modalImage = document.getElementById('modalImage');
        const modalFileName = document.getElementById('modalFileName');
        const downloadButton = document.getElementById('downloadButton');
        const deleteButton = document.getElementById('deleteButton');
        const closeModalButton = document.getElementById('closeModalButton');
        const moveButton = document.getElementById('moveButton');
        const moveToFolder = document.getElementById('moveToFolder');
        const imageDropdown = document.getElementById('imageDropdown');

        /* ===============================
           LOADING OVERLAY
        ================================ */
        const loadingOverlay = document.createElement("div");
        loadingOverlay.id = "loadingOverlay";
        loadingOverlay.innerHTML = `
            <div class="spinner"></div>
            <p id="loadingText">Loading...</p>
        `;
        document.body.appendChild(loadingOverlay);

        const loadingText = loadingOverlay.querySelector("#loadingText");

        function showLoading(text = "Loading...") {
            loadingText.textContent = text;
            loadingOverlay.style.display = "flex";
        }

        function hideLoading() {
            loadingOverlay.style.display = "none";
        }

        modal.addEventListener('click', (event) => {
            // Only close if clicking the dark background
            if (event.target === modal) {
                modal.style.display = "none";
            }
        });

        const modalNavLeft = document.getElementById('modalNavLeft');
        const modalNavRight = document.getElementById('modalNavRight');

        modalNavLeft.addEventListener('click', () => {
            if (currentIndex > 0) {
                const prev = currentImages[currentIndex - 1];
                openModal(prev);
            }
        });

        modalNavRight.addEventListener('click', () => {
            if (currentIndex < currentImages.length - 1) {
                const next = currentImages[currentIndex + 1];
                openModal(next);
            }
        });

        document.addEventListener('keydown', (e) => {
            if (modal.style.display !== "flex") return;

            if (e.key === "ArrowLeft" && currentIndex > 0) {
                const prev = currentImages[currentIndex - 1];
                openModal(prev);
            }

            if (e.key === "ArrowRight" && currentIndex < currentImages.length - 1) {
                const next = currentImages[currentIndex + 1];
                openModal(next);
            }

            if (e.key === "Escape") {
                modal.style.display = "none";
            }
        });

        /* ===============================
           AUTH
        ================================ */
        onAuthStateChanged(auth, async (user) => {
            DATABASE_BASE_PATH = user ? basePathFor(user) : 'public';
            tasksCache = null;
            await loadFolderOptions();
            // ?task=<id> (the Louverse Photos tile): open on that visit's project folder - onlinejob's folder rule (spaces -> _)
            const taskId = new URLSearchParams(location.search).get("task");
            if (taskId) { try { const t = (await get(ref(database, `${DATABASE_BASE_PATH}/tasks/${taskId}`))).val(); const folder = String(t?.project || t?.customerName || "").trim().replace(/\s+/g, "_");
                if (folder && [...folderDropdown.options].some(o => o.value === folder)) { showLoading("Loading images..."); await loadImages(folder); hideLoading(); } } catch (e) { console.warn("[gallery] task folder", e?.code || e); } }
        });

        /* ===============================
           UTILITIES
        ================================ */
        function sanitizeInput(input) {
            return input.trim().replace(/\s+/g, "_").replace(/[^\w-]/gi, "");
        }
        /* ===============================
           THE RECORDS BEHIND A PHOTO (2026-10-04, delete-where-added): a device-row or daily-row photo is also an entry in
           tasks/<id>/lists/<list>/<row>/images[] or tasks/<id>/tasks/<date>/images[] ({url, path, note, markup}). Every
           file change here patches those entries too, so the Jobs / Details apps never show a dead thumbnail.
        ================================ */
        let tasksCache = null;
        async function allTasks(fresh) { if (tasksCache && !fresh) return tasksCache; try { const snap = await get(ref(database, `${DATABASE_BASE_PATH}/tasks`)); tasksCache = snap.val() || {}; } catch (e) { console.warn("[gallery] tasks read", e?.code || e); tasksCache = {}; } return tasksCache; }
        const imgsOf = r => Array.isArray(r?.images) ? r.images : Object.values(r?.images || {});
        async function recordRefs(path, fresh) {
            const tasks = await allTasks(fresh), hits = [];
            for (const [tid, t] of Object.entries(tasks)) { if (!t || typeof t !== "object") continue;
                for (const [lid, l] of Object.entries(t.lists || {})) { if (!l || typeof l !== "object") continue;
                    for (const [rid, r] of Object.entries(l)) { if (["_name", "createdAt", "meta", "items"].includes(rid) || !r || typeof r !== "object") continue;
                        const imgs = imgsOf(r); imgs.forEach((im, i) => { if (im && im.path === path) hits.push({ taskId: tid, kind: "device", label: `${l._name || lid} · ${r.id || r.label || rid}`, node: `${DATABASE_BASE_PATH}/tasks/${tid}/lists/${lid}/${rid}/images`, idx: i, images: imgs, entry: im }); }); } }
                for (const [date, d] of Object.entries(t.tasks || {})) { const imgs = imgsOf(d); imgs.forEach((im, i) => { if (im && im.path === path) hits.push({ taskId: tid, kind: "daily", label: `daily ${date}`, node: `${DATABASE_BASE_PATH}/tasks/${tid}/tasks/${date}/images`, idx: i, images: imgs, entry: im }); }); } }
            return hits;
        }
        // patch = fields to merge into the entry; null = remove the entry
        async function syncRecords(path, patch) {
            const hits = await recordRefs(path, true);
            for (const h of hits) { const next = patch ? h.images.map((im, i) => i === h.idx ? { ...im, ...patch } : im) : h.images.filter((_, i) => i !== h.idx); await set(ref(database, h.node), next); }
            if (hits.length) tasksCache = null;
            return hits;
        }
        const bust = u => u + (u.includes("?") ? "&" : "?") + "v=" + Date.now();

        imageDropdown.addEventListener('change', () => {
            const selectedOption = imageDropdown.options[imageDropdown.selectedIndex];
            const imageUrl = selectedOption.value;
            const fullPath = selectedOption.dataset.fullPath;
            const fileName = selectedOption.textContent;

            if (!imageUrl || !fullPath) return;

            openModal({
                url: imageUrl,
                fullPath: fullPath,
                name: fileName
            });
        });
        /* ===============================
           IMAGE RESIZE + LABEL BAR - one copy for every app in ../assets/js/imgupload.js (2026-10-03).
           The 12%-tall bar is gone; the strip is the jobs app's max(40, width/22), so it crops cleanly there.
        ================================ */
        const resizeImage = (file, maxWidth) => resizeImg(file, maxWidth);
        const addTextToImage = stampImg;

        /* ===============================
           UPLOAD IMAGE
        ================================ */
        uploadButton.addEventListener("click", async () => {

            const files = fileUploader.files;
            if (!files.length) return alert("Select an image.");

            showLoading("Uploading image...");

            try {
                const file = files[0];

                // 🔥 PRIORITY LOGIC
                const typedFolder = sanitizeInput(imageLabel.value);
                const selectedFolder = folderDropdown.value;

                const folder = typedFolder || selectedFolder || "default";

                let imageName = sanitizeInput(imageNameInput.value) ||
                    file.name.split('.').slice(0, -1).join('_');

                const markupText = markupTextInput.value.trim();
                // the blob below is a JPEG whatever came in - the file is named .jpg (the rule everywhere else)
                let finalFileName = `${imageName}.jpg`;
                const folderPath = `${DATABASE_BASE_PATH}/tasks/images/${folder}`;

                const existingFiles = await listAll(storageRef(storage, folderPath));
                const existingNames = new Set(existingFiles.items.map(i => i.name));

                let counter = 2;   // onlinejob's collision rule: name.jpg, name_2.jpg, name_3.jpg ...
                while (existingNames.has(finalFileName)) {
                    finalFileName = `${imageName}_${counter++}.jpg`;
                }

                let blob = await resizeImage(file, 2048);
                if (markupText) blob = await addTextToImage(blob, markupText);

                await uploadBytes(
                    storageRef(storage, `${folderPath}/${finalFileName}`),
                    blob
                );

                alert(`Uploaded to folder: ${folder}`);

                // 🔥 AUTO NAVIGATE TO THAT FOLDER
                await loadFolderOptions();

                folderDropdown.value = folder;
                await loadImages(folder);

            } catch (err) {
                console.error(err);
                alert("Upload failed.");
            } finally {
                hideLoading();
                fileUploader.value = "";
                imageNameInput.value = "";
                markupTextInput.value = "";
                imageLabel.value = "";
            }
        });

        /* ===============================
           LOAD FOLDERS
        ================================ */
        async function loadFolderOptions() {
            folderDropdown.innerHTML = '<option value="">-- Select --</option>';
            moveToFolder.innerHTML = '<option value="">-- Select Destination --</option>';

            const baseRef = storageRef(storage, `${DATABASE_BASE_PATH}/tasks/images`);

            try {
                const snapshot = await listAll(baseRef);

                snapshot.prefixes.forEach(folder => {
                    const option1 = document.createElement('option');
                    option1.value = folder.name;
                    option1.textContent = folder.name;
                    folderDropdown.appendChild(option1);

                    const option2 = document.createElement('option');
                    option2.value = folder.name;
                    option2.textContent = folder.name;
                    moveToFolder.appendChild(option2);
                });

            } catch (err) {
                console.error("Folder load error:", err);
            }
        }
        /* ===============================
           LOAD IMAGES
        ================================ */
        folderDropdown.addEventListener("change", async () => {
            const selected = folderDropdown.value;
            if (!selected) return;

            showLoading("Loading images...");

            // Make sure dropdown truly holds value
            folderDropdown.value = selected;

            await loadImages(selected);

            hideLoading();
        });

        async function loadImages(folder) {
            folderDropdown.value = folder;
            gallery.innerHTML = '';
            currentImages = [];

            const basePath = `${DATABASE_BASE_PATH}/tasks/images/${folder}`;
            const baseRef = storageRef(storage, basePath);

            const baseSnapshot = await listAll(baseRef);

            // Collect all storage items: root folder + subfolders (subfolder listings in parallel)
            const allItems = [...baseSnapshot.items];
            const subSnaps = await Promise.all(baseSnapshot.prefixes.map(p => listAll(p)));
            for (const subSnap of subSnaps) {
                allItems.push(...subSnap.items);
            }

            // photos only - the .keep / .init.txt folder markers live in the same folders (2026-10-04)
            const photoItems = allItems.filter(item => /\.(jpe?g|png|webp|gif|heic|bmp)$/i.test(item.name));
            // Resolve all download URLs in parallel
            currentImages = await Promise.all(photoItems.map(async (item) => ({
                url: await getDownloadURL(item),
                fullPath: item.fullPath,
                name: item.name
            })));

            renderImages();
        }

        moveButton.addEventListener('click', async () => {
            const fullPath = modal.dataset.fullPath;
            const toFolder = moveToFolder.value;

            if (!fullPath) {
                alert("No image selected.");
                return;
            }

            if (!toFolder) {
                alert("Select a destination folder.");
                return;
            }

            const fileName = fullPath.split('/').pop();

            showLoading("Moving image...");

            try {
                const fromRef = storageRef(storage, fullPath);
                const blob = await getBlob(fromRef);

                const newPath = `${DATABASE_BASE_PATH}/tasks/images/${toFolder}/${fileName}`;
                const toRef = storageRef(storage, newPath);

                await uploadBytes(toRef, blob);
                const movedUrl = bust(await getDownloadURL(toRef));
                const hits = await syncRecords(fullPath, { path: newPath, url: movedUrl });   // the device / daily rows follow the file
                await deleteObject(fromRef); forgetThumb({ path: fullPath });

                alert(`Moved "${fileName}" to "${toFolder}"${hits.length ? ` (+ ${hits.length} record${hits.length === 1 ? "" : "s"} updated)` : ""}`);

                modal.style.display = "none";
                await loadImages(folderDropdown.value);

            } catch (error) {
                console.error("Move failed:", error);
                alert("Failed to move image.");
            } finally {
                hideLoading();
            }
        });
        function renderImages() {
            gallery.innerHTML = '';
            imageDropdown.innerHTML = '<option value="">-- Select --</option>';

            currentImages.forEach(item => {
                const img = document.createElement('img');
                img.className = "thumbnail"; img.alt = item.name; img.decoding = "async";
                thumbOf(item, 256).then(u => { if (img.isConnected && u) img.src = u; });   // a cached 256-px thumb, not the 2048-px original (the lag fix from the board)
                img.onclick = () => openModal(item);
                gallery.appendChild(img);

                const option = document.createElement('option');
                option.value = item.url;
                option.textContent = item.name;
                option.dataset.fullPath = item.fullPath;
                imageDropdown.appendChild(option);
            });
        }

        /* ===============================
           MODAL
        ================================ */
        function openModal(item) {
            modal.style.display = "flex";
            modalImage.src = item.url;
            modal.dataset.fullPath = item.fullPath;

            // Show file name
            modalFileName.textContent = item.name;

            currentIndex = currentImages.findIndex(
                i => i.fullPath === item.fullPath
            );
            // the record behind it (device / daily row): its note and label, editable here too
            noteRow.hidden = true; noteInput.value = ""; editMarkupInput.value = ""; modal.dataset.recordNote = "";
            recordRefs(item.fullPath).then(hits => { if (modal.dataset.fullPath !== item.fullPath) return; const h = hits[0]; if (!h) { noteWhere.textContent = "loose photo (storage only)"; noteRow.hidden = false; noteInput.disabled = true; return; }
                noteRow.hidden = false; noteInput.disabled = false; noteWhere.textContent = `${h.kind} photo · ${h.label}`; noteInput.value = h.entry.note || ""; editMarkupInput.value = h.entry.markup || ""; modal.dataset.recordNote = h.entry.note || ""; });
        }
        const noteRow = document.createElement("div"); noteRow.id = "noteRow"; noteRow.hidden = true; noteRow.style.cssText = "margin:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap";
        noteRow.innerHTML = `<span id="noteWhere" style="font-size:.8em;opacity:.75"></span><input id="noteInput" placeholder="note" style="flex:1;min-width:160px">`;
        document.getElementById("markup-edit-section").before(noteRow);
        const noteWhere = noteRow.querySelector("#noteWhere"), noteInput = noteRow.querySelector("#noteInput");
        noteInput.addEventListener("change", async () => { const path = modal.dataset.fullPath, note = noteInput.value.trim(); if (!path || note === (modal.dataset.recordNote || "")) return; try { await syncRecords(path, { note }); modal.dataset.recordNote = note; } catch (e) { alert("Note not saved: " + (e?.message || e)); } });

        closeModalButton.onclick = () => modal.style.display = "none";

        deleteButton.onclick = async () => {
            if (!confirm("Delete this image?")) return;
            showLoading("Deleting...");
            try {
                const hits = await syncRecords(modal.dataset.fullPath, null);   // delete-where-added: the device / daily row loses its entry too
                await deleteObject(storageRef(storage, modal.dataset.fullPath)); forgetThumb({ path: modal.dataset.fullPath });
                if (hits.length) console.info("[gallery] removed from", hits.map(h => h.label).join(", "));
                modal.style.display = "none";
                await loadImages(folderDropdown.value);
            } finally {
                hideLoading();
            }
        };

        /* ===============================
           APPLY / REMOVE MARKUP ON EXISTING IMAGE
           (DOM elements live in the modal — see #markup-edit-section)
        ================================ */
        const editMarkupInput   = document.getElementById("editMarkupInput");
        const applyMarkupButton = document.getElementById("applyMarkupButton");
        const removeMarkupButton = document.getElementById("removeMarkupButton");

        applyMarkupButton.onclick = async () => {
            const text = editMarkupInput.value.trim();
            if (!text) return alert("Enter markup text.");

            showLoading("Applying markup...");
            try {
                const refImage = storageRef(storage, modal.dataset.fullPath);
                const blob = await getBlob(refImage);
                const newBlob = await addTextToImage(blob, text);
                await uploadBytes(refImage, newBlob, { contentType: "image/jpeg" });
                await syncRecords(modal.dataset.fullPath, { url: bust(await getDownloadURL(refImage)), markup: text }); forgetThumb({ path: modal.dataset.fullPath });
                modal.style.display = "none";
                await loadImages(folderDropdown.value);
            } finally {
                hideLoading();
            }
        };

        removeMarkupButton.onclick = async () => {

            if (!modal.dataset.fullPath) {
                alert("No image selected.");
                return;
            }

            if (!confirm("Remove markup from this image?")) return;

            showLoading("Removing markup...");

            try {
                const imageRef = storageRef(storage, modal.dataset.fullPath);
                const blob = await getBlob(imageRef);

                const croppedBlob = await unstampImg(blob);   // the shared strip (max(40, width/22)) - the same bar stampImg put on, no more 12% guess
                await uploadBytes(imageRef, croppedBlob, { contentType: "image/jpeg" });
                await syncRecords(modal.dataset.fullPath, { url: bust(await getDownloadURL(imageRef)), markup: "" }); forgetThumb({ path: modal.dataset.fullPath });

                modal.style.display = "none";
                await loadImages(folderDropdown.value);

            } catch (err) {
                console.error("Remove markup failed:", err);
                alert(err?.message || "Failed to remove markup.");
            } finally {
                hideLoading();
            }
        };
    </script>
    <script src="../assets/js/reveal.js?v=4" defer></script>
</body>
