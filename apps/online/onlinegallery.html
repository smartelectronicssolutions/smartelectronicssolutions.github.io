  <script>(function(){try{if(localStorage.getItem("ss-theme")==="light")document.documentElement.classList.add("light")}catch(e){}})();</script>  <!-- saved light/dark before first paint (2026-10-01) -->
    <meta charset="UTF-8">

    <style>
        /* PHOTOS APP v2 (2026-10-04, L: "update this app, get all the newer features, better layout for desktop. Labels, edit,
           resize options. In the dropdown show more than project"): two panes on a desktop - folders + upload on the left, the
           grid on the right - one column on a phone. Same storage layout ({base}/tasks/images/<folder>[/<sub>]) and the same
           photo rules as every other app (imgupload.js); the records behind a photo (device / daily rows) stay in sync. */
        :root { --cell: 160px; }
        [hidden] { display: none !important; }   /* the author display rules below would otherwise beat the hidden attribute */
        main.gal { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 14px; padding: 12px 14px; align-items: start; max-width: 1600px; margin: 0 auto; box-sizing: border-box; }
        .side { position: sticky; top: 10px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 20px); min-height: 0; }
        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
        .panel h2 { margin: 0; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: inline; }
        .panel label { display: flex; flex-direction: column; gap: 2px; font-size: .76rem; color: var(--muted); min-width: 0; }
        .panel input[type=text], .panel input[type=search], .panel select { width: 100%; box-sizing: border-box; padding: 7px 9px; border-radius: 6px; font-size: 16px; background: var(--bg); }
        .panel input[type=file] { font-size: .85rem; max-width: 100%; }
        .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .row > * { flex: 1 1 auto; min-width: 0; }
        .two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        #foldersPanel { flex: 1 1 auto; min-height: 160px; }
        #folderList { overflow: auto; flex: 1 1 auto; min-height: 100px; display: flex; flex-direction: column; gap: 2px; }
        .fo { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
        .fo:hover { background: var(--hover); }
        .fo.on { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 14%, transparent); }
        .fo .n { font-weight: 600; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .fo .c { font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
        .fo .s { grid-column: 1 / -1; font-size: .74rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #folderDropdown { display: none; }
        .muted { color: var(--muted); font-size: .8rem; }
        details.up summary { cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: baseline; }
        details.up summary::-webkit-details-marker { display: none; }
        details.up summary::after { content: "▾"; margin-left: auto; color: var(--muted); } details.up:not([open]) summary::after { content: "▸"; }
        .content { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 60vh; border-radius: 8px; }
        .content.drop { outline: 2px dashed var(--primary); outline-offset: -3px; background: color-mix(in srgb, var(--primary) 8%, transparent); }
        .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .bar h2 { margin: 0; font-size: 1.05rem; flex: 1 1 160px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bar input[type=search] { padding: 6px 9px; border-radius: 6px; font-size: 16px; min-width: 150px; flex: 1 1 150px; max-width: 300px; }
        .bar select { padding: 6px 8px; border-radius: 6px; }
        .bar button.on { outline: 2px solid var(--accent); }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 3px 10px; font-size: .82rem; }
        .chip.on { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 16%, transparent); font-weight: 600; }
        .labelbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; position: sticky; top: 0; z-index: 5; }
        .labelbar input { flex: 1 1 160px; padding: 6px 9px; border-radius: 6px; font-size: 16px; min-width: 0; }
        .labelbar .n { font-size: .82rem; color: var(--muted); white-space: nowrap; }
        #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell), 1fr)); gap: 8px; }
        figure.ph { position: relative; margin: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        figure.ph.sel { outline: 2px solid var(--primary); outline-offset: -2px; }
        figure.ph img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; background: var(--surface2); }   /* contain, not cover: the whole photo shows (L 2026-10-05 "some cutoff on the top and bottom") */
        figure.ph img:not([src]) { animation: shimmer 1.4s linear infinite; background: linear-gradient(100deg, var(--surface2) 40%, var(--hover) 50%, var(--surface2) 60%) 0 0 / 300% 100%; }
        @keyframes shimmer { to { background-position: -300% 0; } }
        figure.ph figcaption { padding: 4px 6px; font-size: .74rem; line-height: 1.3; }
        figure.ph .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        figure.ph .rc { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        figure.ph .rc.dev { color: var(--info); } figure.ph .rc.day { color: var(--ok); }
        figure.ph .tick { position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: color-mix(in srgb, var(--surface) 80%, transparent); border: 1px solid var(--border); display: grid; place-items: center; font-size: .8rem; opacity: 0; z-index: 2; }
        figure.ph:hover .tick, body.selecting figure.ph .tick, figure.ph.sel .tick { opacity: 1; }
        figure.ph.sel .tick { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
        figure.ph .lab { position: absolute; top: 4px; right: 4px; font-size: .7rem; padding: 1px 6px; border-radius: 999px; background: color-mix(in srgb, var(--surface) 85%, transparent); border: 1px solid var(--border); max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        /* the lightbox: the photo on a stage, the tools in a side panel (below it on a phone) */
        .lb { display: none; position: fixed; inset: 0; background: var(--scrim); z-index: 500; }
        .lb.open { display: grid; grid-template-columns: minmax(0, 1fr) 340px; }
        .lb .stage { position: relative; display: grid; place-items: center; min-width: 0; min-height: 0; }
        .lb .stage img { max-width: 100%; max-height: 100vh; object-fit: contain; }
        .lb .nav { position: absolute; top: 0; bottom: 0; width: 28%; cursor: pointer; } .lb .nav.l { left: 0; } .lb .nav.r { right: 0; }
        .lb .cnt { position: absolute; top: 8px; left: 8px; font-size: .78rem; color: #fff; background: rgba(0,0,0,.55); padding: 2px 8px; border-radius: 999px; }
        .lb .x { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; font-size: 1.05rem; padding: 0; }
        .lb .side2 { background: var(--surface); border-left: 1px solid var(--border); overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
        .lb .side2 h3 { margin: 0; font-size: .95rem; word-break: break-all; }
        .lb .side2 h4 { margin: 8px 0 0; font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
        .lb .side2 input, .lb .side2 select { width: 100%; box-sizing: border-box; padding: 7px 9px; border-radius: 6px; font-size: 16px; background: var(--bg); }
        .lb .side2 .row button { flex: 1 1 auto; }
        .lb .side2 .row select { flex: 2 1 120px; }
        #loadingOverlay { display: none; position: fixed; inset: 0; background: var(--scrim); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; color: #fff; font-size: 18px; }
        .spinner { border: 6px solid var(--muted); border-top: 6px solid var(--primary); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 899px) {
            main.gal { grid-template-columns: 1fr; padding: 10px; gap: 10px; }
            .side { position: static; max-height: none; }
            #foldersPanel { min-height: 0; } #folderList { display: none; } #folderDropdown { display: block; }
            .bar h2 { flex-basis: 100%; }
            .lb.open { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
            .lb .stage img { max-height: 52vh; }
            .lb .side2 { border-left: 0; border-top: 1px solid var(--border); max-height: 48vh; }
            .labelbar .n { flex-basis: 100%; }
        }
    </style>
</head>

    <script type="module">
        import {
            storage, storageRef, getDownloadURL, listAll, deleteObject, onAuthStateChanged, auth,
            getBlob, uploadBytes, database, get, ref, set, update
        } from '../assets/js/firebase-init.js';
        // base override (2026-10-04): the Louverse board opens this app on the tree it is reading (?base=<uid>) - local helper, not an import (a cached firebase-init would lack it)
        const basePathFor = u => { let b = ""; try { b = new URLSearchParams(location.search).get("base") || ""; } catch (_) {} return (u && /^[A-Za-z0-9_-]{6,64}$/.test(b)) ? b : (u ? u.uid : "public"); };
        import { resizeImg, stampImg, unstampImg, thumbOf, forgetThumb } from '../assets/js/imgupload.js?v=20261004c';   // THE photo rules - one copy for every app (2026-10-03); + unstamp / thumbs (2026-10-04)

        /* ===============================
           STATE
        ================================ */
        const $ = id => document.getElementById(id);
        const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        let BASE = "public", user = null;
        let folders = [];                 // [{ name, paths, meta }] - paths = storage dirs under BASE; meta from the tasks that use the folder (customer, project, dates, jobs)
        // SOURCES (L 2026-10-06 "see more than just the job app photos - ledger photos also"): Jobs = {base}/tasks/images/<job>;
        // Ledger = one folder per year from images/<yyyy> + txImages/<yyyy> (the ledger apps' receipt uploads) + gas/ (onlinegas).
        // A ledger photo's record is its ledger / gas row (img = url, imgPath = path) - every file change patches that row too.
        let SRC = (() => { try { return new URLSearchParams(location.search).get("src") || localStorage.getItem("gal-src") || "jobs"; } catch (_) { return "jobs"; } })();
        if (!["jobs", "ledger"].includes(SRC)) SRC = "jobs";
        const folderOf = name => folders.find(f => f.name === name);
        const dirOf = name => `${BASE}/${(folderOf(name)?.paths || [`tasks/images/${name}`])[0]}`;   // where an upload / move into that folder lands
        const cur = { folder: "", sub: "", q: "" };
        let photos = [];                  // [{ name, fullPath, sub, ref, url, rec }] for the open folder (+ its subfolders)
        const selected = new Set();       // fullPaths picked in the grid
        let loadToken = 0;
        const PHOTO_RE = /\.(jpe?g|png|webp|gif|heic|bmp)$/i;   // photos only - the .keep / .init.txt folder markers live in the same folders
        const sanitize = s => String(s || "").trim().replace(/\s+/g, "_").replace(/[^\w-]/gi, "");
        const bust = u => u + (u.includes("?") ? "&" : "?") + "v=" + Date.now();
        const byPath = p => photos.find(x => x.fullPath === p);
        const fmtD = iso => iso ? new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
        const fmtMY = iso => iso ? new Date(iso).toLocaleDateString(undefined, { month: "short", year: "numeric" }) : "";
        const natural = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });

        /* ===============================
           LOADING OVERLAY
        ================================ */
        const loadingOverlay = document.createElement("div"); loadingOverlay.id = "loadingOverlay";
        loadingOverlay.innerHTML = `<div class="spinner"></div><p id="loadingText">Loading...</p>`; document.body.appendChild(loadingOverlay);
        const loadingText = loadingOverlay.querySelector("#loadingText");
        function showLoading(text = "Loading...") { loadingText.textContent = text; loadingOverlay.style.display = "flex"; }
        function hideLoading() { loadingOverlay.style.display = "none"; }
        const status = t => { $("uploadStatus").textContent = t; };

        /* ===============================
           THE RECORDS BEHIND A PHOTO (2026-10-04, delete-where-added): a device-row or daily-row photo is also an entry in
           tasks/<id>/lists/<list>/<row>/images[] or tasks/<id>/tasks/<date>/images[] ({url, path, note, markup}). Every
           file change here patches those entries too, so the Jobs / Details apps never show a dead thumbnail. One index
           (path -> hits) per tasks read; the same read gives the folders their customer / project / dates.
        ================================ */
        let tasksCache = null, recIndex = null;
        const RESERVED = new Set(["_name", "createdAt", "meta", "items"]);
        const imgsOf = r => Array.isArray(r?.images) ? r.images : Object.values(r?.images || {});
        async function allTasks(fresh) { if (tasksCache && !fresh) return tasksCache; try { const snap = await get(ref(database, `${BASE}/tasks`)); tasksCache = snap.val() || {}; } catch (e) { console.warn("[gallery] tasks read", e?.code || e); tasksCache = {}; } recIndex = null; return tasksCache; }
        async function recordIndex(fresh) {
            if (recIndex && !fresh) return recIndex;
            const tasks = await allTasks(fresh), idx = new Map(), add = (path, hit) => { if (!path) return; if (!idx.has(path)) idx.set(path, []); idx.get(path).push(hit); };
            for (const [tid, t] of Object.entries(tasks)) { if (!t || typeof t !== "object") continue;
                for (const [lid, l] of Object.entries(t.lists || {})) { if (!l || typeof l !== "object") continue;
                    for (const [rid, r] of Object.entries(l)) { if (RESERVED.has(rid) || !r || typeof r !== "object") continue;
                        const imgs = imgsOf(r); imgs.forEach((im, i) => im && add(im.path, { taskId: tid, kind: "device", label: `${l._name || lid} · ${r.id || r.label || rid}`, node: `${BASE}/tasks/${tid}/lists/${lid}/${rid}/images`, idx: i, images: imgs, entry: im })); } }
                for (const [date, d] of Object.entries(t.tasks || {})) { const imgs = imgsOf(d); imgs.forEach((im, i) => im && add(im.path, { taskId: tid, kind: "daily", label: `daily ${date}`, node: `${BASE}/tasks/${tid}/tasks/${date}/images`, idx: i, images: imgs, entry: im })); } }
            if (SRC === "ledger") for (const [node, r] of Object.entries(await moneyRows(fresh))) {
                const path = r.imgPath || pathOfUrl(r.img); if (!path) continue;
                const d = rowDate(r), amt = Number(r.amt), lab = [d, r.name || "(no name)", Number.isFinite(amt) ? "$" + amt.toFixed(2) : ""].filter(Boolean).join(" · ");
                add(path, { kind: "ledger", label: lab, node, entry: { note: "", markup: r.imgMarkup || "" }, row: r });
            }
            recIndex = idx; return idx;
        }
        // ledger + gas rows that carry a photo: { "<BASE>/money/ledger/<year>/<id>": row } (gas rows nest the same way)
        let moneyCache = null;
        const pathOfUrl = u => { const m = /\/o\/([^?]+)/.exec(String(u || "")); try { return m ? decodeURIComponent(m[1]) : ""; } catch (_) { return ""; } };
        const rowDate = r => { const d = r?.date; if (d == null || d === "") return ""; const n = Number(d); const dt = Number.isFinite(n) && String(d).length > 8 ? new Date(n) : new Date(String(d).slice(0, 10) + "T12:00:00Z"); return isNaN(dt) ? "" : dt.toISOString().slice(0, 10); };
        async function moneyRows(fresh) {
            if (moneyCache && !fresh) return moneyCache; const out = {};
            for (const top of ["ledger", "gas"]) { let v = null; try { v = (await get(ref(database, `${BASE}/money/${top}`))).val(); } catch (e) { console.warn("[gallery] money read", e?.code || e); }
                const walk = (o, p, depth) => { if (!o || typeof o !== "object" || depth > 3) return; if (o.img || o.imgPath) { out[p] = o; return; } for (const [k, c] of Object.entries(o)) walk(c, `${p}/${k}`, depth + 1); };
                walk(v, `${BASE}/money/${top}`, 0); }
            return (moneyCache = out);
        }
        async function recordRefs(path, fresh) { return (await recordIndex(fresh)).get(path) || []; }
        // patch = fields to merge into the entry; null = remove the entry
        async function syncRecords(path, patch) {
            const hits = await recordRefs(path, true);
            for (const h of hits) {
                if (h.kind === "ledger") {   // the row keeps its fields; only the photo pointers change (gone = blank, like the ledger apps leave it)
                    const w = patch ? { ...(patch.url ? { img: patch.url } : {}), ...(patch.path ? { imgPath: patch.path } : {}), ...("markup" in patch ? { imgMarkup: patch.markup } : {}) } : { img: "", imgPath: "", imgMarkup: null };

        /* ===============================

        async function loadImages(folder, sub = "") {

            try { const qs = new URLSearchParams(location.search); qs.delete("task"); qs.set("folder", folder); qs.set("src", SRC); history.replaceState(null, "", "?" + qs.toString()); } catch (_) {}

        /* ===============================
           UPLOAD - several at once, named like onlinejob (name | label | file, then _2 _3 on a clash), sized to the pick, labelled

        async function doUpload(files) {
            if (!needWrite()) return;

            const folder = sanitize($("imageLabel").value) || cur.folder; if (!folder) return alert("Open a job first, or type a job name.");
            const maxW = Number($("sizeSelect").value) || 2048, label = $("markupTextInput").value.trim(), typed = sanitize($("imageNameInput").value), folderPath = `${BASE}/tasks/images/${folder}`;

        content.addEventListener("dragenter", e => { if (![...e.dataTransfer.types].includes("Files")) return; e.preventDefault(); dragDepth++; content.classList.add("drop"); });

        /* ===============================

        const current = () => byPath(modal.dataset.fullPath || "");
        async function openModal(p) {

            $("modalFileName").textContent = p.name; $("lbCount").textContent = `${curIdx + 1} / ${lbList.length}`; $("renameInput").value = p.name.replace(/\.[^.]+$/, ""); $("fileInfo").textContent = p.sub ? `in ${p.sub}` : "";
            const r = p.rec; $("noteWhere").textContent = r ? `${r.kind} photo · ${r.label}` : "loose photo (storage only - no device / daily row)"; $("noteInput").value = r?.entry?.note || ""; $("noteInput").disabled = !r || r.kind === "ledger"; $("editMarkupInput").value = r?.entry?.markup || ""; modal.dataset.recordNote = r?.entry?.note || "";
            modalImage.onload = () => { if (modal.dataset.fullPath === p.fullPath) $("fileInfo").textContent = `${modalImage.naturalWidth} × ${modalImage.naturalHeight}${p.sub ? " · in " + p.sub : ""}`; };
            await urlOf(p); if (modal.dataset.fullPath !== p.fullPath) return; if (p.url) modalImage.src = p.url;

        }
        function closeModal() { modal.classList.remove("open"); modalImage.removeAttribute("src"); modal.dataset.fullPath = ""; }
        const step = d => { const n = curIdx + d; if (n >= 0 && n < lbList.length) openModal(lbList[n]); };
        $("modalNavLeft").addEventListener("click", () => step(-1)); $("modalNavRight").addEventListener("click", () => step(1));
        $("closeModalButton").addEventListener("click", closeModal);

        document.addEventListener("keydown", e => { if (!modal.classList.contains("open") || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return; if (e.key === "ArrowLeft") step(-1); else if (e.key === "ArrowRight") step(1); else if (e.key === "Escape") closeModal(); });

        let busy = false;   // one file operation at a time - a second tap while one runs is ignored
        async function edit(what, fn) { const p = current(); if (!p || !needWrite() || busy) return; busy = true; showLoading(what); try { await fn(p); if (modal.classList.contains("open")) modal.dataset.fullPath = p.fullPath; await refreshAfter(p); } catch (e) { console.error("[gallery] " + what, e); alert(`${what} failed: ${e?.message || e}`); } finally { busy = false; hideLoading(); } }
        $("noteInput").addEventListener("change", async () => { const p = current(), note = $("noteInput").value.trim(); if (!p || !p.rec || note === (modal.dataset.recordNote || "")) return; try { await syncRecords(p.fullPath, { note }); modal.dataset.recordNote = note; p.rec = (await recordRefs(p.fullPath))[0] || p.rec; } catch (e) { alert("Note not saved: " + (e?.message || e)); } });
        $("applyMarkupButton").addEventListener("click", () => { const t = $("editMarkupInput").value.trim(); if (!t) return alert("Type the label text first."); edit("Applying label...", p => relabelPhoto(p, t)); });
        $("removeMarkupButton").addEventListener("click", () => { if (!confirm("Crop the label bar off this photo?")) return; edit("Removing label...", p => rewrite(p, b => unstampImg(b), { markup: "" })); });
        $("rotL").addEventListener("click", () => edit("Rotating...", p => rewrite(p, keepLabel(p, b => rotateImg(b, -90)), {})));
        $("rotR").addEventListener("click", () => edit("Rotating...", p => rewrite(p, keepLabel(p, b => rotateImg(b, 90)), {})));
        $("resizeButton").addEventListener("click", () => { const w = Number($("resizeTo").value); if (!w) return alert("Pick a width."); edit(`Resizing to ${w} px...`, p => rewrite(p, keepLabel(p, b => resizeImg(b, w)), {})); });
        $("renameButton").addEventListener("click", () => { const p = current(); if (!p) return; const base = sanitize($("renameInput").value); if (!base) return alert("Type a name."); const ext = (p.name.match(/\.[^.]+$/) || [".jpg"])[0]; let name = base + ext; if (name === p.name) return; if (photos.some(x => x !== p && x.sub === p.sub && x.name === name)) return alert("That name is taken in this job."); edit("Renaming...", x => movePhoto(x, x.fullPath.replace(/[^/]+$/, name))); });
        $("moveButton").addEventListener("click", () => { const to = $("moveToFolder").value; if (!to) return alert("Pick a destination job."); const p = current(); if (!p) return; edit("Moving...", async x => { await movePhoto(x, `${dirOf(to)}/${x.name}`); closeModal(); await loadImages(cur.folder, cur.sub); }); });
        $("downloadButton").addEventListener("click", async () => { const p = current(); if (!p) return; showLoading("Fetching..."); try { const blob = await getBlob(storageRef(storage, p.fullPath)), u = URL.createObjectURL(blob), a = document.createElement("a"); a.href = u; a.download = p.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 10000); } catch (e) { window.open(p.url, "_blank"); } finally { hideLoading(); } });
        $("deleteButton").addEventListener("click", () => { const p = current(); if (!p || !confirm(`Delete ${p.name}?${p.rec ? " Its " + p.rec.kind + " row loses it too." : ""}`)) return; edit("Deleting...", async x => { await deletePhoto(x); closeModal(); renderGrid(); }); });

        /* ===============================
           AUTH + DEEP LINKS: ?folder=<name> reopens a folder; ?task=<id> (the Louverse Photos tile, the Jobs app) opens that
           visit's project folder - onlinejob's folder rule (spaces -> _)
        ================================ */
        onAuthStateChanged(auth, async (u) => {
            user = u; BASE = u ? basePathFor(u) : "public"; tasksCache = null; recIndex = null; moneyCache = null; setSource(SRC, true);
            await loadFolders();
            const qs = new URLSearchParams(location.search); let folder = qs.get("folder") || "";
            const taskId = qs.get("task"); if (taskId) { try { const t = (await get(ref(database, `${BASE}/tasks/${taskId}`))).val(); folder = folderKey(t) || folder; } catch (e) { console.warn("[gallery] task folder", e?.code || e); } }
            if (folder && folders.some(f => f.name === folder)) await openFolder(folder);
            else if (folder) $("galleryNote").textContent = `no job "${folder}" here`;
        });
    </script>
    <script src="../assets/js/reveal.js?v=4" defer></script>
</body>
