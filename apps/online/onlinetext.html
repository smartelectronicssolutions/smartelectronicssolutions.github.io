<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Playback</title>
    <link rel="stylesheet" href="../assets/css/online.css">
    <style>
        main {
            font-family: 'Verdana', sans-serif;
            text-align: center;
            background-color: var(--surface);
            color: var(--text);
            max-width: 1000px;
            margin: 0 auto;
        }

        /* A <select> sizes itself to its LONGEST OPTION rather than to its container, so one long
           document or chapter title made this dropdown wider than the phone - and a single child wider
           than the viewport is what makes iOS shrink the WHOLE page. It does not need to show a whole
           title across the top (L): the full one is in the meta line below, and in the list when open. */
        #savedTexts {
            max-width: min(100%, 340px);
            text-overflow: ellipsis;
        }
        /* the row could not reflow at all - a label, a select and five buttons on one line */
        .toolbar-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 10px;
        }
        .toolbar-row > #docMeta { flex-basis: 100%; }   /* the meta always gets its own line */

        #display {
            font-size: 2em;
            font-weight: bold;
            margin: 40px 0;
            /* min-height, not height: once the words are allowed to wrap, a fixed 100px clips them. */
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            /* A flex item will not shrink below its own content, so "10 words at a time" in 2em bold was
               simply wider than a phone - and one child wider than the viewport makes iOS shrink the WHOLE
               page to fit, which is what "everything is smaller" looks like. Let it wrap and break. */
            flex-wrap: wrap;
            min-width: 0;
            padding: 0 12px;
            overflow-wrap: anywhere;
            text-align: center;
            color: var(--warn);
            cursor: pointer;
        }

        #controls {
            margin: 20px;
            /* was a plain block, so the slider row and Reset could not reflow on a narrow screen */
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        #fullText {
            margin-top: 20px;
            padding: 10px;
            border-top: 1px solid var(--border);
            text-align: left;
            font-size: 1em;
            color: var(--text);
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .doc-meta {
            font-size: .85em;
            opacity: .75;
            margin: 6px 0;
        }

        #titleInput {
            width: 420px;
            max-width: 90%;
            margin-bottom: 6px;
        }

        .slider-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .slider-container input[type="range"] {
            width: min(200px, 45vw);   /* a hard 200px plus its labels overflowed a small phone */
        }

        .highlight {
            color: var(--warn);
        }

        textarea {
            max-width: 90%
        }
    </style>
</head>

<body>
    <header style="position:relative;">
        <div class="logo-box"><a href="../../index.html"><img src="../../assets/img/android-chrome-192x192.png"
                    alt="Luis Solutions"></a></div>
        <h1>Text Playback</h1>
        <div class="auth-bar"><span id="auth-label">Not signed in</span><button id="auth-btn">Sign In</button></div>
        <button id="theme-toggle" title="Toggle theme">☀️</button>
        <script>(function () { var b = document.getElementById("theme-toggle"), h = document.documentElement; b.textContent = h.classList.contains("light") ? "🌙" : "☀️"; b.addEventListener("click", function () { var n = h.classList.contains("light") ? "dark" : "light"; h.classList.toggle("light", n === "light"); localStorage.setItem("ss-theme", n); b.textContent = n === "light" ? "🌙" : "☀️"; }); })();</script>
        <div id="login-inline">
            <h3>Sign In</h3><input type="email" id="email-in" placeholder="Email" /><input type="password" id="pass-in"
                placeholder="Password" /><button id="do-login">Sign In</button>
            <p id="auth-err"></p>
        </div>
    </header>
    <main>
        <div class="toolbar-row">
            <label for="savedTexts">Saved Texts:</label>
            <select id="savedTexts">
                <option value="">Select a saved text</option>
            </select>
            <button id="deleteTextButton" disabled>Delete Text</button>
            <button id="pdfButton" disabled>Download PDF</button>
            <button id="polishButton" disabled title="Fix typos, spacing & punctuation only — never rewords. Saves a separate polished copy; your original stays untouched.">✨ Polish</button>
            <label id="polishToggleWrap" hidden style="font-size:.85em;margin-left:6px"><input type="checkbox" id="polishToggle"> Show polished</label>
            <div id="docMeta" class="doc-meta"></div>
        </div>
        <div id="display" role="button" tabindex="0" title="click the word to pause / resume">Text will appear here</div>
        <div id="controls">
            <div class="slider-container">
                <label for="speedSlider">Speed:</label>
                <input type="range" id="speedSlider" min="100" max="1000" value="300" step="25">
                <span id="speedValue">300 WPM</span>
            </div>
            <div>
                <label for="wordGroup">Words at a Time:</label>
                <select id="wordGroup">
                    <option value="1" selected>1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                </select>
            </div>
            <button id="resetButton" title="start this text over - also clears its bookmark">Reset</button>
        </div>
        <div>
            <input type="text" id="titleInput" placeholder="Title (optional)" maxlength="120">
            <br>
            <textarea id="textInput" rows="5" cols="50" placeholder="Paste your text here..."></textarea>
            <br>
            <button id="saveTextButton">Save Text</button>
            <button id="clearTextButton">Clear Text</button>
        </div>
        <br>
        <div id="fullText"></div>
    </main>
    <script type="module" src="../assets/js/auth.js"></script>
    <script src="../assets/js/links-aside.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script type="module">
        import { getDatabase, ref, set, push, onValue, remove, get, auth, onAuthStateChanged } from '../assets/js/firebase-init.js';

        const database = getDatabase();
        // Dual read (house pattern): public/texts is always listed; the signed-in user's {uid}/texts is listed
        // with it under "Mine". New saves go to the signed-in uid, or to public when signed out.
        let DB = 'public';
        let UIDBASE = null;
        const scopes = { public: {}, mine: {} };   // raw rows per scope
        let docs = {};                              // 'scope:key' -> {text, title?, createdAt?, source?}
        let unsubPublic = null, unsubMine = null, unsubBooks = null;
        let books = {};                             // {uid}/books index: slug -> {title, author, chapters:{nn:{title,chars}}}

        function escHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            }[c]));
        }

        const textInput = document.getElementById('textInput');
        const saveTextButton = document.getElementById('saveTextButton');
        const savedTexts = document.getElementById('savedTexts');
        // The Start button is gone (2026-09-20, L: "no need for the start button since the click should
        // start it") - clicking the word starts, pauses and resumes. Five places still write its label, so
        // this is a stub with a textContent property: no button to keep in sync, no scattering of null
        // checks through the playback code, and if the button ever comes back this line finds it again.
        const startPauseButton = document.getElementById('startPauseButton') || { textContent: '' };
        const resetButton = document.getElementById('resetButton');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');
        const wordGroup = document.getElementById('wordGroup');
        const display = document.getElementById('display');
        const fullText = document.getElementById('fullText');
        const deleteTextButton = document.getElementById('deleteTextButton');
        const clearTextButton = document.getElementById('clearTextButton');
        const titleInput = document.getElementById('titleInput');
        const pdfButton = document.getElementById('pdfButton');
        const docMeta = document.getElementById('docMeta');
        const polishButton = document.getElementById('polishButton');
        const polishToggle = document.getElementById('polishToggle');
        const polishToggleWrap = document.getElementById('polishToggleWrap');
        const POLISH_URL = 'https://chat.luissolutions.us/chat';   // reuse the apps' Ollama proxy (CF tunnel -> se)
        const POLISH_MODEL = 'gemma2:9b';
        function currentDoc() { return docs[savedTexts.value]; }
        function viewText() { const d = currentDoc(); return (d && polishToggle.checked && d.polished) ? d.polished : (d ? (d.text || '') : ''); }

        let words = [];
        let currentIndex = 0;
        let timer = null;
        const isPlaying = { status: false };

        function togglePlayPause() {
            if (isPlaying.status) {
                pausePlayback();
            } else {
                startPlayback();
            }
        }

        function saveSettings() {
            const settings = {
                speedWpm: speedSlider.value,
                wordGroup: wordGroup.value,
                selectedText: savedTexts.value,
                textInput: textInput.value,
            };
            localStorage.setItem('textPlaybackSettings', JSON.stringify(settings));
        }

        function loadSettings() {
            const savedSettings = JSON.parse(localStorage.getItem('textPlaybackSettings') || '{}');
            if (savedSettings.speedWpm) {
                speedSlider.value = savedSettings.speedWpm;
            }
            if (savedSettings.wordGroup) {
                wordGroup.value = savedSettings.wordGroup;
            }
            if (savedSettings.selectedText) {
                savedTexts.value = savedSettings.selectedText;
                deleteTextButton.disabled = !savedTexts.value;
            }
            if (savedSettings.textInput) {
                textInput.value = savedSettings.textInput;
            }
            // a remembered selection is filled in by renderList() once the lists arrive
        }

        // 'scope:key' -> RTDB path (null when the scope is not available, e.g. "mine" while signed out)
        function pathOf(sel) {
            const i = String(sel || '').indexOf(':');
            if (i < 0) return null;
            const scope = sel.slice(0, i), key = sel.slice(i + 1);
            if (scope === 'book') return null;   // chapters are read-only
            const base = scope === 'mine' ? UIDBASE : 'public';
            return base && key ? `${base}/texts/${key}` : null;
        }

        function renderList() {
            docs = {};
            savedTexts.innerHTML = '<option value="">Select a saved text</option>';
            for (const [scope, label] of [['mine', 'Mine'], ['public', 'Public']]) {
                const rows = scopes[scope] || {};
                // newest first; legacy rows without createdAt sort last in key order
                const keys = Object.keys(rows).filter(k => rows[k] && typeof rows[k] === 'object')
                    .sort((a, b) => (rows[b].createdAt || 0) - (rows[a].createdAt || 0));
                if (!keys.length) continue;
                const group = document.createElement('optgroup');
                group.label = label;
                for (const key of keys) {
                    const sel = `${scope}:${key}`;
                    docs[sel] = rows[key];
                    const option = document.createElement('option');
                    option.value = sel;
                    option.textContent = docLabel(rows[key]);
                    group.appendChild(option);
                }
                savedTexts.appendChild(group);
            }
            // BOOKS (2026-09-18): one group per book, chapters in order; bodies load on pick
            for (const slug of Object.keys(books).sort((a, b) => String(books[a].title).localeCompare(String(books[b].title)))) {
                const bk = books[slug]; const chs = bk.chapters || {}; const nns = Object.keys(chs).sort();
                if (!nns.length) continue;
                const group = document.createElement('optgroup'); group.label = '📖 ' + (bk.title || slug) + (bk.author ? ' — ' + bk.author : '');
                for (const nn of nns) {
                    const sel = `book:${slug}:${nn}`;
                    docs[sel] = docs[sel] && docs[sel].text ? docs[sel] : { title: `${bk.title} — ${nn} ${chs[nn].title || ''}`.trim(), text: '', lazy: true, book: slug, nn, chars: chs[nn].chars || 0, source: 'book' };
                    const option = document.createElement('option'); option.value = sel; option.textContent = `${parseInt(nn, 10)}. ${chs[nn].title || 'Part ' + parseInt(nn, 10)}`;
                    group.appendChild(option);
                }
                savedTexts.appendChild(group);
            }
            // restore the remembered selection; a legacy bare key maps to whichever scope holds it
            const saved = (JSON.parse(localStorage.getItem('textPlaybackSettings') || '{}') || {}).selectedText;
            if (saved) {
                const sel = docs[saved] ? saved : (docs['mine:' + saved] ? 'mine:' + saved : (docs['public:' + saved] ? 'public:' + saved : ''));
                savedTexts.value = sel;
                if (sel && !textInput.value.trim()) {
                    if (docs[sel].lazy) loadSelected(); else {
                    textInput.value = docs[sel].text || '';
                    titleInput.value = docs[sel].title || '';
                    fullText.textContent = textInput.value;
                    }
                }
            }
            deleteTextButton.disabled = !savedTexts.value || !pathOf(savedTexts.value);
            showDocMeta(savedTexts.value);
        }
        // a book chapter body is fetched the first time it is picked (and kept for the session)
        async function loadSelected() {
            const sel = savedTexts.value, d = docs[sel]; if (!d) return;
            if (d.lazy && UIDBASE) {
                display.textContent = 'loading chapter…';
                try { const snap = await get(ref(database, `${UIDBASE}/bookText/${d.book}/${d.nn}`)); const v = snap.val() || {}; d.text = v.text || ''; d.lazy = false; }
                catch (e) { display.textContent = 'could not load: ' + (e.message || e); return; }
                if (savedTexts.value !== sel) return;   // he moved on while it loaded
            }
            textInput.value = d.text || ''; titleInput.value = d.title || '';
            words = []; currentIndex = 0; display.textContent = 'Text will appear here'; fullText.textContent = textInput.value;
            saveSettings(); showDocMeta(sel);
        }
        window.__otTest = { setBooks(i) { books = i; renderList(); }, setBase(b) { UIDBASE = b; renderList(); } };   // test hook (no auth needed)

        function fetchSavedTexts() {
            if (!unsubPublic) {
                unsubPublic = onValue(ref(database, 'public/texts'), (snapshot) => {
                    scopes.public = snapshot.val() || {};
                    renderList();
                });
            }
            if (unsubMine) { unsubMine(); unsubMine = null; }
            if (unsubBooks) { unsubBooks(); unsubBooks = null; }
            scopes.mine = {}; books = {};
            if (UIDBASE) {
                unsubBooks = onValue(ref(database, `${UIDBASE}/books`), (snapshot) => { books = snapshot.val() || {}; renderList(); });
                unsubMine = onValue(ref(database, `${UIDBASE}/texts`), (snapshot) => {
                    scopes.mine = snapshot.val() || {};
                    renderList();
                });
            } else {
                renderList();
            }
        }

        // BOOKMARKS (2026-09-20, L: "pause and leave the page and have it come back to where it left
        // off... all the different books have essentially a bookmark"). The reader is RSVP, so a position
        // is just an index - kept PER DOCUMENT KEY so every book and chapter holds its own place.
        // localStorage, not Firebase: it must work for public docs and while signed out, and where you
        // are in a book is a per-device fact.
        const BM_KEY = 'textBookmarks';
        function bmAll() { try { return JSON.parse(localStorage.getItem(BM_KEY) || '{}') || {}; } catch (_) { return {}; } }
        function bmWrite(o) { try { localStorage.setItem(BM_KEY, JSON.stringify(o)); } catch (_) {} }
        function bmGet(key) { const b = bmAll()[key]; return (b && b.i > 0) ? b : null; }
        function bmClear(key) { const a = bmAll(); if (a[key]) { delete a[key]; bmWrite(a); } }
        function bmSave() {
            const key = savedTexts.value; if (!key || !words.length) return;
            const a = bmAll();
            // the very start, or already finished, is not a place worth returning to
            if (currentIndex > 0 && currentIndex < words.length) a[key] = { i: currentIndex, n: words.length, at: Date.now() };
            else delete a[key];
            bmWrite(a);
        }
        // the actual ask: closing the tab or switching apps fires no pause, so catch both
        document.addEventListener('visibilitychange', () => { if (document.hidden) bmSave(); });
        window.addEventListener('pagehide', bmSave);
        window.__otBookmarks = { bmAll, bmGet, bmSave, bmClear };   // test hook

        // toggle-on-word (2026-09-20, L: "instead of the pause button... just click on the word showing
        // to pause"). His eyes are already on the word; reaching for a button below it costs a glance.
        // It TOGGLES rather than only pausing - pause by tap and resume by hunt would be worse than the
        // button was. Only live once there is something playing, so a click on the placeholder text does
        // not silently start a read he did not ask for.
        display.addEventListener('click', () => {
            if (!words.length && !textInput.value.trim()) return;
            if (isPlaying.status) pausePlayback(); else startPlayback();
        });
        display.style.cursor = 'pointer';

        function startPlayback() {
            if (!textInput.value.trim()) {
                return;
            }

            if (!words.length) {
                words = textInput.value.trim().split(/\s+/);
                fullText.textContent = textInput.value;
                currentIndex = 0;
                // Resume ONLY if this is still the text that was bookmarked. Edit it, or flip the polished
                // view, and the old index means nothing - better to start over than to drop him somewhere
                // arbitrary and call it his place.
                const bm = bmGet(savedTexts.value);
                if (bm && bm.n === words.length && bm.i < words.length) currentIndex = bm.i;
            } else if (currentIndex >= words.length) {
                currentIndex = 0; // finished last time - rewind
            }

            isPlaying.status = true;
            startPauseButton.textContent = "Pause";

            if (timer === null) {
                playStep();
            }
        }

        function pausePlayback() {
            clearTimeout(timer);
            timer = null;
            bmSave();
            showDocMeta(savedTexts.value);   // refresh the % where he stopped - a stale one reads as "not saved"

            isPlaying.status = false;
            startPauseButton.textContent = "Start";
        }

        function resetPlayback() {
            clearTimeout(timer);
            timer = null;
            bmClear(savedTexts.value);   // Reset means start this one over - the bookmark goes with it
            words = [];
            currentIndex = 0;
            display.textContent = 'Text will appear here';
            isPlaying.status = false;
            startPauseButton.textContent = "Start";
        }

        // Delay for one group at the current WPM; linger on punctuation.
        function groupDelay(group) {
            const wpm = parseInt(speedSlider.value, 10);
            let delay = group.length * (60000 / wpm);
            const last = group[group.length - 1] || '';
            if (/[.!?]["')\]]?$/.test(last)) {
                delay *= 1.6;
            } else if (/[,;:]["')\]]?$/.test(last)) {
                delay *= 1.3;
            }
            return delay;
        }

        function playStep() {
            const groupSize = parseInt(wordGroup.value, 10);
            const group = words.slice(currentIndex, currentIndex + groupSize);
            display.textContent = group.join(' ');
            highlightWords(currentIndex, group.length);
            currentIndex += group.length;

            if (currentIndex >= words.length) {
                timer = null;
                isPlaying.status = false;
                startPauseButton.textContent = "Start";
                return;
            }
            if (currentIndex % 24 < groupSize) bmSave();   // keeps the place if the tab is killed outright
            timer = setTimeout(playStep, groupDelay(group));
        }

        function highlightWords(startIndex, groupSize) {
            const highlightedWords = words.map((word, index) => {
                if (index >= startIndex && index < startIndex + groupSize) {
                    return `<span class="highlight">${escHtml(word)}</span>`;
                }
                return escHtml(word);
            });

            fullText.innerHTML = highlightedWords.join(' ');
        }

        function updateSpeedDisplay() {
            speedValue.textContent = `${speedSlider.value} WPM`;
        }

        saveTextButton.addEventListener('click', () => {
            const text = textInput.value.trim();
            if (text) {
                const newTextRef = push(ref(database, `${DB}/texts`));
                const title = titleInput.value.trim();
                const doc = { text, createdAt: Date.now(), source: 'web' };
                if (title) doc.title = title;
                set(newTextRef, doc).then(() => {
                    alert('Text saved successfully.');
                    textInput.value = '';
                    titleInput.value = '';
                    saveSettings();
                });
            }
        });

        savedTexts.addEventListener('change', () => {
            const d = docs[savedTexts.value];
            if (d && d.lazy) { polishToggle.checked = false; deleteTextButton.disabled = true; loadSelected(); return; }
            if (d) {
                textInput.value = d.text || '';
                titleInput.value = d.title || '';

                words = [];
                currentIndex = 0;
                display.textContent = 'Text will appear here';
                fullText.textContent = textInput.value;

                saveSettings();
            }

            deleteTextButton.disabled = !savedTexts.value || !pathOf(savedTexts.value);
            polishToggle.checked = false;
            showDocMeta(savedTexts.value);
        });

        deleteTextButton.addEventListener('click', () => {
            const path = pathOf(savedTexts.value);
            if (path) {
                remove(ref(database, path)).then(() => {
                    alert('Text deleted successfully.');
                    savedTexts.value = '';
                    saveSettings();
                    showDocMeta('');
                }).catch(error => {
                    console.error('Error deleting text: ', error);
                });
            }
        });

        // --- S9: narrow copy-edit polish (fixes typos/spacing only; original never touched, saved as `polished`) ---
        function refreshPolishUI() {
            const sel = savedTexts.value, d = docs[sel];
            polishButton.disabled = !(d && sel.startsWith('mine:'));   // only your own docs (signed in)
            polishToggleWrap.hidden = !(d && d.polished);
            if (!(d && d.polished)) polishToggle.checked = false;
            polishButton.textContent = (d && d.polished) ? '✨ Re-polish' : '✨ Polish';
        }
        function applyView() {
            const t = viewText();
            textInput.value = t; fullText.textContent = t;
            words = []; currentIndex = 0; display.textContent = 'Text will appear here';
        }
        polishToggle.addEventListener('change', () => { applyView(); showDocMeta(savedTexts.value); });
        // gemma2 signs off a copy-edit with an offer of help - "Let me know if you'd like me to look for
        // other types of errors as well!" - and that was being SAVED INTO THE DOCUMENT. An editor that adds
        // content has corrupted the text, and the real corrections are subtle enough that the tail was the
        // only visible change. Any TRAILING paragraph the original does not have, reading like a sign-off,
        // is dropped - bounded by the original's paragraph count so it can never eat his own last paragraph.
        function stripSignoff(orig, out) {
            const want = orig.split(/\n\s*\n/).filter(p => p.trim()).length;
            const ps = out.split(/\n\s*\n/);
            const SIGN = /^\s*(let me know|i['\u2019]?ve |i have |feel free|hope (this|that) helps|note:|here('s| is) the|if you('d| would)|would you like)/i;
            while (ps.length > want && SIGN.test(ps[ps.length - 1])) ps.pop();
            return ps.join('\n\n').trim();
        }
        polishButton.addEventListener('click', async () => {
            const sel = savedTexts.value, d = docs[sel], path = pathOf(sel);
            const orig = ((d && d.text) || '').trim();
            if (!d || !path || !orig) return;
            const prev = polishButton.textContent;
            polishButton.disabled = true; polishButton.textContent = '✨ Polishing…';
            try {
                const res = await fetch(POLISH_URL, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: POLISH_MODEL, stream: false, messages: [
                            { role: 'system', content: "You are a careful copy editor. Fix ONLY spelling, punctuation, spacing, capitalization, and obvious transcription errors in the user's text. Do NOT change wording, phrasing, style, tone, or add or remove any content. Return ONLY the corrected text — no preamble, no notes, no code fences, and NO closing remark, comment, or offer of further help." },
                            { role: 'user', content: orig }
                        ]
                    })
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                let polished = (((await res.json()).message || {}).content || '').trim().replace(/^```[a-z]*\n?/i, '').replace(/\n?```$/, '').trim();
                if (!polished) throw new Error('empty result');
                polished = stripSignoff(orig, polished);
                // a copy editor changes very little; wildly longer or shorter is a rewrite, and a rewrite is
                // not what this button promises. Refuse rather than save it.
                if (polished.length < orig.length * 0.6 || polished.length > orig.length * 1.5)
                    throw new Error('the editor returned something very different in length — not saving it');
                await set(ref(database, `${path}/polished`), polished);
                await set(ref(database, `${path}/polishedAt`), Date.now());
                d.polished = polished; d.polishedAt = Date.now();
                polishToggle.checked = true; applyView(); showDocMeta(sel);
            } catch (e) {
                console.error('polish failed', e); alert('Polish failed: ' + e.message);
                polishButton.textContent = prev;
            } finally {
                polishButton.disabled = !(docs[savedTexts.value] && savedTexts.value.startsWith('mine:'));
            }
        });

        // --- documents: list label, meta line, PDF download (jsPDF from cdnjs; text only, paginated) ---
        function docLabel(d) {
            if (d.title) return d.title;
            const t = String(d.text || '');
            return t.substring(0, 30) + (t.length > 30 ? '...' : '');
        }

        function showDocMeta(key) {
            const d = key && docs[key];
            pdfButton.disabled = !d;
            if (!d) { docMeta.textContent = ''; return; }
            const _bm = bmGet(key);   // so a place to come back to is visible without pressing Start
            const parts = [];
            if (d.source === 'book') parts.push('📖 ' + ((books[d.book] || {}).title || 'book') + ' · chapter ' + parseInt(d.nn, 10) + ' of ' + Object.keys((books[d.book] || {}).chapters || {}).length);
            else if (d.source) parts.push('from ' + (d.source === 'compman' ? 'CompMan' : d.source));
            if (d.createdAt) parts.push(new Date(d.createdAt).toLocaleDateString());
            parts.push(String(d.text || '').trim().split(/\s+/).filter(Boolean).length + ' words');
            if (d.polished) parts.push(polishToggle.checked ? '✨ viewing polished' : '✨ polished available');
            // the bookmark is only useful if he can see it BEFORE pressing Start
            if (_bm && _bm.n) parts.push('📑 bookmark at ' + Math.round(_bm.i / _bm.n * 100) + '%');
            docMeta.textContent = parts.join(' · ');
            refreshPolishUI();
        }

        // Plain text -> blocks the PDF can typeset on its own (no AI): blank lines split blocks; a short line in
        // ALL CAPS / ending with ':' / starting with # is a heading; lines starting with - * • or 1. are a list;
        // > is a quote; a block of short lines is verse (line breaks kept); everything else is a paragraph
        // whose soft-wrapped lines are re-joined. Markdown emphasis markers are stripped.
        function parseBlocks(text) {
            const clean = String(text || '').replace(/\r\n?/g, '\n').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
            const strip = s => s.replace(/\*\*(.+?)\*\*/g, '$1').replace(/__(.+?)__/g, '$1').replace(/(^|\s)\*(\S.*?\S)\*(?=\s|$)/g, '$1$2').replace(/`([^`]*)`/g, '$1');
            const blocks = [];
            for (const raw of clean.split(/\n\s*\n/)) {
                const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
                if (!lines.length) continue;
                const one = lines.length === 1 ? lines[0] : null;
                const md = one && /^#{1,3}\s+/.test(one);
                const caps = one && one.length <= 70 && /[A-Z]{3,}/.test(one) && one === one.toUpperCase() && !/[.!?]$/.test(one);
                const colon = one && one.length <= 70 && /:$/.test(one) && one.split(/\s+/).length <= 8;
                if (md || caps || colon) {
                    blocks.push({ kind: 'heading', level: md ? one.match(/^#+/)[0].length : 2, text: strip(one.replace(/^#+\s+/, '')) });
                } else if (lines.every(l => /^([-*•]|\d+[.)])\s+/.test(l))) {
                    blocks.push({ kind: 'list', items: lines.map(l => ({ marker: /^\d+[.)]/.test(l) ? l.match(/^\d+/)[0] + '.' : '•', text: strip(l.replace(/^([-*•]|\d+[.)])\s+/, '')) })) });
                } else if (lines.every(l => /^>\s?/.test(l))) {
                    blocks.push({ kind: 'quote', text: strip(lines.map(l => l.replace(/^>\s?/, '')).join(' ')) });
                } else if (lines.length >= 2 && lines.reduce((a, l) => a + l.length, 0) / lines.length < 45) {
                    blocks.push({ kind: 'verse', lines: lines.map(strip) });
                } else {
                    blocks.push({ kind: 'para', text: strip(lines.join(' ')) });
                }
            }
            return blocks;
        }

        function downloadPdf(d) {
            if (!window.jspdf) { alert('PDF library still loading - try again in a moment.'); return; }
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ unit: 'pt', format: 'letter' });
            const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight();
            const M = 60, TOP = 64, BOTTOM = H - 60, COL = W - 2 * M;
            const title = d.title || docLabel(d);
            const dateStr = d.createdAt ? new Date(d.createdAt).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }) : '';
            let y = TOP;
            const need = (h) => { if (y + h > BOTTOM) { pdf.addPage(); y = TOP; } };
            const put = (text, x, width, font, style, size, lh, indent = 0) => {
                pdf.setFont(font, style);
                pdf.setFontSize(size);
                const lines = pdf.splitTextToSize(text, width - indent);
                lines.forEach((line, i) => { need(lh); pdf.text(line, x + (i ? indent : 0), y); y += lh; });
            };

            // title page head: title, meta, rule
            pdf.setFont('helvetica', 'bold');
            pdf.setFontSize(20);
            for (const line of pdf.splitTextToSize(title, COL)) { pdf.text(line, M, y); y += 26; }
            pdf.setFont('helvetica', 'normal');
            pdf.setFontSize(9.5);
            pdf.setTextColor(110);
            const meta = [dateStr, d.source === 'compman' ? 'transcribed by CompMan' : (d.source || ''), String(d.text || '').trim().split(/\s+/).filter(Boolean).length + ' words'].filter(Boolean).join('  ·  ');
            pdf.text(meta, M, y);
            pdf.setTextColor(0);
            y += 10;
            pdf.setDrawColor(190);
            pdf.line(M, y, W - M, y);
            y += 22;

            for (const b of parseBlocks(d.text)) {
                if (b.kind === 'heading') {
                    const size = b.level === 1 ? 15 : (b.level === 2 ? 13 : 11.5);
                    y += 6;
                    need(size + 10);
                    put(b.text, M, COL, 'helvetica', 'bold', size, size + 5);
                    y += 4;
                } else if (b.kind === 'list') {
                    for (const it of b.items) {
                        need(15);
                        pdf.setFont('times', 'normal');
                        pdf.setFontSize(11.5);
                        pdf.text(it.marker, M + 6, y);
                        put(it.text, M + 24, COL - 24, 'times', 'normal', 11.5, 15);
                        y += 2;
                    }
                    y += 6;
                } else if (b.kind === 'quote') {
                    const start = y;
                    put(b.text, M + 18, COL - 18, 'times', 'italic', 11.5, 15);
                    pdf.setDrawColor(170);
                    pdf.line(M + 6, start - 11, M + 6, y - 5);
                    y += 8;
                } else if (b.kind === 'verse') {
                    for (const line of b.lines) put(line, M + 12, COL - 12, 'times', 'normal', 11.5, 15);
                    y += 8;
                } else {
                    put(b.text, M, COL, 'times', 'normal', 11.5, 15.5);
                    y += 8;
                }
            }

            // running header (from page 2) + page numbers
            const n = pdf.getNumberOfPages();
            pdf.setFont('helvetica', 'normal');
            pdf.setFontSize(8.5);
            pdf.setTextColor(130);
            for (let i = 1; i <= n; i++) {
                pdf.setPage(i);
                if (i > 1) {
                    pdf.text(title.length > 80 ? title.slice(0, 77) + '...' : title, M, 36);
                    if (dateStr) pdf.text(dateStr, W - M, 36, { align: 'right' });
                }
                pdf.text(`${i} / ${n}`, W / 2, H - 30, { align: 'center' });
            }
            const name = title.replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase() || 'document';
            pdf.save(name + '.pdf');
        }

        pdfButton.addEventListener('click', () => {
            const d = currentDoc();
            if (d) downloadPdf({ ...d, text: viewText() });
        });

        // On live speed/group changes, reschedule the next step at the new pace.
        function reschedule() {
            if (isPlaying.status) {
                clearTimeout(timer);
                timer = setTimeout(playStep, 250);
            }
        }

        wordGroup.addEventListener('change', () => {
            saveSettings();
            reschedule();
        });

        speedSlider.addEventListener('input', () => {
            updateSpeedDisplay();
            saveSettings();
            reschedule();
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            updateSpeedDisplay();
        });

        // Re-point the DB base path on auth changes and refresh the saved-text list.
        onAuthStateChanged(auth, (user) => {
            UIDBASE = user ? user.uid : null;
            DB = UIDBASE || 'public';
            fetchSavedTexts();
        });

        if (startPauseButton.addEventListener) startPauseButton.addEventListener('click', () => {
            togglePlayPause();
            saveSettings();
        });

        clearTextButton.addEventListener('click', () => {
            textInput.value = '';
            words = [];
            currentIndex = 0;
            display.textContent = 'Text will appear here';
            fullText.innerHTML = '';
            saveSettings();
        });

        resetButton.addEventListener('click', resetPlayback);
    </script>
    <script src="../assets/js/reveal.js?v=3" defer></script>
</body>
