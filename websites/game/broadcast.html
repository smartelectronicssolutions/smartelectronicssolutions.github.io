<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broadcast — Game Hub</title>
    <link rel="icon" href="assets/img/mariohead.png">
    <link rel="stylesheet" href="assets/css/game.css">
    <style>
        /* Broadcast desk (2026-10-15, L: "a broadcasting page ... record via obs ... stream to twitch ... info on what im playing ... minor edits").
           Talks to se through compman.luissolutions.us/broadcast/* (Firebase token, owner only). */
        .bc-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
        @media (max-width: 760px) { .bc-grid { grid-template-columns: minmax(0, 1fr); } }
        .bc-card { background: #fffaf2; border: 1px solid #e3d3bd; border-radius: 10px; padding: 16px; min-width: 0; }
        .bc-card h2 { margin: 0 0 12px; font-size: .95rem; color: #1a0e04; }
        .bc-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .bc-btn { font: inherit; font-size: .9rem; font-weight: bold; padding: 16px 10px; border-radius: 8px; border: 0; cursor: pointer;
                  color: #fff; background: #6b5848; }
        .bc-btn:disabled { opacity: .45; cursor: default; }
        .bc-btn.rec { background: #b3261e; } .bc-btn.live { background: #9146ff; } .bc-btn.stop { background: #2e2018; }
        .bc-btn.on { box-shadow: 0 0 0 3px #fff, 0 0 0 5px currentColor; animation: bcpulse 1.4s infinite; }
        @keyframes bcpulse { 50% { filter: brightness(1.25); } }
        .bc-state { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 0; font-size: .8rem; }
        .bc-pill { padding: 4px 10px; border-radius: 99px; background: #efe3d2; color: #6b5848; }
        .bc-pill.hot { background: #b3261e; color: #fff; } .bc-pill.live { background: #9146ff; color: #fff; }
        .bc-msg { min-height: 1.2em; margin-top: 10px; font-size: .8rem; color: #9a3a00; overflow-wrap: break-word; }
        .np { display: flex; gap: 14px; align-items: flex-start; }
        .np img { width: 110px; max-height: 150px; object-fit: contain; border-radius: 6px; background: #efe3d2; flex-shrink: 0; }
        .np h3 { margin: 0 0 4px; font-size: 1rem; color: #1a0e04; overflow-wrap: anywhere; }
        .np .meta { font-size: .75rem; color: #9a8270; line-height: 1.6; }
        .np .blurb { font-size: .8rem; line-height: 1.55; margin-top: 10px; }
        .np .cheats { font-size: .75rem; margin-top: 8px; color: #6b5848; }
        .np a { color: #c85800; }
        .clips { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow: auto; }
        .clip { display: flex; gap: 8px; align-items: center; padding: 8px; border-radius: 6px; background: #f5ede0; cursor: pointer; font-size: .78rem; min-width: 0; }
        .clip.sel { outline: 2px solid #c85800; }
        .clip .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .clip input { flex-shrink: 0; }
        video { width: 100%; max-height: 360px; background: #000; border-radius: 6px; margin-top: 10px; }
        .ed { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; font-size: .8rem; }
        .ed button { font: inherit; padding: 7px 11px; border-radius: 6px; border: 1px solid #c8b49a; background: #fff; cursor: pointer; }
        .ed button.go { background: #c85800; color: #fff; border-color: #c85800; }
        .ed .io { font-weight: bold; min-width: 4.5em; }
        #signin { display: flex; flex-direction: column; gap: 8px; max-width: 320px; }
        #signin input { font: inherit; font-size: 16px; padding: 9px; border: 1px solid #c8b49a; border-radius: 6px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header class="site-header">
    <a class="site-brand" href="index.html"><span>★</span> GAME HUB</a>
    <nav class="site-nav">
        <a href="mario.html">Mario</a>
        <a href="minecraft.html">Minecraft</a>
        <a href="emulator.html">Emulator</a>
        <a href="broadcast.html" class="active">Broadcast</a>
        <a href="pixel_maker.html">Pixel Studio</a>
        <a href="news.html">News</a>
    </nav>
</header>

<main>
    <div class="page-hero">
        <div>
            <h1>Broadcast</h1>
            <p>Record &middot; Go live on Twitch &middot; Now playing &middot; Quick edits</p>
        </div>
    </div>

    <form id="signin" class="bc-card hidden">
        <h2>Sign in</h2>
        <input type="email" id="em" placeholder="Email" autocomplete="username">
        <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
        <button class="bc-btn" type="submit">Sign in</button>
        <div class="bc-msg" id="si-msg"></div>
    </form>

    <div id="desk" class="hidden">
        <div class="bc-grid">
            <section class="bc-card">
                <h2>Controls</h2>
                <div class="bc-btns">
                    <button class="bc-btn rec" id="b-rec">⏺ Record</button>
                    <button class="bc-btn live" id="b-live">📡 Go live (Twitch)</button>
                    <button class="bc-btn" id="b-both">⏺📡 Record + live</button>
                    <button class="bc-btn stop" id="b-stop">⏹ Stop all</button>
                </div>
                <div class="bc-state" id="state"><span class="bc-pill">checking…</span></div>
                <div class="bc-msg" id="msg"></div>
            </section>

            <section class="bc-card">
                <h2>Now playing</h2>
                <div id="np" class="np"><div class="meta">checking…</div></div>
            </section>
        </div>

        <section class="bc-card" style="margin-top:16px">
            <h2>Recordings &amp; quick edits</h2>
            <div class="clips" id="clips"><div class="np meta">loading…</div></div>
            <video id="vid" controls playsinline preload="metadata" class="hidden"></video>
            <div class="ed hidden" id="ed">
                <button id="e-in">Set start</button><span class="io" id="v-in">0:00</span>
                <button id="e-out">Set end</button><span class="io" id="v-out">end</span>
                <label><input type="checkbox" id="e-exact"> frame-exact (slower)</label>
                <button class="go" id="e-clip">✂ Save clip</button>
                <button id="e-thumb">🖼 Thumbnail here</button>
                <button id="e-join">🔗 Join ticked</button>
            </div>
            <div class="bc-msg" id="emsg"></div>
        </section>
    </div>
</main>

<footer class="site-footer">&copy; 2026 Louman &mdash; luissolutions.github.io</footer>

<script type="module">
    import { auth, onAuthStateChanged, signInWithEmailAndPassword } from "./assets/js/firebase-init.js";

    const API = "https://compman.luissolutions.us/broadcast";
    const OWNER = "7cIh8rrhVNOjjj5CBDgb3IlqzEh2";
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const fmt = s => { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
    let obs = {}, sel = null, inT = 0, outT = null, timer = null;

    async function call(path, body) {
        const t = await auth.currentUser.getIdToken();
        const r = await fetch(API + path, body ? { method: "POST", headers: { Authorization: "Bearer " + t, "Content-Type": "application/json" }, body: JSON.stringify(body) }
                                              : { headers: { Authorization: "Bearer " + t } });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || ("error " + r.status));
        return j;
    }

    // ---- controls ----
    function paintObs(o) {
        obs = o || {};
        const pills = [];
        if (!obs.running) pills.push('<span class="bc-pill">OBS closed</span>');
        else if (!obs.connected) pills.push('<span class="bc-pill">OBS not answering</span>');
        else {
            pills.push(obs.recording ? `<span class="bc-pill hot">● REC ${esc((obs.recTime || "").slice(0, 8))}</span>` : '<span class="bc-pill">not recording</span>');
            pills.push(obs.streaming ? `<span class="bc-pill live">● LIVE ${esc((obs.streamTime || "").slice(0, 8))}</span>` : '<span class="bc-pill">offline</span>');
            if (obs.scene) pills.push(`<span class="bc-pill">scene: ${esc(obs.scene)}</span>`);
        }
        $("state").innerHTML = pills.join("");
        $("b-rec").classList.toggle("on", !!obs.recording);
        $("b-live").classList.toggle("on", !!obs.streaming);
        $("b-rec").textContent = obs.recording ? "⏹ Stop recording" : "⏺ Record";
        $("b-live").textContent = obs.streaming ? "⏹ End stream" : "📡 Go live (Twitch)";
    }

    async function act(actions) {
        $("msg").textContent = "…";
        document.querySelectorAll(".bc-btn").forEach(b => b.disabled = true);
        try {
            if (!obs.running) await call("/action", { action: "open_obs" });
            let r;
            for (const a of actions) r = await call("/action", { action: a });
            paintObs(r.obs); $("msg").textContent = "";
            if (actions.includes("stop_record") || actions.includes("stop_all")) setTimeout(loadClips, 2500);
        } catch (e) { $("msg").textContent = e.message; }
        document.querySelectorAll(".bc-btn").forEach(b => b.disabled = false);
    }
    $("b-rec").onclick = () => act([obs.recording ? "stop_record" : "record"]);
    $("b-live").onclick = () => act([obs.streaming ? "stop_stream" : "stream"]);
    $("b-both").onclick = () => act([...(obs.recording ? [] : ["record"]), ...(obs.streaming ? [] : ["stream"])]);
    $("b-stop").onclick = () => act(["stop_all"]);

    // ---- now playing ----
    function paintPlaying(p) {
        if (!p || !p.title) {
            $("np").innerHTML = `<div class="meta">${esc(p?.note || (p?.source ? p.source + " is open, nothing loaded" : "Nothing running - start a game in RetroArch or a PC port"))}</div>`;
            return;
        }
        const img = p.boxart || p.image;
        const meta = [p.system, p.core && "core: " + p.core, p.playtime && "played " + p.playtime, p.source !== "RetroArch" && p.source].filter(Boolean).map(esc).join("<br>");
        const ch = p.cheats ? `<div class="cheats">Cheats: ${p.cheats.on.length ? esc(p.cheats.on.join(" · ")) : "none on"} (${p.cheats.total} available)</div>` : "";
        const blurb = p.blurb ? `<div class="blurb">${p.basedOn ? "<b>Based on " + esc(p.wikiTitle) + ":</b> " : ""}${esc(p.blurb)} ${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">Wikipedia</a>` : ""}</div>` : "";
        const key = (img || "") + "|" + p.title + "|" + (p.playtime || "") + "|" + JSON.stringify(p.cheats || "") + "|" + !!p.paused;
        if ($("np").dataset.key === key) return;          // no flicker on every poll
        $("np").dataset.key = key;
        $("np").innerHTML = `${img ? `<img id="np-img" src="${esc(img)}" alt="">` : ""}
            <div style="min-width:0"><h3>${esc(p.title)}${p.paused ? " (paused)" : ""}</h3><div class="meta">${meta}</div>${blurb}${ch}</div>`;
        const im = $("np-img");                          // no box art (hacks) -> the Wikipedia image -> nothing
        if (im) im.onerror = () => { if (p.image && im.src !== p.image) im.src = p.image; else im.remove(); };
    }

    async function poll() {
        try { const s = await call("/status"); paintObs(s.obs); paintPlaying(s.playing); }
        catch (e) { $("msg").textContent = e.message; }
    }

    // ---- recordings + edits ----
    async function loadClips() {
        try {
            const { clips } = await call("/clips");
            $("clips").innerHTML = clips.length ? clips.map(c => `
                <div class="clip${sel === c.name ? " sel" : ""}" data-n="${esc(c.name)}">
                    <input type="checkbox" class="jn" title="tick to join">
                    <span class="nm">${esc(c.name)}</span>
                    <span>${c.sec ? fmt(c.sec) : ""} · ${c.mb} MB</span>
                </div>`).join("") : '<div class="np meta">No recordings yet - hit Record. They save to OneDrive\\pers\\videos\\games.</div>';
            $("clips").querySelectorAll(".clip").forEach(el => el.onclick = e => { if (!e.target.classList.contains("jn")) pick(el.dataset.n); });
        } catch (e) { $("emsg").textContent = e.message; }
    }

    async function pick(name) {
        sel = name; inT = 0; outT = null; $("v-in").textContent = "0:00"; $("v-out").textContent = "end";
        document.querySelectorAll(".clip").forEach(el => el.classList.toggle("sel", el.dataset.n === name));
        $("emsg").textContent = name.toLowerCase().endsWith(".mkv") ? "Preparing the video (first open of an .mkv takes a few seconds)…" : "";
        const t = await auth.currentUser.getIdToken();
        const v = $("vid");
        v.src = API + "/video?name=" + encodeURIComponent(name) + "&t=" + encodeURIComponent(t);
        v.classList.remove("hidden"); $("ed").classList.remove("hidden");
        v.onloadedmetadata = () => { $("emsg").textContent = ""; };
        v.onerror = () => { $("emsg").textContent = "This video can't play here (sign-in expired? re-pick it)"; };
    }
    $("e-in").onclick = () => { inT = $("vid").currentTime; $("v-in").textContent = fmt(inT); };
    $("e-out").onclick = () => { outT = $("vid").currentTime; $("v-out").textContent = fmt(outT); };
    async function edit(body, label) {
        $("emsg").textContent = label + "…";
        try { const r = await call("/edit", body); $("emsg").textContent = "Saved: " + r.made; loadClips(); }
        catch (e) { $("emsg").textContent = e.message; }
    }
    $("e-clip").onclick = () => {
        const end = outT ?? $("vid").duration;
        if (!(end > inT)) return $("emsg").textContent = "Set an end after the start";
        edit({ op: "clip", name: sel, start: inT, end, exact: $("e-exact").checked }, "Cutting");
    };
    $("e-thumb").onclick = () => edit({ op: "thumb", name: sel, at: $("vid").currentTime }, "Grabbing frame");
    $("e-join").onclick = () => {
        const names = [...document.querySelectorAll(".clip")].filter(el => el.querySelector(".jn").checked).map(el => el.dataset.n).reverse();
        if (names.length < 2) return $("emsg").textContent = "Tick 2 or more recordings (they join oldest first)";
        edit({ op: "join", names }, "Joining");
    };

    // ---- sign-in ----
    $("signin").onsubmit = async e => {
        e.preventDefault();
        try { await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value); }
        catch (err) { $("si-msg").textContent = "Sign-in failed: " + err.message; }
    };
    onAuthStateChanged(auth, user => {
        clearInterval(timer);
        const ok = user && user.uid === OWNER;
        $("signin").classList.toggle("hidden", !!ok);
        $("desk").classList.toggle("hidden", !ok);
        if (user && !ok) $("si-msg").textContent = "This page is for the owner account only.";
        if (ok) { poll(); loadClips(); timer = setInterval(poll, 5000); }
    });
</script>
</body>
</html>
