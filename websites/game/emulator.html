<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Emulator — Game Library</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../assets/css/app-styles.css">
    <link rel="stylesheet" href="assets/css/game.css">
    <style>
        * { box-sizing: border-box; }
        body { background: #1a1a1a; color: #ccc; font-family: monospace; margin: 0; overflow: hidden; }

        #auth-section { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        #auth-section input { padding: 4px 8px; border-radius: 4px; border: 1px solid #555; background: #2a2a2a; color: #fff; font-size: .85rem; width: 130px; }
        #auth-section button { padding: 5px 12px; font-size: .85rem; cursor: pointer; border-radius: 4px; border: none; background: #e65c00; color: #fff; }
        #user-status { font-size: .82rem; color: #888; }

        #app { display: flex; flex-direction: column; height: calc(100dvh - 48px); }

        #controls { display: flex; gap: 8px; padding: 8px 12px; background: #1e1e1e; border-bottom: 1px solid #333; align-items: center; flex-wrap: wrap; }
        #controls button, label#rom-label { padding: 9px 14px; border-radius: 6px; border: none; background: #333; color: #ccc; cursor: pointer; font-size: .85rem; font-family: monospace; }
        #controls button:hover { background: #444; color: #fff; }
        #controls button.primary, label#rom-label { background: #e65c00; color: #fff; }
        #controls button.primary:hover { background: #cc4f00; }
        #controls button:disabled { opacity: .35; cursor: default; }
        label#rom-label { border: 1px solid #b34500; }
        #rom-file { display: none; }
        #game-name { font-size: .82rem; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }

        .slot-group { display: flex; align-items: center; gap: 4px; border: 1px solid #333; border-radius: 6px; padding: 2px 6px; }
        .slot-group label { font-size: .75rem; color: #666; margin-right: 2px; }
        .slot-btn { padding: 7px 11px !important; font-size: .78rem !important; background: #2a2a2a !important; }
        .slot-btn.active-slot { background: #e65c00 !important; color: #fff !important; }

        #save-status { margin-left: auto; text-align: right; font-size: .82rem; color: #aaa; min-width: 0; }
        #save-status:empty { display: none; }
        #save-status.ok { color: #6c6; } #save-status.err { color: #f66; } #save-status.info { color: #6af; }

        #emulator-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #111; overflow: hidden; }
        #drop-prompt { color: #555; font-size: 1rem; text-align: center; line-height: 2.2; padding: 20px; }
        #drop-prompt b { display: block; color: #e65c00; font-size: 1.1rem; margin-bottom: 6px; }
        #drop-prompt span { display: block; font-size: .8rem; color: #444; }
        #game { width: 100%; height: 100%; }

        /* ── RomM library overlay ── */
        #library { position: fixed; inset: 0; z-index: 1000; background: rgba(10,10,12,.97); display: none; flex-direction: column; }
        #library.open { display: flex; }
        .lib-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #333; flex-wrap: wrap; }
        .lib-head h2 { margin: 0; font-size: 1rem; color: #e65c00; }
        .lib-head input#lib-search { flex: 1; min-width: 120px; padding: 9px 12px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; font-size: 16px; }
        .lib-head .closeb { padding: 9px 14px; border: none; border-radius: 6px; background: #333; color: #ccc; font-size: 1rem; cursor: pointer; }
        .lib-plats { display: flex; gap: 6px; padding: 8px 14px; overflow-x: auto; border-bottom: 1px solid #2a2a2a; -webkit-overflow-scrolling: touch; }
        .lib-plat { flex: 0 0 auto; padding: 7px 12px; border-radius: 20px; border: 1px solid #3a3a3a; background: #222; color: #bbb; font-size: .8rem; cursor: pointer; white-space: nowrap; }
        .lib-plat.on { background: #e65c00; border-color: #e65c00; color: #fff; font-weight: 700; }
        .lib-grid { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); grid-auto-rows: max-content; gap: 12px; padding: 14px; align-content: start; max-width: 1180px; margin: 0 auto; width: 100%; }
        .lib-card { background: #1c1c20; border: 1px solid #2c2c33; border-radius: 8px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
        .lib-card:active, .lib-card:hover { border-color: #e65c00; }
        .lib-card .cov { width: 100%; aspect-ratio: 3/4; min-height: 150px; background: #0d0d10 center/cover no-repeat; display: grid; place-items: center; color: #555; font-size: 1.6rem; }
        .lib-card .t { font-size: .72rem; color: #cdd0d4; padding: 7px 8px; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .lib-msg { grid-column: 1/-1; text-align: center; color: #777; padding: 40px 20px; }
        /* RomM login modal */
        #romm-login { position: fixed; inset: 0; z-index: 1100; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; }
        #romm-login.open { display: flex; }
        #romm-login .box { background: #1e1e24; border: 1px solid #3a3a44; border-radius: 12px; padding: 22px; width: min(92vw, 340px); }
        #romm-login h3 { margin: 0 0 4px; color: #e65c00; }
        #romm-login p { margin: 0 0 14px; font-size: .78rem; color: #888; }
        #romm-login input { width: 100%; padding: 11px 12px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #444; background: #17171b; color: #fff; font-size: 16px; }
        #romm-login button { width: 100%; padding: 11px; border: none; border-radius: 6px; background: #e65c00; color: #fff; font-size: .9rem; font-weight: 700; cursor: pointer; }
        #romm-login .err { color: #f66; font-size: .78rem; margin: 8px 0 0; min-height: 1em; }

        @media (max-width: 640px) {
            #controls { gap: 6px; padding: 7px 8px; }
            #controls button, label#rom-label { padding: 10px 12px; }
            #game-name { max-width: 110px; }
        }
        /* compact, non-stacked header on phones */
        @media (max-width: 560px) {
            .site-header { flex-wrap: wrap; row-gap: 6px; padding: 6px 10px; height: auto; }
            .site-nav { display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important; width: 100%; overflow-x: auto; gap: 4px; justify-content: flex-start; -webkit-overflow-scrolling: touch; }
            .site-nav::-webkit-scrollbar { display: none; }
            .site-nav a { flex: 0 0 auto; white-space: nowrap; padding: 6px 10px; }
            #auth-section { width: 100%; gap: 6px; }
            #auth-section #login-fields { width: 100%; flex-wrap: wrap; gap: 6px; }
            #auth-section #login-fields input { flex: 1 1 40%; min-width: 0; width: auto; }
            #auth-section #login-fields #login-btn { flex: 1 1 100%; }
        }
        /* Mobile landscape = fullscreen game only (hide all chrome) */
        @media (orientation: landscape) and (max-height: 500px) {
            .site-header, #controls { display: none !important; }
            #save-status { display: none !important; }
            #app { height: 100dvh; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <a class="site-brand" href="index.html"><span>★</span> GAME HUB</a>
    <nav class="site-nav">
        <a href="mario.html">Mario</a>
        <a href="minecraft.html">Minecraft</a>
        <a href="emulator.html" class="active">Emu</a>
        <a href="pixel_maker.html">Pixel Studio</a>
        <a href="news.html">News</a>
    </nav>
    <div id="auth-section">
        <div id="login-fields" style="display:flex;gap:8px;align-items:center;">
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Password">
            <button id="login-btn">Login</button>
        </div>
        <div id="logout-fields" style="display:none;gap:8px;align-items:center;">
            <span id="user-status"></span>
            <button id="logout-btn">Logout</button>
        </div>
    </div>
</header>

<div id="build-badge" style="position:fixed;bottom:4px;right:7px;z-index:2000;font-size:9px;color:#777;pointer-events:none;font-family:monospace;">build 0820j</div>

<div id="app">
    <div id="controls">
        <button id="btn-library" class="primary">&#128218; Library</button>
        <label id="rom-label" for="rom-file">&#128193; File</label>
        <input type="file" id="rom-file">
        <span id="game-name"></span>
        <div class="slot-group">
            <label>SLOT</label>
            <button class="slot-btn active-slot" data-slot="1">1</button>
            <button class="slot-btn" data-slot="2">2</button>
            <button class="slot-btn" data-slot="3">3</button>
        </div>
        <button id="btn-quick-save" disabled>Save</button>
        <button id="btn-load" disabled>Load</button>
        <button id="btn-save-quit" class="primary" disabled>Save &amp; Quit</button>
        <div id="save-status"></div>
    </div>
    <div id="emulator-wrap">
        <div id="drop-prompt">
            <b>&#128218; Open the Library</b>
            Pick a game from your RomM collection to play
            <span>GBA &middot; GBC &middot; SNES &middot; N64 &middot; NDS &middot; PS1 &middot; NES &middot; Genesis &middot; PSP</span>
        </div>
    </div>
</div>

<!-- RomM library overlay -->
<div id="library">
    <div class="lib-head">
        <h2>&#128218; RomM Library</h2>
        <input id="lib-search" type="search" placeholder="Search games…" autocomplete="off">
        <button class="closeb" id="lib-close">&#10005;</button>
    </div>
    <div class="lib-plats" id="lib-plats"></div>
    <div class="lib-grid" id="lib-grid"><div class="lib-msg">Loading…</div></div>
</div>

<!-- RomM login modal -->
<div id="romm-login">
    <div class="box">
        <h3>Sign in to RomM</h3>
        <p>Use your RomM account to load your game library.</p>
        <input id="romm-user" type="text" placeholder="RomM username" autocomplete="username">
        <input id="romm-pass" type="password" placeholder="Password" autocomplete="current-password">
        <button id="romm-login-btn">Sign in</button>
        <div class="err" id="romm-login-err"></div>
    </div>
</div>

<script type="module">

    import {
        auth, database, ref, set, get,
        onAuthStateChanged, signInWithEmailAndPassword, signOut
    } from "../../assets/js/firebase-init.js";

    const EJS_CDN      = "https://cdn.emulatorjs.org/stable/data/";
    const AUTO_SAVE_MS = 30000;
    const READY_TIMEOUT = 15000;
    const ROMM_BASE    = "https://romm.luissolutions.us";   // RomM tunnel

    /* ── RTDB (saves stay in Firebase) ── */
    function toB64(bytes) { let s=""; for(let i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]); return btoa(s); }
    function fromB64(b64) { const s=atob(b64),out=new Uint8Array(s.length); for(let i=0;i<s.length;i++) out[i]=s.charCodeAt(i); return out; }
    async function dbSave(path,bytes) { await set(ref(database,path),{d:toB64(bytes),ts:Date.now()}); }
    async function dbLoad(path) { const snap=await get(ref(database,path)); if(!snap.exists()) throw new Error("no save"); return fromB64(snap.val().d); }

    /* ── STATUS ── */
    const statusEl = document.getElementById("save-status");
    let statusTimer = null;
    function setStatus(msg, type="", persist=false) {
        clearTimeout(statusTimer); statusEl.textContent=msg; statusEl.className=type;
        if (!persist && type==="ok") statusTimer=setTimeout(()=>{ statusEl.textContent=""; statusEl.className=""; },4000);
    }

    /* ── SLOTS ── */
    let currentSlot = 1;
    document.querySelectorAll(".slot-btn").forEach(btn => {
        btn.onclick = () => {
            currentSlot = parseInt(btn.dataset.slot);
            document.querySelectorAll(".slot-btn").forEach(b => b.classList.remove("active-slot"));
            btn.classList.add("active-slot");
            setStatus(`Slot ${currentSlot} selected.`);
        };
    });
    function slotKey()      { return window.EJS_core && window.EJS_gameName ? `emu:slot:${window.EJS_core}:${window.EJS_gameName}` : null; }
    function rememberSlot() { const k=slotKey(); if(k) localStorage.setItem(k,currentSlot); }
    function recallSlot()   {
        const k=slotKey(); if(!k) return;
        currentSlot=parseInt(localStorage.getItem(k)||"1");
        document.querySelectorAll(".slot-btn").forEach(b=>b.classList.toggle("active-slot",parseInt(b.dataset.slot)===currentSlot));
    }

    /* ── BUTTONS ── */
    function setGameButtons(on) { ["btn-quick-save","btn-load","btn-save-quit"].forEach(id=>document.getElementById(id).disabled=!on); }

    /* ── FIREBASE AUTH (for saves) ── */
    let DATABASE_BASE_PATH="public", authResolved=false;
    document.getElementById("login-btn").onclick = async () => {
        try { await signInWithEmailAndPassword(auth, document.getElementById("login-email").value, document.getElementById("login-password").value); }
        catch(err) { setStatus("Login failed: "+err.message,"err"); }
    };
    document.getElementById("logout-btn").onclick = () => signOut(auth);
    function waitForAuth() {
        return new Promise(resolve => {
            if (authResolved) return resolve();
            const unsub = onAuthStateChanged(auth, user => { DATABASE_BASE_PATH=user?user.uid:"public"; authResolved=true; unsub(); resolve(); });
        });
    }
    onAuthStateChanged(auth, user => {
        DATABASE_BASE_PATH=user?user.uid:"public"; authResolved=true;
        const lf=document.getElementById("login-fields"), lo=document.getElementById("logout-fields");
        if(user){ lf.style.display="none"; lo.style.display="flex"; document.getElementById("user-status").textContent=user.email; }
        else    { lf.style.display="flex"; lo.style.display="none"; document.getElementById("user-status").textContent=""; }
    });

    /* ── PATHS ── */
    function sanitizeKey(s) { return s.replace(/[.#$[\]\s/]/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,""); }
    function getBatteryPath() { return window.EJS_core&&window.EJS_gameName ? `${DATABASE_BASE_PATH}/emu/battery/${window.EJS_core}/${sanitizeKey(window.EJS_gameName)}` : null; }
    function getStatePath(slot=currentSlot) { return window.EJS_core&&window.EJS_gameName ? `${DATABASE_BASE_PATH}/emu/states/${window.EJS_core}/${sanitizeKey(window.EJS_gameName)}/s${slot}` : null; }

    /* ── EMULATOR DESTROY ── */
    async function destroyEmulator() {
        try { window.EJS_emulator?.pause?.(); } catch {}
        try { const al=window.EJS_emulator?.Module?.AL, ctx=al?.currentCtx?.ctx??window.EJS_emulator?.Module?.audioContext; if(ctx&&ctx.state!=="closed") await ctx.close(); } catch {}
        try { window.EJS_emulator?.Module?.pauseMainLoop?.(); } catch {}
        try { window.EJS_emulator?.destroy?.(); } catch {}
        window.EJS_emulator=null;
    }

    /* ── WAIT READY ── */
    async function waitForEmulatorReady() {
        const deadline=Date.now()+READY_TIMEOUT;
        while(Date.now()<deadline) {
            const gm=window.EJS_emulator?.gameManager??window.EJS_emulator??null;
            if(gm?.loadState&&gm?.getState) return gm;
            await new Promise(r=>setTimeout(r,250));
        }
        return null;
    }

    /* ── CAPTURE STATE ── */
    async function captureState() {
        const gm=window.EJS_emulator?.gameManager??window.EJS_emulator??null, Module=window.EJS_emulator?.Module??null;
        if(gm?.getState) { try { let raw=gm.getState(); if(raw?.then) raw=await raw; if(raw instanceof Blob) return new Uint8Array(await raw.arrayBuffer()); if(raw instanceof ArrayBuffer) return new Uint8Array(raw); if(ArrayBuffer.isView(raw)&&raw.byteLength>0) return new Uint8Array(raw.buffer,raw.byteOffset,raw.byteLength); } catch {} }
        if(Module) { for(const [szFn,serFn] of [["EmulatorJSGetStateSize","EmulatorJSGetState"],["_EmulatorJSGetStateSize","_EmulatorJSGetState"],["_retro_serialize_size","_retro_serialize"],["retro_serialize_size","retro_serialize"]]) { if(typeof Module[szFn]!=="function"||typeof Module[serFn]!=="function") continue; try { const size=Module[szFn](); if(size<=0) continue; const ptr=Module._malloc(size); Module[serFn](ptr,size); const copy=new Uint8Array(new Uint8Array(Module.HEAPU8.buffer,ptr,size)); Module._free(ptr); if(copy.byteLength>0) return copy; } catch {} } }
        return null;
    }

    /* ── APPLY STATE ── */
    async function applyState(bytes) {
        const data=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes), gm=window.EJS_emulator?.gameManager??window.EJS_emulator??null, Module=window.EJS_emulator?.Module??null;
        if(gm?.loadState) { try { gm.loadState(data); return true; } catch {} }
        if(Module) { for(const fn of ["EmulatorJSLoadState","_EmulatorJSLoadState","_retro_unserialize","retro_unserialize"]) { if(typeof Module[fn]!=="function") continue; try { const ptr=Module._malloc(data.length); Module.HEAPU8.set(data,ptr); Module[fn](ptr,data.length); Module._free(ptr); return true; } catch {} } }
        return false;
    }

    /* ── LAUNCH (shared by file-picker + RomM library) ── */
    let CLOUD_BATTERY=null, autoSaveInterval=null, launchSeq=0;
    // file extension -> EmulatorJS core (core names must match the engine EXACTLY: 'gb' not 'gbc', 'segaMD' not 'genesis')
    const extMap = {gba:'gba',gbc:'gb',gb:'gb',smc:'snes',sfc:'snes',z64:'n64',n64:'n64',v64:'n64',nds:'nds',bin:'psx',iso:'psx',cue:'psx',nes:'nes',md:'segaMD',smd:'segaMD',gen:'segaMD',pbp:'psp',chd:'psx',gg:'segaGG',sms:'segaMS',zip:'gba'};
    // RomM platform slug -> EmulatorJS core. Valid cores: gb, gba, nes, snes, n64, nds, segaMS, segaMD, segaGG, psx, psp (NO 'gbc'/'genesis' — those black-screen)
    const coreBySlug = {
        nes:'nes','famicom':'nes',
        snes:'snes','sfam':'snes','super-famicom':'snes','super-nintendo-entertainment-system':'snes',
        gb:'gb','gameboy':'gb','game-boy':'gb',
        gbc:'gb','gbcolor':'gb','game-boy-color':'gb',
        gba:'gba','game-boy-advance':'gba',
        n64:'n64','nintendo-64':'n64',
        nds:'nds','ds':'nds','nintendo-ds':'nds',
        genesis:'segaMD',megadrive:'segaMD','genesis-slash-megadrive':'segaMD','sega-mega-drive-genesis':'segaMD','md':'segaMD',
        sms:'segaMS',mastersystem:'segaMS','sega-master-system':'segaMS','sega-master-system-mark-iii':'segaMS',
        gamegear:'segaGG',gg:'segaGG','sega-game-gear':'segaGG',
        psx:'psx',ps1:'psx','playstation':'psx','ps':'psx',
        psp:'psp','playstation-portable':'psp'
    };  // dc (Dreamcast) not supported by EmulatorJS

    async function launchGame(fileOrBlob, fileName, core) {
        const seq=++launchSeq;
        stopAutoSave(); await destroyEmulator();
        if(seq!==launchSeq) return;
        setGameButtons(false);
        await waitForAuth();
        if(seq!==launchSeq) return;

        const ext = (fileName.split('.').pop()||'').toLowerCase();
        window.EJS_core     = core || extMap[ext] || 'gba';
        window.EJS_gameName = fileName.replace(/\.[^.]+$/,"");
        recallSlot();
        document.getElementById("game-name").textContent = window.EJS_gameName;

        setStatus("Fetching cloud save…","info",true);
        const bPath=getBatteryPath();
        if(bPath) { try { CLOUD_BATTERY=await dbLoad(bPath); } catch { CLOUD_BATTERY=null; } } else { CLOUD_BATTERY=null; }
        if(seq!==launchSeq) return;

        const gameUrl = (fileOrBlob instanceof Blob) ? URL.createObjectURL(fileOrBlob) : fileOrBlob;
        document.getElementById("emulator-wrap").innerHTML="<div id='game'></div>";

        window.EJS_player        = "#game";
        window.EJS_gameUrl       = gameUrl;
        window.EJS_gameName      = window.EJS_gameName;
        window.EJS_pathtodata    = EJS_CDN;
        window.EJS_startOnLoaded = true;

        window.EJS_onGameStart = async function() {
            if(seq!==launchSeq) return;
            setGameButtons(true);
            setStatus("Waiting for core…","info",true);
            const gm=await waitForEmulatorReady();
            if(seq!==launchSeq) return;
            if(!gm) { setStatus("Core ready timeout — saves may not work.","err"); startAutoSave(); return; }
            const sPath=getStatePath();
            if(sPath) { try { const bytes=await dbLoad(sPath); if(seq!==launchSeq) return; const ok=await applyState(bytes); setStatus(ok?`Slot ${currentSlot} restored.`:"State load failed.",ok?"ok":"err"); } catch { setStatus("No save found — starting fresh.",""); } }
            else { setStatus("Running.","ok"); }
            startAutoSave();
        };

        const old=document.getElementById("ejs-loader"); if(old) old.remove();
        const script=document.createElement("script"); script.id="ejs-loader"; script.src=EJS_CDN+"loader.js";
        script.onerror = () => setStatus("Emulator engine failed to load (network/CDN).","err");
        document.body.appendChild(script);

        // watchdog: if the emulator never starts, tell the user instead of a black screen
        const wseq=seq;
        setTimeout(() => {
            if(wseq!==launchSeq) return;
            const started = !!(window.EJS_emulator);
            if(!started) setStatus("Engine didn't start — try again, or check connection.","err");
        }, 22000);
    }

    /* file picker still works as a fallback */
    document.getElementById("rom-file").onchange = function() {
        const file=this.files[0]; if(!file) return;
        launchGame(file, file.name);
    };

    /* ── BATTERY ── */
    window.EJS_onLoadSave = () => CLOUD_BATTERY||null;
    let batteryTimer=null;
    window.EJS_onSaveSave = function(data) {
        if(!data||data.byteLength===0) return; const path=getBatteryPath(); if(!path) return;
        clearTimeout(batteryTimer); batteryTimer=setTimeout(async()=>{ try { await dbSave(path,new Uint8Array(data)); } catch {} },1500);
    };

    /* ── QUICK SAVE / LOAD / SAVE&QUIT / AUTOSAVE ── */
    document.getElementById("btn-quick-save").onclick = async () => {
        const path=getStatePath(); if(!path) return; setStatus("Saving…","info",true);
        const state=await captureState(); if(!state) { setStatus("Could not read game state.","err"); return; }
        try { await dbSave(path,state); rememberSlot(); setStatus(`Saved to slot ${currentSlot}.`,"ok"); } catch(err) { setStatus("Save failed: "+err.message,"err"); }
    };
    document.getElementById("btn-load").onclick = async () => {
        const path=getStatePath(); if(!path) return; setStatus("Loading slot…","info",true);
        try { const bytes=await dbLoad(path); const ok=await applyState(bytes); setStatus(ok?`Slot ${currentSlot} loaded.`:"State apply failed.",ok?"ok":"err"); }
        catch { setStatus(`No save in slot ${currentSlot}.`,"err"); }
    };
    document.getElementById("btn-save-quit").onclick = async () => {
        stopAutoSave(); setStatus("Saving…","info",true);
        const path=getStatePath();
        if(path) { const state=await captureState(); if(state) { try { await dbSave(path,state); rememberSlot(); } catch {} } }
        await destroyEmulator(); CLOUD_BATTERY=null; window.EJS_core=null; window.EJS_gameName=null;
        setGameButtons(false);
        document.getElementById("game-name").textContent="";
        document.getElementById("rom-file").value="";
        document.getElementById("emulator-wrap").innerHTML='<div id="drop-prompt"><b>&#128218; Open the Library</b>Pick a game from your RomM collection to play<span>GBA &middot; GBC &middot; SNES &middot; N64 &middot; NDS &middot; PS1 &middot; NES &middot; Genesis &middot; PSP</span></div>';
        setStatus("Session saved.","ok");
    };
    function startAutoSave() {
        stopAutoSave();
        autoSaveInterval=setInterval(async()=>{ const path=getStatePath(); if(!path) return; const state=await captureState(); if(!state) return; try { await dbSave(path,state); rememberSlot(); setStatus("Auto-saved.","ok"); } catch { setStatus("Auto-save failed.","err"); } },AUTO_SAVE_MS);
    }
    function stopAutoSave() { if(autoSaveInterval) { clearInterval(autoSaveInterval); autoSaveInterval=null; } }

    /* ══════════════ RomM LIBRARY ══════════════ */
    // Basic-auth header held in memory for the session (survives via sessionStorage on this tab).
    // More reliable cross-origin than session cookies; also send cookies as a fallback.
    let ROMM_AUTH = sessionStorage.getItem("romm_auth") || null;
    async function romm(path, opts={}) {
        const headers = { ...(opts.headers||{}) };
        if(ROMM_AUTH) headers["Authorization"] = ROMM_AUTH;
        return fetch(ROMM_BASE+path, { credentials:"include", ...opts, headers });
    }
    async function rommLoggedIn() {
        if(!ROMM_AUTH) return false;
        try { const r=await romm("/api/users/me"); return r.ok; } catch { return false; }
    }
    function showLogin(show) { document.getElementById("romm-login").classList.toggle("open", show); }
    document.getElementById("romm-login-btn").onclick = async () => {
        const u=document.getElementById("romm-user").value.trim(), p=document.getElementById("romm-pass").value;
        const errEl=document.getElementById("romm-login-err"); errEl.textContent="Signing in…";
        if(!u||!p){ errEl.textContent="Enter username and password."; return; }
        const hdr = "Basic "+btoa(u+":"+p);
        try {
            // POST /api/login establishes the session; also validates the credentials.
            const r=await fetch(ROMM_BASE+"/api/login",{ method:"POST", credentials:"include", headers:{ "Authorization":hdr } });
            if(!r.ok){ errEl.textContent = r.status===401 ? "Wrong username or password." : ("Login failed ("+r.status+")."); return; }
            ROMM_AUTH = hdr; sessionStorage.setItem("romm_auth", hdr);
            errEl.textContent=""; showLogin(false); document.getElementById("romm-pass").value="";
            openLibrary();
        } catch(e) { errEl.textContent="Can't reach RomM. Check the tunnel / connection."; }
    };

    let PLATFORMS=[], ROMS=[], curPlat="all";
    function coverUrl(rom) {
        const c = rom.url_cover || rom.path_cover_small || rom.path_cover_large || rom.path_cover || "";
        if(!c) return "";
        return /^https?:/.test(c) ? c : (ROMM_BASE + (c.startsWith("/")?"":"/") + c);
    }
    async function openLibrary() {
        if(!(await rommLoggedIn())) { showLogin(true); return; }
        document.getElementById("library").classList.add("open");
        if(!PLATFORMS.length) await loadPlatforms();
        await loadRoms();
    }
    async function loadPlatforms() {
        try {
            const r=await romm("/api/platforms"); if(!r.ok) throw 0;
            let d=await r.json(); PLATFORMS=(Array.isArray(d)?d:(d.items||[])).filter(p=>(p.rom_count??p.roms_count??1)>0);
        } catch { PLATFORMS=[]; }
        const bar=document.getElementById("lib-plats"); bar.innerHTML="";
        const mk=(slug,label)=>{ const b=document.createElement("div"); b.className="lib-plat"+(slug===curPlat?" on":""); b.textContent=label; b.onclick=()=>{curPlat=slug; [...bar.children].forEach(c=>c.classList.remove("on")); b.classList.add("on"); loadRoms();}; bar.appendChild(b); };
        mk("all","All");
        PLATFORMS.forEach(p=>mk(p.id, (p.display_name||p.name||p.slug)+" ("+(p.rom_count??p.roms_count??"")+")"));
    }
    async function loadRoms() {
        const grid=document.getElementById("lib-grid"); grid.innerHTML='<div class="lib-msg">Loading…</div>';
        try {
            let q="/api/roms?limit=500&order_by=name&order_dir=asc&with_files=true";
            if(curPlat!=="all") q+="&platform_ids="+curPlat;   // RomM v5: param renamed platform_id -> platform_ids
            const r=await romm(q); if(!r.ok) throw new Error("HTTP "+r.status);
            let d=await r.json(); ROMS=Array.isArray(d)?d:(d.items||[]);
            renderRoms();
        } catch(e) { grid.innerHTML='<div class="lib-msg">Could not load games ('+e.message+').</div>'; }
    }
    function renderRoms() {
        const grid=document.getElementById("lib-grid");
        const term=(document.getElementById("lib-search").value||"").toLowerCase();
        const list=ROMS.filter(r=>!term || (r.name||r.fs_name||"").toLowerCase().includes(term));
        grid.innerHTML="";
        if(!list.length){ grid.innerHTML='<div class="lib-msg">No games'+(term?' matching "'+term+'"':'')+'.</div>'; return; }
        for(const rom of list) {
            const card=document.createElement("div"); card.className="lib-card";
            const cov=coverUrl(rom);
            card.innerHTML='<div class="cov"'+(cov?' style="background-image:url('+"'"+cov.replace(/'/g,"%27")+"'"+')"':'')+'>'+(cov?'':'🎮')+'</div><div class="t">'+ (rom.name||rom.fs_name||'?').replace(/[<>&]/g,'') +'</div>';
            card.onclick=()=>playRom(rom);
            grid.appendChild(card);
        }
    }
    document.getElementById("lib-search").oninput = renderRoms;
    // big on-screen status in the play area so failures are visible on mobile
    function bootMsg(html, isErr) {
        document.getElementById("emulator-wrap").innerHTML =
            '<div id="drop-prompt"><b style="color:'+(isErr?'#f66':'#e65c00')+'">'+(isErr?'⚠ '+html:html)+'</b></div>';
    }
    async function playRom(rom) {
        const slug=(rom.platform_slug||"").toLowerCase();
        const fname = rom.fs_name || (rom.name+"."+(rom.fs_extension||"bin"));
        const ext = (fname.split('.').pop()||"").toLowerCase();
        const core = coreBySlug[slug] || extMap[ext];   // fall back to file extension when the RomM slug isn't mapped
        // RomM v5: ROM download moved to /api/roms/{id}/files/content/{file_name}; use the rom's first file name
        const dlName = (rom.files && rom.files[0] && rom.files[0].file_name) || fname;
        document.getElementById("library").classList.remove("open");
        if(!core) { bootMsg('“'+slug+'” isn’t supported by this player yet.', true); setStatus("Unsupported system: "+slug,"err"); return; }
        bootMsg('Downloading '+(rom.name||fname)+'…');
        setStatus("Downloading "+(rom.name||fname)+"…","info",true);
        try {
            const r=await romm("/api/roms/"+rom.id+"/content/"+encodeURIComponent(dlName));
            if(!r.ok) throw new Error("HTTP "+r.status+" downloading ROM");
            const blob=await r.blob();
            if(!blob || blob.size<100) throw new Error("empty ROM ("+ (blob?blob.size:0) +" bytes)");
            bootMsg('Booting '+(rom.name||fname)+'… ('+Math.round(blob.size/1024)+' KB)');
            await launchGame(blob, fname, core);
        } catch(e) { bootMsg('Could not load: '+e.message, true); setStatus("Load failed: "+e.message,"err"); }
    }

    document.getElementById("btn-library").onclick = openLibrary;
    document.getElementById("lib-close").onclick = ()=>document.getElementById("library").classList.remove("open");

    // Enter key submits the login forms (RomM + Firebase)
    ["romm-user","romm-pass"].forEach(id=>document.getElementById(id).addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); document.getElementById("romm-login-btn").click(); }}));
    ["login-email","login-password"].forEach(id=>document.getElementById(id).addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); document.getElementById("login-btn").click(); }}));

</script>
