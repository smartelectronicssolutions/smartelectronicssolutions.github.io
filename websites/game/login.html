<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sign Up</title>
    <link rel="icon" href="assets/img/mariohead.png">
    <link rel="stylesheet" href="assets/css/game.css">
    <script type="module" src="assets/js/auth-handling.js"></script>
</head>
<body>

<header class="site-header">
    <a class="site-brand" href="index.html"><span>★</span> GAME HUB</a>
    <nav class="site-nav">
        <a href="mario.html">Mario</a>
        <a href="minecraft.html">Minecraft</a>
        <a href="emulator.html">Emulator</a>
        <a href="broadcast.html">Broadcast</a>
        <a href="news.html">News</a>
        <a href="https://romm.luissolutions.us" target="_blank" rel="noopener">RomM</a>
        <a href="login.html" id="authLink" class="active">Login</a>
    </nav>
</header>

<main>
    <section class="auth-wrap">
        <div class="login-container">
            <h2>Login</h2>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Email" autocomplete="username" required>
                <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
                <button type="submit">Login</button>
            </form>
            <p>Don't have an account? <a href="#" id="toggle-register">Register here</a></p>
        </div>

        <div class="register-container" style="display: none;">
            <h2>Register</h2>
            <form id="registration-form">
                <input type="email" id="reg-email" placeholder="Email" autocomplete="username" required>
                <input type="password" id="reg-password" placeholder="Password" autocomplete="new-password" required>
                <input type="password" id="reg-confirm-password" placeholder="Confirm Password" autocomplete="new-password" required>
                <button type="submit">Register</button>
            </form>
            <p>Already have an account? <a href="#" id="toggle-login">Login here</a></p>
        </div>

        <div class="signed-in" id="signed-in" style="display: none;">
            <h2>Signed in</h2>
            <p id="signed-in-as"></p>
            <button type="button" id="logout-button">Logout</button>
        </div>
    </section>
</main>

</body>
</html>
