<!DOCTYPE html>
<html lang="en" class="theme-kamehouse">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping List — Kame House</title>
  <link rel="stylesheet" href="../../assets/css/master.css">
  <link rel="stylesheet" href="assets/css/kh.css">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/icons/favicon-32x32.png">
  <script src="assets/js/html.js" defer></script>
  <script type="module" src="assets/js/kh-auth.js" defer></script>
</head>
<body class="shopping">
  <header class="kh-nav"></header>

  <div class="container">
    <!-- LIST = this trip's check-off list · STAPLES = the repeating master list that "Start a grocery run" copies in -->
    <div class="views">
      <button data-view="list" class="active">🛒 List</button>
      <button data-view="staples">⭐ Staples</button>
      <span class="spacer"></span>
      <button id="start-run" class="run" title="Copy every staple onto the list (skips ones already waiting there)">Start a grocery run</button>
    </div>

    <form class="add-form" id="add-form">
      <input type="text" id="item-name" placeholder="Add an item (eggs, milk, bread...)" required>
      <input type="text" id="item-qty" placeholder="Qty (opt)">
      <input type="text" id="item-store" list="store-list" placeholder="Store (opt)" autocomplete="off">
      <datalist id="store-list"></datalist>
      <button type="submit" id="add-btn">Add</button>
    </form>

    <div class="filters" id="filters">
      <button data-filter="pending" class="active">Pending</button>
      <button data-filter="checked">Bought</button>
      <button data-filter="all">All</button>
      <span class="spacer"></span>
      <button class="danger" id="clear-checked">Clear bought</button>
    </div>
    <div class="run-status" id="run-status" hidden></div>
    <!-- grocery-run PICKER: every-run staples pre-checked, as-needed (long-lasting) ones unchecked -->
    <div class="run-pick" id="run-pick" hidden>
      <div class="rp-head"><strong>Start a grocery run</strong><span class="spacer"></span><button type="button" id="rp-all">all</button><button type="button" id="rp-none">none</button></div>
      <div id="rp-list"></div>
      <div class="rp-foot"><span id="rp-count"></span><span class="spacer"></span><button type="button" id="rp-cancel">Cancel</button><button type="button" id="rp-go" class="run">Add to list</button></div>
    </div>

    <div id="groups"><ul class="item-list"><li class="empty">Loading…</li></ul></div>
  </div>

  <script>window.LINKS_ASIDE_HREF = '../../apps/online/onlinelinks.html';</script>
  <script src="../../apps/assets/js/links-aside.js" defer></script>
  <script type="module">
    import { auth, onAuthStateChanged, database, ref, onValue, push, set, remove, update } from '../../assets/js/firebase-init.js';

    await window.khHeaderReady;

    const STORE_ORDER = ['Costco', 'Aldi', 'Stop & Shop'];   // shown first, in this order; anything else follows A-Z; "Other" is last
    const OTHER = 'Other';
    let basePath = 'public';
    let view = 'list';              // 'list' | 'staples'
    let currentFilter = 'pending';
    let currentItems = {};
    let staples = {};
    let unsubs = [];
    const storeOf = v => (v && String(v.store || '').trim()) || OTHER;
    const norm = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');

    onAuthStateChanged(auth, (user) => {
      basePath = user ? user.uid : 'public';
      subscribe();
    });

    function subscribe() {
      unsubs.forEach(u => { try { u(); } catch (_) {} }); unsubs = [];   // drop the old account's listeners before attaching new ones
      unsubs.push(onValue(ref(database, `${basePath}/household/shopping`), snap => { currentItems = snap.val() || {}; render(); }));
      unsubs.push(onValue(ref(database, `${basePath}/household/staples`), snap => { staples = snap.val() || {}; render(); }));
    }

    function allStores() {
      const seen = new Set([...Object.values(currentItems), ...Object.values(staples)].map(storeOf));
      const extra = [...seen].filter(s => !STORE_ORDER.includes(s) && s !== OTHER).sort((a, b) => a.localeCompare(b));
      return [...STORE_ORDER, ...extra, OTHER];
    }
    // typed store -> the existing spelling when there is one ("aldi" -> "Aldi"), so groups never split on case
    function canonStore(raw) { const t = String(raw || '').trim(); if (!t) return ''; return allStores().find(s => norm(s) === norm(t)) || t; }

    document.getElementById('add-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('item-name').value.trim();
      const qty = document.getElementById('item-qty').value.trim();
      const store = canonStore(document.getElementById('item-store').value);
      if (!name) return;
      if (view === 'staples') push(ref(database, `${basePath}/household/staples`), { name, qty, store, createdAt: Date.now() });
      else push(ref(database, `${basePath}/household/shopping`), { name, qty, store, checked: false, addedAt: Date.now() });
      document.getElementById('item-name').value = '';
      document.getElementById('item-qty').value = '';
      document.getElementById('item-name').focus();        // the store stays filled in: adding several things for one store is the common case
    });

    document.querySelectorAll('.views button[data-view]').forEach(btn => {
      btn.addEventListener('click', () => {
        view = btn.dataset.view;
        document.querySelectorAll('.views button[data-view]').forEach(b => b.classList.toggle('active', b === btn));
        render();
      });
    });

    document.querySelectorAll('.filters button[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.filter;
        document.querySelectorAll('.filters button[data-filter]').forEach(b => b.classList.toggle('active', b === btn));
        render();
      });
    });

    document.getElementById('clear-checked').addEventListener('click', () => {
      if (!confirm('Remove all bought items?')) return;
      const updates = {};
      Object.entries(currentItems).forEach(([id, item]) => { if (item.checked) updates[id] = null; });
      if (Object.keys(updates).length) update(ref(database, `${basePath}/household/shopping`), updates);
    });

    // START A GROCERY RUN = a picker. Staples are STOCK LEVELS (what the house always keeps): the ones bought every run come
    // pre-checked, the long-lasting ones (cadence 'asneeded') unchecked. Add copies the checked ones; anything already waiting is skipped.
    const pick = document.getElementById('run-pick'), pickList = document.getElementById('rp-list');
    function openPicker() {
      if (!Object.keys(staples).length) { const st = document.getElementById('run-status'); st.textContent = 'No staples yet. Open ⭐ Staples and add the things the house always keeps.'; st.hidden = false; setTimeout(() => { st.hidden = true; }, 6000); return; }
      const waiting = new Set(Object.values(currentItems).filter(v => !v.checked).map(v => norm(v.name) + '|' + norm(storeOf(v))));
      const byStore = {}; Object.entries(staples).forEach(([id, s]) => { (byStore[storeOf(s)] = byStore[storeOf(s)] || []).push([id, s]); });
      pickList.innerHTML = '';
      allStores().filter(st => byStore[st]).forEach(store => {
        const h = document.createElement('div'); h.className = 'store-head'; h.innerHTML = `<span class="s">${escapeHtml(store)}</span>`; pickList.appendChild(h);
        byStore[store].sort((a, b) => String(a[1].name).localeCompare(String(b[1].name))).forEach(([id, s]) => {
          const on = waiting.has(norm(s.name) + '|' + norm(storeOf(s)));
          const row = document.createElement('label'); row.className = 'rp-row' + (on ? ' waiting' : '');
          row.innerHTML = `<input type="checkbox" data-id="${id}" ${on ? 'disabled' : ((s.cadence || 'run') === 'run' ? 'checked' : '')}>`
            + `<span class="name">${escapeHtml(s.name)}${s.keep ? ` <span class="keep">keep ${escapeHtml(s.keep)}</span>` : ''}</span>`
            + `<span class="qty">${on ? 'on the list' : escapeHtml(s.qty || '')}</span>`;
          pickList.appendChild(row);
        });
      });
      pick.hidden = false; updatePickCount();
      pickList.querySelectorAll('input').forEach(cb => cb.addEventListener('change', updatePickCount));
    }
    function updatePickCount() { const n = pickList.querySelectorAll('input:checked:not(:disabled)').length; document.getElementById('rp-count').textContent = `${n} to add`; document.getElementById('rp-go').disabled = !n; }
    document.getElementById('start-run').addEventListener('click', () => { pick.hidden ? openPicker() : (pick.hidden = true); });
    document.getElementById('rp-cancel').addEventListener('click', () => { pick.hidden = true; });
    document.getElementById('rp-all').addEventListener('click', () => { pickList.querySelectorAll('input:not(:disabled)').forEach(cb => cb.checked = true); updatePickCount(); });
    document.getElementById('rp-none').addEventListener('click', () => { pickList.querySelectorAll('input:not(:disabled)').forEach(cb => cb.checked = false); updatePickCount(); });
    document.getElementById('rp-go').addEventListener('click', async () => {
      const ids = [...pickList.querySelectorAll('input:checked:not(:disabled)')].map(cb => cb.dataset.id);
      const updates = {}; const now = Date.now();
      ids.forEach((id, i) => { const s = staples[id]; if (!s) return;
        updates[push(ref(database, `${basePath}/household/shopping`)).key] = { name: s.name, qty: s.qty || '', store: s.store || '', checked: false, staple: true, addedAt: now + i }; });
      if (Object.keys(updates).length) await update(ref(database, `${basePath}/household/shopping`), updates);
      pick.hidden = true;
      const st = document.getElementById('run-status'); st.textContent = `Grocery run started: ${ids.length} staple${ids.length === 1 ? '' : 's'} added to the list.`; st.hidden = false; clearTimeout(st._t); st._t = setTimeout(() => { st.hidden = true; }, 6000);
      if (view !== 'list') document.querySelector('.views button[data-view="list"]').click();
    });

    function render() {
      const isList = view === 'list';
      document.getElementById('filters').hidden = !isList;
      document.getElementById('add-btn').textContent = isList ? 'Add' : 'Add staple';
      document.getElementById('item-name').placeholder = isList ? 'Add an item (eggs, milk, bread...)' : 'Add a staple you buy every run';
      document.getElementById('store-list').innerHTML = allStores().filter(s => s !== OTHER).map(s => `<option value="${escapeHtml(s)}">`).join('');

      const source = isList ? currentItems : staples;
      const entries = Object.entries(source).filter(([_, v]) => !isList || currentFilter === 'all' || (currentFilter === 'pending' ? !v.checked : v.checked));
      const host = document.getElementById('groups');
      if (!entries.length) {
        const msg = !isList ? 'No staples yet. Add the things you buy every run, with their store.'
          : currentFilter === 'pending' ? 'Nothing to buy. 🎉' : currentFilter === 'checked' ? 'No bought items yet.' : 'List is empty.';
        host.innerHTML = `<ul class="item-list"><li class="empty">${msg}</li></ul>`;
        return;
      }

      const stores = allStores();
      const byStore = {};
      entries.forEach(e => { (byStore[storeOf(e[1])] = byStore[storeOf(e[1])] || []).push(e); });
      host.innerHTML = '';
      stores.filter(s => byStore[s]).forEach(store => {
        const rows = byStore[store].sort((a, b) => (Number(!!a[1].checked) - Number(!!b[1].checked)) || String(a[1].name).localeCompare(String(b[1].name)));
        const left = rows.filter(r => !r[1].checked).length;
        const h = document.createElement('div'); h.className = 'store-head';
        h.innerHTML = `<span class="s">${escapeHtml(store)}</span><span class="c">${isList ? `${left} to get` + (rows.length - left ? ` · ${rows.length - left} bought` : '') : `${rows.length} staple${rows.length === 1 ? '' : 's'}`}</span>`;
        host.appendChild(h);
        const ul = document.createElement('ul'); ul.className = 'item-list';
        rows.forEach(([id, item]) => {
          const li = document.createElement('li');
          if (item.checked) li.classList.add('checked');
          const opts = stores.map(s => `<option value="${escapeHtml(s)}"${s === store ? ' selected' : ''}>${escapeHtml(s)}</option>`).join('');
          li.innerHTML = (isList ? `<input type="checkbox" ${item.checked ? 'checked' : ''} data-id="${id}">` : `<span class="star">⭐</span>`) + `
            <span class="name">${escapeHtml(item.name)}${isList && item.staple ? ' <span class="tag" title="came from your staples">⭐</span>' : ''}${!isList && item.keep ? ` <span class="keep" title="what the house always keeps">keep ${escapeHtml(item.keep)}</span>` : ''}${!isList ? ` <button type="button" class="cad ${(item.cadence || 'run') === 'run' ? 'run' : 'need'}" data-id="${id}" title="every run = bought each trip; as needed = lasts a long time, only when low">${(item.cadence || 'run') === 'run' ? 'every run' : 'as needed'}</button>` : ''}</span>
            <span class="qty">${escapeHtml(item.qty || '')}</span>
            <select class="mv" data-id="${id}" title="Move to another store">${opts}</select>
            <button class="del" data-id="${id}" title="Delete">✕</button>`;
          ul.appendChild(li);
        });
        host.appendChild(ul);
      });

      const node = isList ? 'shopping' : 'staples';
      host.querySelectorAll('input[type=checkbox]').forEach(cb => {
        cb.addEventListener('change', () => {
          update(ref(database, `${basePath}/household/shopping/${cb.dataset.id}`), { checked: cb.checked, checkedAt: cb.checked ? Date.now() : null });
        });
      });
      host.querySelectorAll('button.cad').forEach(b => {
        b.addEventListener('click', () => { const cur = (staples[b.dataset.id] || {}).cadence || 'run'; update(ref(database, `${basePath}/household/staples/${b.dataset.id}`), { cadence: cur === 'run' ? 'asneeded' : 'run' }); });
      });
      host.querySelectorAll('select.mv').forEach(sel => {
        sel.addEventListener('change', () => update(ref(database, `${basePath}/household/${node}/${sel.dataset.id}`), { store: sel.value === OTHER ? '' : sel.value }));
      });
      host.querySelectorAll('button.del').forEach(btn => {
        btn.addEventListener('click', () => {
          if (confirm(isList ? 'Remove this item?' : 'Remove this staple? It will stop being added to future grocery runs.')) {
            remove(ref(database, `${basePath}/household/${node}/${btn.dataset.id}`));
          }
        });
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
  </script>
</body>
</html>
